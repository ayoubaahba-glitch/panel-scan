<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no">

  <title>SCAN PANNEAUX</title>


  <!-- SCANNER QR / CODE-BARRES -->
  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 18px;

      background: #f1f3f6;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #111;
    }


    .container {

      max-width: 650px;

      margin: auto;
    }


    h1 {

      text-align: center;

      font-size: 34px;

      margin: 15px 0 25px;

      font-weight: 800;
    }


    .card {

      background: white;

      border-radius: 25px;

      padding: 25px;

      margin-bottom: 20px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);
    }


    label {

      display: block;

      font-size: 20px;

      font-weight: bold;

      margin-bottom: 10px;
    }


    input,
    select {

      width: 100%;

      height: 60px;

      border: 2px solid #d0d0d0;

      border-radius: 16px;

      padding: 10px 15px;

      font-size: 21px;

      background: white;
    }


    select:focus,
    input:focus {

      outline: none;

      border-color: #2563eb;
    }


    .current {

      margin-top: 15px;

      background: #f5f6f8;

      border-radius: 20px;

      padding: 20px;

      text-align: center;
    }


    .current-title {

      font-size: 19px;

      color: #666;

      margin-bottom: 5px;
    }


    .current-value {

      font-size: 35px;

      font-weight: 800;
    }


    button {

      width: 100%;

      min-height: 62px;

      border: none;

      border-radius: 17px;

      font-size: 21px;

      font-weight: bold;

      color: white;

      margin-top: 12px;

      cursor: pointer;
    }


    .camera {

      background: #16a34a;
    }


    .save {

      background: #2563eb;
    }


    .stop {

      background: #dc2626;
    }


    #reader {

      width: 100%;

      margin-top: 18px;

      border-radius: 15px;

      overflow: hidden;

      display: none;
    }


    .message {

      display: none;

      margin-top: 18px;

      padding: 18px;

      border-radius: 18px;

      text-align: center;

      font-size: 19px;

      font-weight: bold;
    }


    .success {

      display: block;

      background: #dcfce7;

      color: #166534;
    }


    .error {

      display: block;

      background: #fee2e2;

      color: #991b1b;
    }


    .loading {

      text-align: center;

      color: #666;

      padding: 10px;
    }


    .small {

      font-size: 15px;

      color: #666;

      margin-top: 8px;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📋 SCAN PANNEAUX
  </h1>


  <!-- INTERVENANT -->

  <div class="card">

    <label>
      👷 INTERVENANT
    </label>

    <input
      id="intervenant"
      type="text"
      placeholder="Nom de l'intervenant"
      autocomplete="off">

  </div>



  <!-- REPERE -->

  <div class="card">

    <label>
      📍 REPÈRE
    </label>


    <select id="repere"
            onchange="choisirRepere()">

      <option value="">
        -- Choisir le repère --
      </option>

    </select>


    <div class="current">

      <div class="current-title">
        REPÈRE ACTUEL
      </div>

      <div
        id="repereActuel"
        class="current-value">

        Aucun

      </div>

    </div>

  </div>



  <!-- CAMERA -->

  <div class="card">

    <button
      class="camera"
      onclick="ouvrirCamera()">

      📷 OUVRIR LA CAMÉRA

    </button>


    <div id="reader"></div>


    <button
      id="btnStop"
      class="stop"
      onclick="fermerCamera()"
      style="display:none">

      ✖ FERMER LA CAMÉRA

    </button>

  </div>



  <!-- SN -->

  <div class="card">

    <label>
      SN
    </label>


    <input
      id="sn"
      type="text"
      inputmode="text"
      placeholder="Scanner ou saisir le SN"
      autocomplete="off">


    <div class="small">

      Vous pouvez scanner le QR/code-barres
      ou saisir le SN manuellement.

    </div>


    <button
      class="save"
      onclick="enregistrerSN()">

      ✅ ENREGISTRER SN

    </button>


    <div
      id="message"
      class="message">
    </div>

  </div>


</div>



<script>


/* =====================================================
   VARIABLES
===================================================== */

let scanner = null;

let cameraActive = false;

let repereSelectionne = '';



/* =====================================================
   CHARGEMENT DES REPÈRES
===================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    chargerReperes();

  }
);



function chargerReperes() {


  const select =
    document.getElementById('repere');


  select.innerHTML =
    '<option value="">Chargement...</option>';


  google.script.run

    .withSuccessHandler(
      function(reperes) {


        select.innerHTML =
          '<option value="">-- Choisir le repère --</option>';


        if (!reperes ||
            reperes.length === 0) {

          select.innerHTML =
            '<option value="">Aucun repère trouvé</option>';

          afficherMessage(
            'Aucun repère trouvé dans Sheet1 colonne C.',
            false
          );

          return;
        }


        reperes.forEach(
          function(repere) {


            const option =
              document.createElement('option');


            option.value =
              repere;


            option.textContent =
              repere;


            select.appendChild(option);

          }
        );


      }
    )


    .withFailureHandler(
      function(error) {


        select.innerHTML =
          '<option value="">Erreur</option>';


        afficherMessage(
          'Erreur : ' + error.message,
          false
        );

      }
    )


    .getReperes();

}



/* =====================================================
   CHOISIR REPERE
===================================================== */

function choisirRepere() {


  const select =
    document.getElementById('repere');


  repereSelectionne =
    select.value;


  const affichage =
    document.getElementById('repereActuel');


  if (!repereSelectionne) {

    affichage.textContent =
      'Aucun';

    return;
  }


  /*
   * Affichage immédiat
   */

  affichage.textContent =
    repereSelectionne;


  /*
   * On demande au serveur
   * de chercher le repère.
   */

  google.script.run

    .withSuccessHandler(
      function(result) {


        if (result.ok) {

          afficherMessage(
            '📍 Repère trouvé ligne ' +
            result.row,
            true
          );

        }

      }
    )


    .withFailureHandler(
      function(error) {


        afficherMessage(
          error.message,
          false
        );

      }
    )


    .chercherRepere(
      repereSelectionne
    );

}



/* =====================================================
   OUVRIR CAMERA
===================================================== */

function ouvrirCamera() {


  if (!repereSelectionne) {

    alert(
      '⚠️ Choisissez d’abord un REPÈRE.'
    );

    return;
  }


  const reader =
    document.getElementById('reader');


  reader.style.display =
    'block';


  document.getElementById(
    'btnStop'
  ).style.display =
    'block';


  scanner =
    new Html5Qrcode('reader');


  const config = {

    fps: 10,

    qrbox: function(
      width,
      height
    ) {

      const size =
        Math.min(
          width,
          height
        ) * 0.70;

      return {
        width: size,
        height: size
      };

    },

    aspectRatio: 1.0,

    formatsToSupport: [

      Html5QrcodeSupportedFormats.QR_CODE,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.CODE_93,

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E,

      Html5QrcodeSupportedFormats.ITF,

      Html5QrcodeSupportedFormats.DATA_MATRIX

    ]

  };


  scanner.start(

    {
      facingMode: 'environment'
    },

    config,

    function(decodedText) {


      /*
       * CODE TROUVÉ
       */

      document.getElementById(
        'sn'
      ).value =
        decodedText;


      afficherMessage(
        '✅ Code détecté : ' +
        decodedText,
        true
      );


      /*
       * Fermer caméra
       */

      fermerCamera();


    },

    function(errorMessage) {

      /*
       * Erreurs normales pendant
       * la recherche du code.
       *
       * On ne montre rien.
       */

    }

  )

  .then(function() {

    cameraActive = true;

  })

  .catch(function(error) {

    afficherMessage(
      'Impossible d’ouvrir la caméra : ' +
      error,
      false
    );

  });

}



/* =====================================================
   FERMER CAMERA
===================================================== */

function fermerCamera() {


  if (scanner &&
      cameraActive) {


    scanner.stop()

      .then(function() {


        scanner.clear();


        cameraActive =
          false;


        document.getElementById(
          'reader'
        ).style.display =
          'none';


        document.getElementById(
          'btnStop'
        ).style.display =
          'none';


      })

      .catch(function(error) {

        console.log(error);

      });

  }

}



/* =====================================================
   ENREGISTRER SN
===================================================== */

function enregistrerSN() {


  const intervenant =
    document.getElementById(
      'intervenant'
    ).value.trim();


  const repere =
    document.getElementById(
      'repere'
    ).value.trim();


  const sn =
    document.getElementById(
      'sn'
    ).value.trim();



  /*
   * CONTRÔLES
   */

  if (!intervenant) {

    alert(
      '⚠️ Veuillez saisir l’intervenant.'
    );

    return;
  }


  if (!repere) {

    alert(
      '⚠️ Veuillez choisir un repère.'
    );

    return;
  }


  if (!sn) {

    alert(
      '⚠️ Veuillez scanner ou saisir le SN.'
    );

    return;
  }



  afficherMessage(
    '⏳ Enregistrement en cours...',
    true
  );



  /*
   * ENVOI À GOOGLE SHEET
   */

  google.script.run

    .withSuccessHandler(
      function(result) {


        afficherMessage(

          '✅ ENREGISTREMENT OK<br><br>' +

          'REPÈRE : <b>' +
          result.repere +
          '</b><br>' +

          'SN : <b>' +
          result.sn +
          '</b><br>' +

          'LIGNE : ' +
          result.row,

          true

        );


        /*
         * Vider le SN
         */

        document.getElementById(
          'sn'
        ).value = '';


      }
    )


    .withFailureHandler(
      function(error) {


        afficherMessage(

          '❌ ' +
          error.message,

          false

        );

      }
    )


    .saveScan({

      intervenant:
        intervenant,

      repere:
        repere,

      sn:
        sn,

      typeScan:
        'CAMERA'

    });

}



/* =====================================================
   MESSAGE
===================================================== */

function afficherMessage(
  texte,
  succes
) {


  const message =
    document.getElementById(
      'message'
    );


  message.innerHTML =
    texte;


  message.className =
    'message ' +
    (
      succes
        ? 'success'
        : 'error'
    );


}

</script>


</body>

</html>
