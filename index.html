<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SCAN PANNEAUX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #222;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: 25px auto;
    }

    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    select,
    input {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      border: 1px solid #bbb;
      border-radius: 12px;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 12px;
      font-size: 23px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .camera-btn {
      background: #16a34a;
      color: white;
    }

    .save-btn {
      background: #2563eb;
      color: white;
    }

    .camera-btn:hover {
      background: #15803d;
    }

    .save-btn:hover {
      background: #1d4ed8;
    }

    .current {
      text-align: center;
    }

    .current-title {
      font-size: 20px;
      color: #666;
    }

    .current-repere {
      font-size: 32px;
      font-weight: bold;
      margin: 5px 0;
    }

    .current-position {
      font-size: 22px;
    }

    .message {
      display: none;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    #cameraBox {
      display: none;
      margin-top: 15px;
    }

    #video {
      width: 100%;
      border-radius: 15px;
      background: black;
    }

    .close-camera {
      background: #dc2626;
      color: white;
    }

    .loading {
      text-align: center;
      color: #555;
      font-size: 18px;
    }

    .remaining {
      text-align: center;
      font-size: 20px;
      margin-top: 12px;
    }

    @media(max-width:600px) {
      h1 {
        font-size: 28px;
      }

      select,
      input {
        font-size: 19px;
      }

      button {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📋 SCAN PANNEAUX</h1>

  <!-- REPERE -->
  <div class="card">

    <label>👷 REPERE / INSPECTEUR</label>

    <select id="repere">
      <option value="">-- Sélectionner le REPERE --</option>
    </select>

    <div class="loading" id="loadingRepere">
      Chargement des REPERE...
    </div>

  </div>


  <!-- REPERE ACTUEL -->
  <div class="card current">

    <div class="current-title">
      REPERE ACTUEL
    </div>

    <div class="current-repere" id="currentRepere">
      Aucun
    </div>

    <div class="current-position" id="currentPosition">
      -
    </div>

    <div class="remaining" id="remaining">
    </div>

  </div>


  <!-- CAMERA -->
  <div class="card">

    <button
      class="camera-btn"
      onclick="openCamera()">
      📷 OUVRIR LA CAMÉRA
    </button>

    <div id="cameraBox">

      <video
        id="video"
        autoplay
        playsinline>
      </video>

      <button
        class="close-camera"
        onclick="closeCamera()">
        ❌ FERMER LA CAMÉRA
      </button>

    </div>

  </div>


  <!-- SN -->
  <div class="card">

    <label>SN</label>

    <input
      id="sn"
      type="text"
      placeholder="Scanner ou saisir le SN..."
      autocomplete="off"
      autofocus>

    <button
      class="save-btn"
      onclick="saveSN()">
      ✅ ENREGISTRER SN
    </button>

  </div>


  <!-- MESSAGE -->
  <div id="message" class="message"></div>

</div>


<script>

/*
========================================================
 GOOGLE APPS SCRIPT
========================================================
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec";


/*
========================================================
 VARIABLES
========================================================
*/

let currentRepere = "";
let cameraStream = null;
let scanning = false;


/*
========================================================
 AFFICHER MESSAGE
========================================================
*/

function showMessage(text, type = "info") {

  const box = document.getElementById("message");

  box.className = "message " + type;

  box.textContent = text;

}


/*
========================================================
 CHARGER LES REPERE
========================================================
*/

function loadReperes() {

  document.getElementById("loadingRepere").style.display = "block";

  jsonp(
    API_URL + "?action=getReperes",
    function(data) {

      document.getElementById("loadingRepere").style.display = "none";

      if (!data || !data.ok) {

        showMessage(
          "Impossible de charger les REPERE.",
          "error"
        );

        return;
      }

      const select =
        document.getElementById("repere");

      select.innerHTML =
        '<option value="">-- Sélectionner le REPERE --</option>';

      data.reperes.forEach(function(repere) {

        const option =
          document.createElement("option");

        option.value = repere;
        option.textContent = repere;

        select.appendChild(option);

      });

    },
    function(error) {

      document.getElementById("loadingRepere").style.display = "none";

      showMessage(
        "Impossible de contacter Google Sheet.",
        "error"
      );

      console.error(error);

    }
  );
}


/*
========================================================
 JSONP
========================================================
*/

function jsonp(url, success, error) {

  const callbackName =
    "jsonpCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  const script =
    document.createElement("script");

  let finished = false;

  window[callbackName] =
    function(data) {

      finished = true;

      try {
        success(data);
      } finally {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }
    };


  script.onerror = function() {

    if (finished) return;

    finished = true;

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    if (error) {
      error("Erreur réseau");
    }

  };


  const separator =
    url.includes("?") ? "&" : "?";

  script.src =
    url +
    separator +
    "callback=" +
    encodeURIComponent(callbackName) +
    "&_=" +
    Date.now();


  document.body.appendChild(script);


  /*
   * Timeout de sécurité
   */

  setTimeout(function() {

    if (finished) return;

    finished = true;

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    if (error) {
      error("Timeout");
    }

  }, 15000);

}


/*
========================================================
 CHANGEMENT DE REPERE
========================================================
*/

document
.getElementById("repere")
.addEventListener("change", function() {

  currentRepere = this.value;

  document
    .getElementById("currentRepere")
    .textContent =
      currentRepere || "Aucun";

  document
    .getElementById("currentPosition")
    .textContent = "-";

  document
    .getElementById("remaining")
    .textContent = "";

});


/*
========================================================
 ENREGISTRER SN
========================================================
*/

function saveSN() {

  const sn =
    document
      .getElementById("sn")
      .value
      .trim();

  const repere =
    document
      .getElementById("repere")
      .value
      .trim();


  /*
   * Vérification REPERE
   */

  if (!repere) {

    showMessage(
      "Veuillez sélectionner un REPERE.",
      "error"
    );

    return;
  }


  /*
   * Vérification SN
   */

  if (!sn) {

    showMessage(
      "Veuillez saisir ou scanner un SN.",
      "error"
    );

    return;
  }


  showMessage(
    "⏳ Enregistrement du SN...",
    "info"
  );


  /*
   * Désactiver bouton pendant l'envoi
   */

  const button =
    document.querySelector(".save-btn");

  button.disabled = true;


  /*
   * Appel Google Apps Script
   */

  const url =
    API_URL +
    "?action=save" +
    "&sn=" +
    encodeURIComponent(sn) +
    "&repere=" +
    encodeURIComponent(repere);


  jsonp(
    url,

    function(data) {

      button.disabled = false;


      /*
       * ERREUR
       */

      if (!data || !data.ok) {

        if (data && data.duplicate) {

          showMessage(
            "⚠️ " + data.message,
            "error"
          );

        } else {

          showMessage(
            data && data.message
              ? data.message
              : "Erreur lors de l'enregistrement.",
            "error"
          );

        }

        return;
      }


      /*
       * SUCCÈS
       */

      showMessage(
        "✅ " + data.message,
        "success"
      );


      /*
       * Afficher position
       */

      document
        .getElementById("currentRepere")
        .textContent =
          data.repere;


      document
        .getElementById("currentPosition")
        .textContent =
          "Position : " + data.position;


      /*
       * Afficher restant
       */

      document
        .getElementById("remaining")
        .textContent =
          "📦 Panneaux restants : " +
          data.remaining;


      /*
       * Vider SN
       */

      document
        .getElementById("sn")
        .value = "";


      /*
       * Remettre le curseur
       */

      document
        .getElementById("sn")
        .focus();

    },

    function(error) {

      button.disabled = false;

      showMessage(
        "❌ Impossible de contacter Google Sheet.",
        "error"
      );

      console.error(error);

    }
  );

}


/*
========================================================
 ENTER = ENREGISTRER
========================================================
*/

document
.getElementById("sn")
.addEventListener("keydown", function(event) {

  if (event.key === "Enter") {

    event.preventDefault();

    saveSN();

  }

});


/*
========================================================
 CAMERA
========================================================
*/

async function openCamera() {

  const video =
    document.getElementById("video");

  const box =
    document.getElementById("cameraBox");


  try {

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });


    video.srcObject =
      cameraStream;

    box.style.display =
      "block";

    scanning = true;

    scanBarcode();

  } catch (error) {

    showMessage(
      "❌ Impossible d'ouvrir la caméra. Vérifiez l'autorisation du navigateur.",
      "error"
    );

    console.error(error);

  }

}


/*
========================================================
 FERMER CAMERA
========================================================
*/

function closeCamera() {

  scanning = false;

  if (cameraStream) {

    cameraStream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    cameraStream = null;
  }


  document
    .getElementById("video")
    .srcObject = null;


  document
    .getElementById("cameraBox")
    .style.display = "none";

}


/*
========================================================
 SCANNER CODE-BARRES
========================================================
*/

async function scanBarcode() {

  if (!scanning) {
    return;
  }


  /*
   * BarcodeDetector disponible
   */

  if ("BarcodeDetector" in window) {

    try {

      const detector =
        new BarcodeDetector({
          formats: [
            "code_128",
            "code_39",
            "ean_13",
            "ean_8",
            "qr_code"
          ]
        });


      const video =
        document.getElementById("video");


      const detect =
        async function() {

          if (!scanning) {
            return;
          }


          try {

            const codes =
              await detector.detect(video);


            if (codes.length > 0) {

              const value =
                codes[0].rawValue;


              if (value) {

                document
                  .getElementById("sn")
                  .value = value;


                closeCamera();

                document
                  .getElementById("sn")
                  .focus();

                showMessage(
                  "📷 SN détecté : " + value,
                  "success"
                );

                return;
              }

            }

          } catch (e) {

            console.error(e);

          }


          requestAnimationFrame(detect);

        };


      detect();

    } catch (error) {

      console.error(error);

      showMessage(
        "Caméra ouverte. Saisie manuelle nécessaire pour ce navigateur.",
        "info"
      );

    }

  } else {

    showMessage(
      "📷 Caméra ouverte. Votre navigateur ne supporte pas le scan automatique. Saisissez le SN manuellement.",
      "info"
    );

  }

}


/*
========================================================
 DEMARRAGE
========================================================
*/

window.addEventListener(
  "load",
  function() {

    loadReperes();

  }
);

</script>

</body>
</html>
