<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SCAN PANNEAUX</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f1f3f6;

  color: #111;
}


.container {

  width: 100%;

  max-width: 900px;

  margin: auto;

  padding: 20px;
}


h1 {

  text-align: center;

  font-size: 36px;

  margin: 20px 0 30px;
}


.card {

  background: white;

  border-radius: 18px;

  padding: 22px;

  margin-bottom: 20px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.10);
}


label {

  display: block;

  font-size: 22px;

  font-weight: bold;

  margin-bottom: 10px;
}


select,
input {

  width: 100%;

  padding: 18px;

  font-size: 22px;

  border: 1px solid #bbb;

  border-radius: 12px;

  outline: none;
}


select:focus,
input:focus {

  border-color: #2864e8;
}


button {

  width: 100%;

  border: 0;

  border-radius: 12px;

  padding: 20px;

  font-size: 24px;

  font-weight: bold;

  cursor: pointer;

  margin-top: 15px;
}


.camera-btn {

  background: #16a34a;

  color: white;
}


.save-btn {

  background: #2864e8;

  color: white;
}


.repere-box {

  text-align: center;

  padding: 20px;
}


.repere-title {

  font-size: 20px;

  color: #555;
}


.repere-value {

  font-size: 34px;

  font-weight: bold;

  margin: 5px;
}


.remaining {

  font-size: 22px;

  color: #555;
}


.message {

  display: none;

  padding: 18px;

  border-radius: 12px;

  font-size: 20px;

  font-weight: bold;

  text-align: center;

  margin-top: 15px;
}


.success {

  display: block;

  background: #dcfce7;

  color: #166534;
}


.error {

  display: block;

  background: #fee2e2;

  color: #991b1b;
}


.warning {

  display: block;

  background: #fef3c7;

  color: #92400e;
}


.camera-area {

  display: none;

  margin-top: 15px;

  text-align: center;
}


video {

  width: 100%;

  max-height: 400px;

  border-radius: 15px;

  background: black;
}


.small {

  color: #666;

  text-align: center;

  margin-top: 10px;
}


@media (max-width: 600px) {

  h1 {
    font-size: 28px;
  }

  label {
    font-size: 19px;
  }

  select,
  input {
    font-size: 19px;
  }

  button {
    font-size: 20px;
  }

}

</style>

</head>


<body>


<div class="container">


<h1>
📋 SCAN PANNEAUX
</h1>


<!-- REPERE -->

<div class="card">

<label>
👷 REPERE / INSPECTEUR
</label>


<select id="repere">

<option value="">
-- Sélectionner le REPERE --
</option>

</select>


<p class="small">
Le REPERE détermine la chaîne à inspecter.
</p>

</div>



<!-- REPERE ACTUEL -->

<div class="card repere-box">

<div class="repere-title">
REPERE ACTUEL
</div>


<div
  id="currentRepere"
  class="repere-value"
>
Aucun
</div>


<div
  id="remaining"
  class="remaining"
>
-
</div>

</div>



<!-- CAMERA -->

<div class="card">

<button
  class="camera-btn"
  onclick="openCamera()"
>
📷 OUVRIR LA CAMÉRA
</button>


<div
  id="cameraArea"
  class="camera-area"
>

<video
  id="video"
  autoplay
  playsinline
></video>

<button
  onclick="closeCamera()"
>
❌ FERMER CAMÉRA
</button>

</div>

</div>



<!-- SN -->

<div class="card">

<label>
SN
</label>


<input
  id="sn"
  type="text"
  placeholder="Scanner ou saisir le SN..."
  autocomplete="off"
/>


<button
  class="save-btn"
  onclick="saveSN()"
>
✅ ENREGISTRER SN
</button>


<div
  id="message"
  class="message"
></div>

</div>


</div>



<script>


/****************************************************
 * GOOGLE APPS SCRIPT API
 ****************************************************/

const API_URL =
'https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec';



/****************************************************
 * JSONP
 ****************************************************/

function callAPI(params) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'jsonp_' +
      Date.now() +
      '_' +
      Math.floor(Math.random() * 100000);


    const script =
      document.createElement('script');


    const query =
      new URLSearchParams(params);


    query.set(
      'callback',
      callbackName
    );


    script.src =
      API_URL +
      '?' +
      query.toString();


    window[callbackName] =
      function(data) {

        delete window[callbackName];

        script.remove();

        resolve(data);
      };


    script.onerror =
      function() {

        delete window[callbackName];

        script.remove();

        reject(
          new Error(
            'Impossible de contacter Google Sheet.'
          )
        );
      };


    document.body.appendChild(script);


    setTimeout(function() {

      if (window[callbackName]) {

        delete window[callbackName];

        script.remove();

        reject(
          new Error(
            'Timeout Google Sheet.'
          )
        );
      }

    }, 15000);

  });

}



/****************************************************
 * MESSAGE
 ****************************************************/

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById('message');


  box.className =
    'message ' + type;


  box.textContent = text;

}



/****************************************************
 * CHARGER LES REPÈRES
 ****************************************************/

async function loadReperes() {

  try {

    const result =
      await callAPI({
        action: 'getReperes'
      });


    if (!result.ok) {

      showMessage(
        result.message ||
        'Erreur chargement REPERE',
        'error'
      );

      return;
    }


    const select =
      document.getElementById('repere');


    select.innerHTML =
      '<option value="">-- Sélectionner le REPERE --</option>';


    result.reperes.forEach(function(repere) {

      const option =
        document.createElement('option');


      option.value = repere;

      option.textContent = repere;


      select.appendChild(option);

    });


  } catch (error) {

    showMessage(
      error.message,
      'error'
    );

  }

}



/****************************************************
 * CHANGEMENT REPERE
 ****************************************************/

document
  .getElementById('repere')
  .addEventListener(
    'change',
    function() {

      const repere =
        this.value;


      document
        .getElementById('currentRepere')
        .textContent =
        repere || 'Aucun';


      if (!repere) {

        document
          .getElementById('remaining')
          .textContent = '-';

        return;
      }

      document
        .getElementById('remaining')
        .textContent =
        'Prêt pour le scan';

    }
  );



/****************************************************
 * ENREGISTRER SN
 ****************************************************/

async function saveSN() {

  const repere =
    document
      .getElementById('repere')
      .value
      .trim();


  const sn =
    document
      .getElementById('sn')
      .value
      .trim();


  if (!repere) {

    showMessage(
      'Veuillez sélectionner un REPERE.',
      'warning'
    );

    return;
  }


  if (!sn) {

    showMessage(
      'Veuillez saisir ou scanner le SN.',
      'warning'
    );

    return;
  }


  showMessage(
    'Enregistrement...',
    'warning'
  );


  try {

    const result =
      await callAPI({

        action: 'save',

        sn: sn,

        repere: repere

      });


    if (result.ok) {


      showMessage(
        result.message,
        'success'
      );


      document
        .getElementById('remaining')
        .textContent =
        'Panneaux restants : ' +
        result.remaining;


      document
        .getElementById('sn')
        .value = '';


      document
        .getElementById('sn')
        .focus();


      return;
    }


    if (result.duplicate) {

      showMessage(
        result.message,
        'error'
      );

      return;
    }


    if (result.full) {

      showMessage(
        result.message,
        'warning'
      );

      return;
    }


    showMessage(
      result.message ||
      'Erreur enregistrement.',
      'error'
    );


  } catch (error) {

    showMessage(
      error.message,
      'error'
    );

  }

}



/****************************************************
 * ENTER = ENREGISTRER
 ****************************************************/

document
  .getElementById('sn')
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {

        event.preventDefault();

        saveSN();
      }

    }
  );



/****************************************************
 * CAMERA
 ****************************************************/

let stream = null;


async function openCamera() {

  const area =
    document
      .getElementById('cameraArea');


  const video =
    document
      .getElementById('video');


  try {

    stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: 'environment'
            }
          },

          audio: false

        });


    video.srcObject =
      stream;


    area.style.display =
      'block';


  } catch (error) {

    showMessage(
      'Impossible d’ouvrir la caméra. Vérifiez les permissions du navigateur.',
      'error'
    );

  }

}



/****************************************************
 * FERMER CAMERA
 ****************************************************/

function closeCamera() {

  const area =
    document
      .getElementById('cameraArea');


  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    stream = null;
  }


  area.style.display =
    'none';

}



/****************************************************
 * START
 ****************************************************/

loadReperes();

document
  .getElementById('sn')
  .focus();


</script>


</body>

</html>
