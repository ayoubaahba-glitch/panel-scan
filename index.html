<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>SCAN PANNEAUX</title>

  <!-- Scanner QR + CODE BARRE -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f1f3f6;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 15px;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin: 15px 0 25px;
      font-weight: 800;
    }

    .card {
      background: white;
      border-radius: 25px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    label {
      display: block;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      height: 65px;
      border: 2px solid #d0d0d0;
      border-radius: 18px;
      padding: 0 18px;
      font-size: 22px;
      background: white;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2463eb;
    }

    .repere-title {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .current {
      background: #f6f7f9;
      border-radius: 20px;
      padding: 20px;
      margin-top: 15px;
      text-align: center;
    }

    .current-label {
      font-size: 22px;
      color: #666;
    }

    .current-value {
      font-size: 36px;
      font-weight: 800;
      margin-top: 8px;
      word-break: break-word;
    }

    button {
      width: 100%;
      min-height: 65px;
      border: none;
      border-radius: 18px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
      padding: 12px;
    }

    .btn-camera {
      background: #16a34a;
      color: white;
    }

    .btn-camera:disabled {
      background: #9ca3af;
    }

    .btn-save {
      background: #2563eb;
      color: white;
    }

    .btn-save:disabled {
      background: #9ca3af;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    .btn-new {
      background: #111827;
      color: white;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      display: none;
      overflow: hidden;
      border-radius: 20px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 20px;
    }

    .status {
      display: none;
      margin-top: 15px;
      padding: 18px;
      border-radius: 15px;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
    }

    .status-ok {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status-error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status-info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .sn-box {
      margin-top: 20px;
    }

    .scan-type {
      margin-top: 10px;
      color: #555;
      text-align: center;
      font-size: 17px;
    }

    .loading {
      color: #555;
      text-align: center;
      font-size: 18px;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📋 SCAN PANNEAUX</h1>


  <!-- ============================================= -->
  <!-- INTERVENANT -->
  <!-- ============================================= -->

  <div class="card">

    <label for="intervenant">
      👷 INTERVENANT
    </label>

    <input
      type="text"
      id="intervenant"
      placeholder="Nom de l'intervenant"
      autocomplete="name"
    >

  </div>


  <!-- ============================================= -->
  <!-- REPERE -->
  <!-- ============================================= -->

  <div class="card">

    <div class="repere-title">
      📍 REPÈRE
    </div>

    <select id="repere">

      <option value="">
        Chargement...
      </option>

    </select>


    <div class="current">

      <div class="current-label">
        REPÈRE ACTUEL
      </div>

      <div
        class="current-value"
        id="currentRepere"
      >
        Aucun
      </div>

    </div>

  </div>


  <!-- ============================================= -->
  <!-- CAMERA -->
  <!-- ============================================= -->

  <div class="card">

    <button
      id="btnCamera"
      class="btn-camera"
      onclick="ouvrirCamera()"
    >
      📷 OUVRIR LA CAMÉRA
    </button>


    <div id="reader"></div>


    <button
      id="btnStop"
      class="btn-stop"
      onclick="fermerCamera()"
      style="display:none;"
    >
      ⛔ ARRÊTER LA CAMÉRA
    </button>

  </div>


  <!-- ============================================= -->
  <!-- SN -->
  <!-- ============================================= -->

  <div class="card">

    <div class="sn-box">

      <label for="sn">
        SN
      </label>

      <input
        type="text"
        id="sn"
        placeholder="Scanner ou saisir le SN"
        autocomplete="off"
      >

    </div>


    <div
      class="scan-type"
      id="scanType"
    >
      Aucun scan
    </div>


    <button
      id="btnSave"
      class="btn-save"
      onclick="enregistrer()"
    >
      ✅ ENREGISTRER SN
    </button>


    <button
      class="btn-new"
      onclick="nouveauScan()"
    >
      🔄 NOUVEAU SCAN
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>

</div>


<script>

/************************************************************
 * VARIABLES
 ************************************************************/

let scanner = null;

let cameraActive = false;

let dernierScan = '';

let typeDernierScan = 'QR / BARCODE';


/************************************************************
 * AU CHARGEMENT
 ************************************************************/

window.addEventListener(
  'load',
  function() {

    chargerReperes();

  }
);


/************************************************************
 * CHARGER LES REPÈRES DE GOOGLE SHEET
 ************************************************************/

function chargerReperes() {

  const select =
    document.getElementById('repere');

  select.innerHTML =
    '<option value="">Chargement...</option>';

  afficherStatus(
    'Chargement des repères...',
    'info'
  );


  google.script.run

    .withSuccessHandler(
      function(reperes) {

        select.innerHTML =
          '<option value="">-- Choisir le repère --</option>';


        if (
          !reperes ||
          reperes.length === 0
        ) {

          select.innerHTML =
            '<option value="">Aucun repère trouvé</option>';

          afficherStatus(
            'Aucun repère trouvé dans C2:C28.',
            'error'
          );

          return;
        }


        reperes.forEach(
          function(repere) {

            const option =
              document.createElement('option');

            option.value = repere;

            option.textContent = repere;

            select.appendChild(option);

          }
        );


        masquerStatus();

        console.log(
          'Repères chargés :',
          reperes
        );

      }
    )

    .withFailureHandler(
      function(error) {

        console.error(error);

        select.innerHTML =
          '<option value="">Erreur de chargement</option>';

        afficherStatus(
          '❌ Impossible de charger les repères : ' +
          error.message,
          'error'
        );

      }
    )

    .getReperes();

}


/************************************************************
 * CHOIX DU REPERE
 ************************************************************/

document
  .getElementById('repere')
  .addEventListener(
    'change',
    function() {

      const valeur = this.value;

      document
        .getElementById('currentRepere')
        .textContent =
          valeur || 'Aucun';

      if (valeur) {

        afficherStatus(
          'Repère sélectionné : ' + valeur,
          'info'
        );

        setTimeout(
          masquerStatus,
          2000
        );

      }

    }
  );


/************************************************************
 * OUVRIR CAMERA
 ************************************************************/

function ouvrirCamera() {

  const repere =
    document.getElementById('repere').value;


  if (!repere) {

    afficherStatus(
      '⚠️ Choisissez d’abord un repère.',
      'error'
    );

    return;
  }


  const intervenant =
    document
      .getElementById('intervenant')
      .value
      .trim();


  if (!intervenant) {

    afficherStatus(
      '⚠️ Saisissez d’abord le nom de l’intervenant.',
      'error'
    );

    document
      .getElementById('intervenant')
      .focus();

    return;
  }


  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    afficherStatus(
      '❌ Le module scanner n’est pas chargé. Vérifiez Internet.',
      'error'
    );

    return;
  }


  const reader =
    document.getElementById('reader');

  reader.style.display = 'block';


  document
    .getElementById('btnCamera')
    .style.display = 'none';

  document
    .getElementById('btnStop')
    .style.display = 'block';


  afficherStatus(
    '📷 Caméra activée. Placez le QR Code ou code-barres devant la caméra.',
    'info'
  );


  scanner =
    new Html5Qrcode('reader');


  cameraActive = true;


  scanner
    .start(

      {
        facingMode: 'environment'
      },

      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0,

        formatsToSupport: [

          Html5QrcodeSupportedFormats.QR_CODE,

          Html5QrcodeSupportedFormats.CODE_128,

          Html5QrcodeSupportedFormats.CODE_39,

          Html5QrcodeSupportedFormats.CODE_93,

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8,

          Html5QrcodeSupportedFormats.UPC_A,

          Html5QrcodeSupportedFormats.UPC_E,

          Html5QrcodeSupportedFormats.ITF

        ]

      },

      function(decodedText) {

        scanReussi(
          decodedText
        );

      },

      function(errorMessage) {

        // Ne rien afficher.
        // Cette fonction reçoit les erreurs
        // normales quand aucun code n'est visible.

      }

    )

    .catch(
      function(error) {

        console.error(
          'Erreur caméra :',
          error
        );

        cameraActive = false;

        reader.style.display =
          'none';

        document
          .getElementById('btnCamera')
          .style.display = 'block';

        document
          .getElementById('btnStop')
          .style.display = 'none';

        afficherStatus(
          '❌ Impossible d’ouvrir la caméra. Autorisez la caméra dans le navigateur.',
          'error'
        );

      }
    );

}


/************************************************************
 * SCAN REUSSI
 ************************************************************/

function scanReussi(
  decodedText
) {

  if (!decodedText) {
    return;
  }


  // Éviter plusieurs scans du même code
  if (
    dernierScan === decodedText
  ) {
    return;
  }


  dernierScan =
    decodedText;


  const sn =
    String(decodedText)
      .trim();


  document
    .getElementById('sn')
    .value =
      sn;


  document
    .getElementById('scanType')
    .textContent =
      '✅ Code détecté : ' + sn;


  // Vibration téléphone
  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [100, 50, 100]
    );

  }


  afficherStatus(
    '✅ Code détecté. Vérifiez le SN puis cliquez sur ENREGISTRER.',
    'ok'
  );


  // Arrêter caméra après détection
  fermerCamera();


  // Focus
  document
    .getElementById('sn')
    .focus();

}


/************************************************************
 * FERMER CAMERA
 ************************************************************/

function fermerCamera() {

  if (!scanner) {

    document
      .getElementById('reader')
      .style.display = 'none';

    document
      .getElementById('btnCamera')
      .style.display = 'block';

    document
      .getElementById('btnStop')
      .style.display = 'none';

    return;
  }


  scanner
    .stop()

    .then(
      function() {

        scanner.clear();

        scanner = null;

        cameraActive = false;

        document
          .getElementById('reader')
          .style.display = 'none';

        document
          .getElementById('btnCamera')
          .style.display = 'block';

        document
          .getElementById('btnStop')
          .style.display = 'none';

      }
    )

    .catch(
      function(error) {

        console.error(error);

        scanner = null;

        cameraActive = false;

        document
          .getElementById('reader')
          .style.display = 'none';

        document
          .getElementById('btnCamera')
          .style.display = 'block';

        document
          .getElementById('btnStop')
          .style.display = 'none';

      }
    );

}


/************************************************************
 * ENREGISTRER DANS GOOGLE SHEET
 ************************************************************/

function enregistrer() {

  const intervenant =
    document
      .getElementById('intervenant')
      .value
      .trim();


  const repere =
    document
      .getElementById('repere')
      .value
      .trim();


  const sn =
    document
      .getElementById('sn')
      .value
      .trim();


  /******************************************************
   * VALIDATIONS
   ******************************************************/

  if (!intervenant) {

    afficherStatus(
      '⚠️ Saisissez le nom de l’intervenant.',
      'error'
    );

    return;
  }


  if (!repere) {

    afficherStatus(
      '⚠️ Choisissez un repère.',
      'error'
    );

    return;
  }


  if (!sn) {

    afficherStatus(
      '⚠️ Scannez ou saisissez un SN.',
      'error'
    );

    return;
  }


  /******************************************************
   * Désactiver bouton
   ******************************************************/

  const button =
    document.getElementById('btnSave');

  button.disabled = true;

  button.textContent =
    '⏳ ENREGISTREMENT...';


  afficherStatus(
    '⏳ Enregistrement dans Google Sheet...',
    'info'
  );


  /******************************************************
   * APPEL GOOGLE APPS SCRIPT
   ******************************************************/

  google.script.run

    .withSuccessHandler(
      function(result) {

        button.disabled = false;

        button.textContent =
          '✅ ENREGISTRER SN';


        afficherStatus(
          '✅ ENREGISTRÉ ! Repère : ' +
          result.repere +
          ' | SN : ' +
          result.sn,
          'ok'
        );


        // Réinitialiser seulement le SN
        document
          .getElementById('sn')
          .value = '';


        document
          .getElementById('scanType')
          .textContent =
            'Scan enregistré';


        dernierScan = '';


        console.log(
          'Enregistrement réussi :',
          result
        );

      }
    )

    .withFailureHandler(
      function(error) {

        button.disabled = false;

        button.textContent =
          '✅ ENREGISTRER SN';


        console.error(error);


        afficherStatus(
          '❌ Impossible de contacter Google Sheet : ' +
          error.message,
          'error'
        );

      }
    )

    .enregistrerScan({

      intervenant:
        intervenant,

      repere:
        repere,

      sn:
        sn,

      typeScan:
        typeDernierScan

    });

}


/************************************************************
 * NOUVEAU SCAN
 ************************************************************/

function nouveauScan() {

  dernierScan = '';

  document
    .getElementById('sn')
    .value = '';


  document
    .getElementById('scanType')
    .textContent =
      'Aucun scan';


  masquerStatus();


  const repere =
    document
      .getElementById('repere')
      .value;


  if (repere) {

    setTimeout(
      ouvrirCamera,
      300
    );

  }

}


/************************************************************
 * AFFICHER STATUS
 ************************************************************/

function afficherStatus(
  message,
  type
) {

  const box =
    document.getElementById(
      'status'
    );


  box.textContent =
    message;


  box.className =
    'status';


  if (type === 'ok') {

    box.classList.add(
      'status-ok'
    );

  }
  else if (type === 'error') {

    box.classList.add(
      'status-error'
    );

  }
  else {

    box.classList.add(
      'status-info'
    );

  }

}


/************************************************************
 * CACHER STATUS
 ************************************************************/

function masquerStatus() {

  const box =
    document.getElementById(
      'status'
    );

  box.style.display =
    'none';

}


/************************************************************
 * EMPÊCHER RECHARGEMENT / PERTE
 ************************************************************/

window.addEventListener(
  'beforeunload',
  function() {

    if (
      scanner &&
      cameraActive
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>

</body>

</html>
