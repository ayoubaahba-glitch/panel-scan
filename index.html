<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>SCAN PANNEAUX</title>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #eef1f5;
  font-family: Arial, Helvetica, sans-serif;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 620px;
  margin: auto;
  padding: 18px;
}

h1 {
  text-align: center;
  font-size: 38px;
  margin: 10px 0 25px;
}

.card {
  background: white;
  border-radius: 25px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

label {
  display: block;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

input,
select {
  width: 100%;
  height: 58px;
  border: 2px solid #cfd4da;
  border-radius: 18px;
  padding: 0 18px;
  font-size: 20px;
  background: white;
}

input:focus,
select:focus {
  outline: none;
  border-color: #2563eb;
}

button {
  width: 100%;
  min-height: 58px;
  border: none;
  border-radius: 18px;
  margin-top: 12px;
  font-size: 19px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

.btn-green {
  background: #16a34a;
}

.btn-blue {
  background: #2563eb;
}

.btn-dark {
  background: #111827;
}

button:disabled {
  opacity: .55;
}

.status {
  margin-top: 12px;
  padding: 14px;
  border-radius: 15px;
  text-align: center;
  font-weight: bold;
  font-size: 16px;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.info {
  background: #dbeafe;
  color: #1e40af;
}

.repere-current {
  margin-top: 15px;
  background: #f3f4f6;
  border-radius: 18px;
  padding: 20px;
  text-align: center;
}

.repere-current small {
  display: block;
  font-size: 17px;
  color: #555;
}

.repere-current strong {
  display: block;
  margin-top: 5px;
  font-size: 34px;
}

.camera-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
}

.camera-select {
  margin-bottom: 12px;
}

.video-wrapper {
  position: relative;
  width: 100%;
  background: #000;
  border-radius: 20px;
  overflow: hidden;
  display: none;
}

video {
  width: 100%;
  display: block;
  background: #000;
  min-height: 250px;
  object-fit: cover;
}

.scan-frame {
  position: absolute;
  width: 72%;
  height: 30%;
  left: 14%;
  top: 35%;
  border: 3px solid #22c55e;
  border-radius: 15px;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.35);
  pointer-events: none;
}

.camera-info {
  text-align: center;
  margin-top: 10px;
  color: #4b5563;
  font-size: 14px;
}

.hidden {
  display: none !important;
}

.loading {
  text-align: center;
  padding: 12px;
  color: #555;
}

@media(max-width:480px) {

  .container {
    padding: 12px;
  }

  h1 {
    font-size: 32px;
  }

  .card {
    padding: 18px;
  }

  .repere-current strong {
    font-size: 29px;
  }

  input,
  select {
    font-size: 18px;
  }
}
</style>
</head>


<body>

<div class="container">

<h1>📋 SCAN PANNEAUX</h1>


<!-- INTERVENANT -->
<div class="card">

<label>👷 INTERVENANT</label>

<input
  id="intervenant"
  type="text"
  placeholder="Votre nom"
  autocomplete="name"
>

</div>


<!-- REPERE -->
<div class="card">

<label>📍 REPÈRE</label>

<input
  id="repere"
  type="text"
  placeholder="CB1-S1-01"
  autocomplete="off"
  autocapitalize="characters"
>

<div id="repereStatus"></div>

<div class="repere-current">

<small>REPÈRE ACTUEL</small>

<strong id="currentRepere">
Aucun
</strong>

</div>

</div>


<!-- CAMERA -->
<div class="card">

<div class="camera-title">
📷 CAMÉRA
</div>

<select
  id="cameraSelect"
  class="camera-select"
>
<option value="">
Caméra du navigateur
</option>
</select>

<button
  id="openCameraBtn"
  class="btn-green"
>
📷 OUVRIR CAMÉRA
</button>

<div
  id="cameraInfo"
  class="camera-info"
>
Le navigateur choisira automatiquement la caméra arrière.
</div>

<div
  id="videoWrapper"
  class="video-wrapper"
>

<video
  id="video"
  autoplay
  muted
  playsinline
></video>

<div class="scan-frame"></div>

</div>

<div
  id="scanStatus"
  class="status info hidden"
>
Prêt à scanner...
</div>

</div>


<!-- SN -->
<div class="card">

<label>SN</label>

<input
  id="sn"
  type="text"
  placeholder="Scanner ou saisir le SN"
  autocomplete="off"
>

<div
  id="snStatus"
  class="status hidden"
></div>

<button
  id="saveBtn"
  class="btn-blue"
>
✅ ENREGISTRER SN
</button>

<button
  id="newScanBtn"
  class="btn-dark"
>
🔄 NOUVEAU SCAN
</button>

<div
  id="googleStatus"
  class="status hidden"
></div>

</div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

/*
  ⚠️ REMPLACE CETTE URL PAR TON LIEN APPS SCRIPT /exec
*/
const SCRIPT_URL =
  "https://script.google.com/macros/s/TON_ID_ICI/exec";


/* =========================================================
   VARIABLES
========================================================= */

let currentStream = null;
let currentReader = null;
let scanning = false;
let cameraDevices = [];
let currentDeviceId = "";


/* =========================================================
   ELEMENTS
========================================================= */

const intervenant =
  document.getElementById("intervenant");

const repere =
  document.getElementById("repere");

const repereStatus =
  document.getElementById("repereStatus");

const currentRepere =
  document.getElementById("currentRepere");

const cameraSelect =
  document.getElementById("cameraSelect");

const openCameraBtn =
  document.getElementById("openCameraBtn");

const cameraInfo =
  document.getElementById("cameraInfo");

const videoWrapper =
  document.getElementById("videoWrapper");

const video =
  document.getElementById("video");

const scanStatus =
  document.getElementById("scanStatus");

const sn =
  document.getElementById("sn");

const snStatus =
  document.getElementById("snStatus");

const saveBtn =
  document.getElementById("saveBtn");

const newScanBtn =
  document.getElementById("newScanBtn");

const googleStatus =
  document.getElementById("googleStatus");


/* =========================================================
   REPERE
   FORMAT : CBX-SX-XX
   EXEMPLE : CB1-S1-04
========================================================= */

function validateRepere(value) {

  value = value
    .trim()
    .toUpperCase();

  /*
    CB1-S1-01
    CB2-S5-27
  */

  const regex =
    /^CB\d+-S\d+-\d{2}$/;

  return regex.test(value);
}


repere.addEventListener("input", function() {

  const value =
    this.value.trim().toUpperCase();

  this.value = value;

  if (!value) {

    repereStatus.innerHTML = "";

    currentRepere.textContent =
      "Aucun";

    return;
  }

  if (validateRepere(value)) {

    repereStatus.innerHTML =
      '<div class="status success">✅ REPÈRE CORRECT</div>';

    currentRepere.textContent =
      value;

  } else {

    repereStatus.innerHTML =
      '<div class="status error">' +
      '❌ REPÈRE INCORRECT<br>' +
      'Écrire sous la forme : CBX-SX-XX' +
      '</div>';

    currentRepere.textContent =
      "Aucun";
  }

});


/* =========================================================
   CAMERA
========================================================= */


/*
  IMPORTANT :

  On demande d'abord au navigateur :

  facingMode = environment

  Donc Android/Chrome choisit normalement
  la caméra arrière.

  On ne force PAS 0.5x.

  Si le téléphone expose plusieurs caméras,
  elles seront ensuite affichées dans le select.
*/

async function requestCameraPermission() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      });

    /*
      On ferme immédiatement ce premier flux.
      Il servait uniquement à obtenir
      l'autorisation et les noms des caméras.
    */

    stream.getTracks().forEach(track => {
      track.stop();
    });

    return true;

  } catch (error) {

    console.error(error);

    showCameraError(error);

    return false;
  }
}


/*
  Récupération des caméras.
*/
async function loadCameras() {

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.enumerateDevices) {

    showCameraError({
      message:
        "enumerateDevices non supporté"
    });

    return;
  }

  try {

    const devices =
      await navigator.mediaDevices.enumerateDevices();

    cameraDevices =
      devices.filter(
        d => d.kind === "videoinput"
      );

    cameraSelect.innerHTML = "";

    /*
      Première option :
      navigateur / caméra arrière.
    */

    const defaultOption =
      document.createElement("option");

    defaultOption.value = "";

    defaultOption.textContent =
      "📱 Caméra du navigateur — arrière";

    cameraSelect.appendChild(
      defaultOption
    );


    cameraDevices.forEach(
      (device, index) => {

        const option =
          document.createElement("option");

        option.value =
          device.deviceId;

        let label =
          device.label ||
          ("Caméra " + (index + 1));

        option.textContent =
          "📷 " + label;

        cameraSelect.appendChild(
          option
        );
      }
    );


    /*
      On ne sélectionne PAS automatiquement
      une caméra précise.

      Le navigateur garde le choix environment.
    */

    cameraInfo.textContent =
      cameraDevices.length +
      " caméra(s) détectée(s). " +
      "Le navigateur choisira la caméra arrière.";

  } catch (error) {

    console.error(error);

    showCameraError(error);
  }
}


/*
  Ouvre la caméra.
*/
async function openCamera(deviceId = "") {

  /*
    IMPORTANT :

    On arrête complètement l'ancien scanner
    AVANT de démarrer le nouveau.

    Cela évite :
    "Cannot transition to a new state,
     already under transition"
  */

  await stopCamera();


  try {

    let constraints;


    if (deviceId) {

      /*
        Caméra choisie manuellement.
      */

      constraints = {
        video: {
          deviceId: {
            exact: deviceId
          }
        },
        audio: false
      };

    } else {

      /*
        Choix du navigateur :
        caméra arrière.
      */

      constraints = {
        video: {
          facingMode: {
            ideal: "environment"
          }
        },
        audio: false
      };
    }


    currentStream =
      await navigator.mediaDevices
        .getUserMedia(constraints);


    video.srcObject =
      currentStream;

    await video.play();


    videoWrapper.style.display =
      "block";


    scanning = true;


    /*
      Démarrage du scanner.
    */

    await startZXing();


  } catch (error) {

    console.error(
      "Erreur caméra:",
      error
    );

    scanning = false;

    showCameraError(error);
  }
}


/*
  Scanner ZXing.
*/
async function startZXing() {

  if (!window.ZXingBrowser) {

    scanStatus.className =
      "status error";

    scanStatus.textContent =
      "❌ Scanner non chargé.";

    scanStatus.classList.remove(
      "hidden"
    );

    return;
  }


  try {

    currentReader =
      new ZXingBrowser.BrowserMultiFormatReader();


    scanStatus.className =
      "status success";

    scanStatus.textContent =
      "🔍 Scanner actif — placez le code dans le cadre.";

    scanStatus.classList.remove(
      "hidden"
    );


    /*
      Scan avec le flux vidéo déjà ouvert.
    */

    currentReader.decodeFromVideoElement(
      video,
      (result, error) => {

        if (!scanning) return;

        if (result) {

          const text =
            result.getText();

          if (text) {

            handleDetectedCode(
              text,
              result
            );
          }
        }
      }
    );

  } catch (error) {

    console.error(
      "ZXing error:",
      error
    );

    scanStatus.className =
      "status error";

    scanStatus.textContent =
      "❌ Impossible de démarrer le scanner.";

    scanStatus.classList.remove(
      "hidden"
    );
  }
}


/*
  Code détecté.
*/
function handleDetectedCode(
  value,
  result
) {

  value =
    String(value || "").trim();

  if (!value) return;


  sn.value =
    value;


  snStatus.className =
    "status success";

  snStatus.textContent =
    "✅ Code détecté : " + value;

  snStatus.classList.remove(
    "hidden"
  );


  /*
    Vérification immédiate
    du SN dans Google Sheets.
  */

  checkSN(value);
}


/*
  Changement de caméra.
*/
cameraSelect.addEventListener(
  "change",
  async function() {

    const deviceId =
      this.value;

    /*
      Si vide :
      navigateur / caméra arrière.
    */

    await openCamera(deviceId);
  }
);


/*
  Bouton caméra.
*/
openCameraBtn.addEventListener(
  "click",
  async function() {

    this.disabled = true;

    try {

      /*
        Première demande d'autorisation.
      */

      const allowed =
        await requestCameraPermission();

      if (!allowed) return;


      /*
        Après autorisation :
        afficher toutes les caméras.
      */

      await loadCameras();


      /*
        Ouvrir avec le choix du navigateur.
      */

      await openCamera("");

    } finally {

      this.disabled = false;
    }

  }
);


/*
  Arrêt propre de la caméra.
*/
async function stopCamera() {

  scanning = false;


  if (currentReader) {

    try {

      currentReader.reset();

    } catch (e) {

      console.log(
        "Reader déjà arrêté"
      );
    }

    currentReader = null;
  }


  if (currentStream) {

    currentStream
      .getTracks()
      .forEach(track => {

        try {
          track.stop();
        } catch (e) {}

      });

    currentStream = null;
  }


  video.srcObject = null;
}


/* =========================================================
   ERREUR CAMERA
========================================================= */

function showCameraError(error) {

  let message =
    "❌ IMPOSSIBLE D'OUVRIR LA CAMÉRA.";


  if (error) {

    if (
      error.name ===
      "NotAllowedError"
    ) {

      message =
        "❌ CAMÉRA REFUSÉE.<br>" +
        "Autorisez la caméra dans Chrome.";

    }

    else if (
      error.name ===
      "NotFoundError"
    ) {

      message =
        "❌ AUCUNE CAMÉRA TROUVÉE.";

    }

    else if (
      error.name ===
      "NotReadableError"
    ) {

      message =
        "❌ CAMÉRA UTILISÉE PAR UNE AUTRE APPLICATION.";

    }

    else if (
      error.name ===
      "OverconstrainedError"
    ) {

      message =
        "❌ CAMÉRA NON DISPONIBLE.";

    }

    else {

      message +=
        "<br>" +
        String(
          error.message || ""
        );
    }
  }


  scanStatus.className =
    "status error";

  scanStatus.innerHTML =
    message;

  scanStatus.classList.remove(
    "hidden"
  );
}


/* =========================================================
   GOOGLE SHEETS — JSONP
========================================================= */


/*
  JSONP :

  Cette méthode évite les problèmes CORS
  fréquents avec Apps Script sur Android.
*/

function jsonp(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        "jsonpCallback_" +
        Date.now() +
        "_" +
        Math.floor(
          Math.random() * 100000
        );


      const script =
        document.createElement(
          "script"
        );


      const query =
        new URLSearchParams(
          params
        );


      query.set(
        "callback",
        callbackName
      );


      const timeout =
        setTimeout(
          () => {

            cleanup();

            reject(
              new Error(
                "Timeout Google Apps Script"
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timeout);

        try {
          delete window[
            callbackName
          ];
        } catch (e) {}

        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );
        }
      }


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);
        };


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              "Impossible de contacter Google Apps Script"
            )
          );
        };


      script.src =
        SCRIPT_URL +
        "?" +
        query.toString();


      document.body.appendChild(
        script
      );
    }
  );
}


/* =========================================================
   CHECK SN
========================================================= */

async function checkSN(value) {

  value =
    String(value || "").trim();

  if (!value) return;


  snStatus.className =
    "status info";

  snStatus.textContent =
    "🔎 Vérification du SN...";

  snStatus.classList.remove(
    "hidden"
  );


  try {

    const result =
      await jsonp({
        action: "checkSN",
        sn: value
      });


    if (
      result &&
      result.exists
    ) {

      snStatus.className =
        "status error";

      snStatus.textContent =
        "❌ SN DÉJÀ SCANNÉ";

      saveBtn.disabled =
        true;

      return;
    }


    if (
      result &&
      result.success
    ) {

      snStatus.className =
        "status success";

      snStatus.textContent =
        "✅ SN DISPONIBLE";

      saveBtn.disabled =
        false;

      return;
    }


    throw new Error(
      result &&
      result.message
        ? result.message
        : "Réponse invalide"
    );


  } catch (error) {

    console.error(error);

    snStatus.className =
      "status error";

    snStatus.textContent =
      "❌ Impossible de vérifier le SN.";

    snStatus.classList.remove(
      "hidden"
    );

    saveBtn.disabled =
      false;
  }
}


/* =========================================================
   ENREGISTRER
========================================================= */

saveBtn.addEventListener(
  "click",
  async function() {

    const name =
      intervenant.value.trim();

    const rep =
      repere.value.trim().toUpperCase();

    const serial =
      sn.value.trim();


    /*
      Validation intervenant.
    */

    if (!name) {

      showGoogleError(
        "❌ Écrire le nom de l'intervenant."
      );

      intervenant.focus();

      return;
    }


    /*
      Validation repère.
    */

    if (!validateRepere(rep)) {

      repereStatus.innerHTML =
        '<div class="status error">' +
        '❌ REPÈRE INCORRECT<br>' +
        'Format obligatoire : CBX-SX-XX' +
        '</div>';

      repere.focus();

      return;
    }


    /*
      Validation SN.
    */

    if (!serial) {

      sn.focus();

      return;
    }


    this.disabled = true;

    googleStatus.className =
      "status info";

    googleStatus.textContent =
      "⏳ Enregistrement dans Google Sheet...";

    googleStatus.classList.remove(
      "hidden"
    );


    try {

      /*
        Vérification doublon
        juste avant l'enregistrement.
      */

      const check =
        await jsonp({
          action: "checkSN",
          sn: serial
        });


      if (check.exists) {

        googleStatus.className =
          "status error";

        googleStatus.textContent =
          "❌ SN DÉJÀ SCANNÉ";

        snStatus.className =
          "status error";

        snStatus.textContent =
          "❌ SN DÉJÀ SCANNÉ";

        this.disabled = true;

        return;
      }


      /*
        Enregistrement.
      */

      const result =
        await jsonp({

          action: "save",

          intervenant:
            name,

          repere:
            rep,

          sn:
            serial,

          typeScan:
            "QR / CODE-BARRE"

        });


      if (
        result &&
        result.success
      ) {

        googleStatus.className =
          "status success";

        googleStatus.textContent =
          "✅ SN ENREGISTRÉ DANS GOOGLE SHEETS";

        snStatus.className =
          "status success";

        snStatus.textContent =
          "✅ Enregistrement réussi";

        /*
          Nouveau scan.
        */

        setTimeout(
          () => {

            sn.value = "";

            snStatus.classList.add(
              "hidden"
            );

            googleStatus.classList.add(
              "hidden"
            );

            saveBtn.disabled =
              false;

          },
          1500
        );


      } else {

        if (
          result &&
          result.duplicate
        ) {

          googleStatus.className =
            "status error";

          googleStatus.textContent =
            "❌ SN DÉJÀ SCANNÉ";

        } else {

          throw new Error(
            result &&
            result.message
              ? result.message
              : "Erreur inconnue"
          );
        }
      }


    } catch (error) {

      console.error(error);

      googleStatus.className =
        "status error";

      googleStatus.innerHTML =
        "❌ Impossible de contacter Google Sheet.<br>" +
        "Vérifiez le déploiement Apps Script.";

    } finally {

      this.disabled = false;
    }

  }
);


/* =========================================================
   NOUVEAU SCAN
========================================================= */

newScanBtn.addEventListener(
  "click",
  function() {

    sn.value = "";

    snStatus.classList.add(
      "hidden"
    );

    googleStatus.classList.add(
      "hidden"
    );

    saveBtn.disabled =
      false;

    /*
      On garde la caméra ouverte.
      L'utilisateur peut scanner
      directement un nouveau SN.
    */

    if (
      currentStream &&
      scanning
    ) {

      scanStatus.className =
        "status success";

      scanStatus.textContent =
        "🔍 Prêt pour un nouveau scan.";

      scanStatus.classList.remove(
        "hidden"
      );
    }
  }
);


/* =========================================================
   GOOGLE ERROR
========================================================= */

function showGoogleError(message) {

  googleStatus.className =
    "status error";

  googleStatus.innerHTML =
    message;

  googleStatus.classList.remove(
    "hidden"
  );
}


/* =========================================================
   INITIALISATION
========================================================= */

saveBtn.disabled = true;


/*
  On NE demande PAS la caméra au chargement.

  C'est important sur Android :
  la permission doit être déclenchée
  par l'action de l'utilisateur.
*/

window.addEventListener(
  "beforeunload",
  function() {

    stopCamera();

  }
);

</script>

</body>
</html>
