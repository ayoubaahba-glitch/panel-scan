<script>
/* =========================================================
   CAMERA + QR CODE + BARCODE
   Ne modifie pas le reste de ton application
========================================================= */

let scanner = null;
let cameraActive = false;
let changingCamera = false;

const cameraButton = document.getElementById("cameraButton");
const closeCameraButton = document.getElementById("closeCameraButton");
const reader = document.getElementById("reader");
const snInput = document.getElementById("sn");


/* =========================================================
   OUVRIR LA CAMERA
========================================================= */

async function openCamera() {

    if (changingCamera || cameraActive) {
        return;
    }

    changingCamera = true;

    try {

        /* Nettoyer une ancienne caméra */
        await closeCamera();

        if (typeof Html5Qrcode === "undefined") {

            alert(
                "❌ Scanner non chargé.\nVérifiez votre connexion Internet."
            );

            return;
        }


        /* Afficher le lecteur */
        reader.style.display = "block";


        /* Créer le scanner */
        scanner = new Html5Qrcode("reader");


        /*
         * IMPORTANT :
         *
         * On demande directement la caméra arrière.
         * On ne fait PAS un getUserMedia() avant.
         *
         * Cela évite :
         * "Autorisation caméra" en boucle.
         */

        const cameraConfig = {
            facingMode: {
                ideal: "environment"
            }
        };


        /*
         * Zone de scan.
         *
         * 85% de la largeur :
         * permet de lire même si le code
         * n'est pas parfaitement net.
         */

        const config = {

            fps: 15,

            qrbox: function(width, height) {

                const size = Math.floor(
                    Math.min(width, height) * 0.85
                );

                return {
                    width: size,
                    height: size
                };
            },

            /*
             * Permet plusieurs formats.
             */

            formatsToSupport: [

                Html5QrcodeSupportedFormats.QR_CODE,

                Html5QrcodeSupportedFormats.CODE_128,

                Html5QrcodeSupportedFormats.CODE_39,

                Html5QrcodeSupportedFormats.CODE_93,

                Html5QrcodeSupportedFormats.EAN_13,

                Html5QrcodeSupportedFormats.EAN_8,

                Html5QrcodeSupportedFormats.UPC_A,

                Html5QrcodeSupportedFormats.UPC_E,

                Html5QrcodeSupportedFormats.ITF,

                Html5QrcodeSupportedFormats.CODABAR

            ],

            rememberLastUsedCamera: true,

            showTorchButtonIfSupported: true,

            showZoomSliderIfSupported: true,

            defaultZoomValueIfSupported: 1

        };


        /* =================================================
           DEMARRAGE DU SCANNER
        ================================================= */

        await scanner.start(

            cameraConfig,

            config,

            async function(decodedText, decodedResult) {

                if (!decodedText) {
                    return;
                }

                /*
                 * Eviter plusieurs lectures
                 * simultanées du même code.
                 */

                if (!cameraActive) {
                    return;
                }

                cameraActive = false;


                const value =
                    String(decodedText).trim();


                console.log(
                    "CODE SCANNÉ :",
                    value
                );


                /*
                 * Mettre le résultat
                 * dans le champ SN.
                 */

                snInput.value = value;


                /*
                 * Déclencher input
                 * pour ton application existante.
                 */

                snInput.dispatchEvent(
                    new Event(
                        "input",
                        {
                            bubbles: true
                        }
                    )
                );


                /*
                 * STOP après lecture.
                 */

                try {

                    await scanner.stop();

                } catch (e) {

                    console.log(e);

                }


                /*
                 * NE PAS clear immédiatement
                 * avant le stop.
                 */

                try {

                    await scanner.clear();

                } catch (e) {

                    console.log(e);

                }


                scanner = null;


                /*
                 * Scanner fermé après lecture.
                 */

                cameraButton.disabled = false;


                /*
                 * Si ton application possède
                 * déjà checkSN(), on l'utilise.
                 */

                if (
                    typeof checkSN === "function"
                ) {

                    checkSN(value);
                }

            },

            function(errorMessage) {

                /*
                 * Ignorer les erreurs normales
                 * pendant la recherche.
                 *
                 * Le scanner produit énormément
                 * de messages tant qu'il ne trouve
                 * pas de code.
                 */

            }

        );


        cameraActive = true;

        cameraButton.textContent =
            "📷 CAMÉRA ACTIVE";

        cameraButton.disabled = true;


    } catch (error) {

        console.error(
            "Erreur caméra :",
            error
        );


        cameraActive = false;

        scanner = null;


        reader.innerHTML = "";


        let msg =
            "❌ Impossible d'ouvrir la caméra.";


        if (
            error &&
            error.name === "NotAllowedError"
        ) {

            msg =
                "❌ Autorisation caméra refusée.\n" +
                "Dans Chrome : Paramètres → Autorisations → Caméra → Autoriser.";

        }

        else if (
            error &&
            error.name === "NotFoundError"
        ) {

            msg =
                "❌ Aucune caméra trouvée.";

        }

        else if (
            error &&
            error.name === "NotReadableError"
        ) {

            msg =
                "❌ La caméra est utilisée par une autre application.";

        }

        else if (
            error &&
            error.message
        ) {

            msg +=
                "\n" +
                error.message;
        }


        alert(msg);


        cameraButton.disabled = false;

    }

    finally {

        changingCamera = false;

    }
}


/* =========================================================
   FERMER LA CAMERA
========================================================= */

async function closeCamera() {

    cameraActive = false;


    if (scanner) {

        try {

            await scanner.stop();

        } catch (e) {

            console.log(
                "Scanner déjà arrêté."
            );

        }


        try {

            await scanner.clear();

        } catch (e) {

            console.log(
                "Scanner déjà nettoyé."
            );

        }

        scanner = null;
    }


    reader.innerHTML = "";


    cameraButton.disabled = false;

    cameraButton.textContent =
        "📷 OUVRIR LA CAMÉRA";
}


/* =========================================================
   BOUTON OUVRIR
========================================================= */

cameraButton.addEventListener(
    "click",
    function() {

        openCamera();

    }
);


/* =========================================================
   BOUTON FERMER
========================================================= */

closeCameraButton.addEventListener(
    "click",
    function() {

        closeCamera();

    }
);

</script>
