<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>SCAN PANNEAUX</title>


<!--
====================================================
SCANNER QR + BARCODE
====================================================
-->

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

/* ==================================================
   GLOBAL
================================================== */

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #f1f3f6;

  color: #111;

}


.container {

  width: 95%;

  max-width: 900px;

  margin: auto;

  padding:
    20px
    0
    50px;

}


/* ==================================================
   CARD
================================================== */

.card {

  background: white;

  border-radius: 22px;

  padding: 22px;

  margin-bottom: 20px;

  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.10);

}


/* ==================================================
   TITRE
================================================== */

h1 {

  text-align: center;

  margin:
    5px
    0
    25px;

  font-size: 36px;

}


/* ==================================================
   REPÈRE
================================================== */

.position {

  text-align: center;

  padding: 25px;

  background: #f8fafc;

  border-radius: 18px;

}


.position-title {

  color: #555;

  font-size: 22px;

}


.position-value {

  font-size: 48px;

  font-weight: bold;

  margin-top: 8px;

  word-break: break-word;

}


/* ==================================================
   LABEL
================================================== */

.label {

  display: block;

  font-weight: bold;

  font-size: 24px;

  margin-bottom: 12px;

}


/* ==================================================
   INPUT
================================================== */

input {

  width: 100%;

  padding: 20px;

  font-size: 22px;

  border:
    1px solid
    #bbb;

  border-radius: 14px;

  outline: none;

}


input:focus {

  border-color:
    #2563eb;

}


/* ==================================================
   BUTTONS
================================================== */

button {

  width: 100%;

  border: none;

  border-radius: 14px;

  padding: 20px;

  font-size: 22px;

  font-weight: bold;

  cursor: pointer;

  margin-top: 14px;

}


button:disabled {

  opacity: 0.55;

}


/* ==================================================
   CAMERA BUTTON
================================================== */

.btn-camera {

  background: #16a34a;

  color: white;

}


/* ==================================================
   SAVE BUTTON
================================================== */

.btn-save {

  background: #2563eb;

  color: white;

}


/* ==================================================
   STOP BUTTON
================================================== */

.btn-stop {

  background: #dc2626;

  color: white;

}


/* ==================================================
   SCANNER
================================================== */

#reader {

  width: 100%;

  max-width: 650px;

  margin:
    20px
    auto;

  overflow: hidden;

  border-radius: 18px;

}


#reader video {

  width: 100% !important;

  height: auto !important;

  border-radius: 18px;

}


/* ==================================================
   MESSAGE
================================================== */

.status {

  padding: 18px;

  border-radius: 14px;

  margin-top: 18px;

  text-align: center;

  font-size: 19px;

  font-weight: bold;

  display: none;

}


.status.success {

  display: block;

  background: #dcfce7;

  color: #166534;

}


.status.error {

  display: block;

  background: #fee2e2;

  color: #991b1b;

}


.status.info {

  display: block;

  background: #dbeafe;

  color: #1e40af;

}


/* ==================================================
   TEXTE
================================================== */

.small {

  text-align: center;

  color: #666;

  font-size: 15px;

  margin-top: 12px;

}


.hidden {

  display: none !important;

}


/* ==================================================
   MOBILE
================================================== */

@media
(max-width: 600px) {

  .container {

    width: 94%;

    padding-top: 15px;

  }


  .card {

    padding: 20px;

    border-radius: 22px;

  }


  h1 {

    font-size: 34px;

  }


  .position-value {

    font-size: 42px;

  }


  button {

    font-size: 21px;

  }


  input {

    font-size: 21px;

  }

}

</style>

</head>


<body>


<div class="container">


<!-- =================================================
     TITRE + REPÈRE
================================================= -->

<div class="card">

  <h1>
    📋 SCAN PANNEAUX
  </h1>


  <div class="position">

    <div class="position-title">
      REPÈRE ACTUEL
    </div>

    <div
      id="position"
      class="position-value"
    >
      Aucun
    </div>

  </div>

</div>


<!-- =================================================
     CAMERA
================================================= -->

<div class="card">


  <button
    id="openCameraBtn"
    class="btn-camera"
    onclick="startScanner()"
  >
    📷 OUVRIR LA CAMÉRA
  </button>


  <div
    id="scannerArea"
    class="hidden"
  >

    <div id="reader"></div>


    <button
      id="stopCameraBtn"
      class="btn-stop"
      onclick="stopScanner()"
    >
      ⛔ ARRÊTER LA CAMÉRA
    </button>


    <div class="small">

      📱 Utilise la caméra arrière.
      <br>
      Place le QR ou le code-barres
      dans le cadre.

    </div>

  </div>

</div>


<!-- =================================================
     SN
================================================= -->

<div class="card">


  <label class="label">
    SN
  </label>


  <input
    id="sn"
    type="text"
    placeholder="Scanner ou saisir le SN..."
    autocomplete="off"
    autocapitalize="characters"
    spellcheck="false"
  >


  <button
    id="saveBtn"
    class="btn-save"
    onclick="saveSN()"
  >
    ✅ ENREGISTRER SN
  </button>


  <div
    id="status"
    class="status"
  ></div>


</div>


</div>


<script>

/*****************************************************
 * GOOGLE APPS SCRIPT API
 *****************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec";


/*****************************************************
 * VARIABLES SCANNER
 *****************************************************/

let scanner = null;

let scannerRunning = false;

let lastScanned = "";


/*****************************************************
 * MESSAGE
 *****************************************************/

function showStatus(message, type) {

  const box =
    document.getElementById(
      "status"
    );


  box.textContent =
    message;


  box.className =
    "status " + type;

}


/*****************************************************
 * START CAMERA
 *****************************************************/

async function startScanner() {

  if (scannerRunning) {

    return;

  }


  const area =
    document.getElementById(
      "scannerArea"
    );


  area.classList.remove(
    "hidden"
  );


  showStatus(
    "📷 Initialisation de la caméra...",
    "info"
  );


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * Configuration scanner
     */

    const config = {

      fps: 15,


      qrbox:
        function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );


          return {

            width: size,

            height: size

          };

        },


      aspectRatio: 1.0,


      formatsToSupport: [

        Html5QrcodeSupportedFormats.QR_CODE,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_93,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E,

        Html5QrcodeSupportedFormats.ITF,

        Html5QrcodeSupportedFormats.CODABAR,

        Html5QrcodeSupportedFormats.DATA_MATRIX,

        Html5QrcodeSupportedFormats.AZTEC,

        Html5QrcodeSupportedFormats.PDF_417

      ]

    };


    /*
     * Caméra arrière
     */

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,


      /*
       * CODE DÉTECTÉ
       */

      function(
        decodedText,
        decodedResult
      ) {

        handleScan(
          decodedText
        );

      },


      /*
       * Erreur de lecture
       *
       * NE PAS AFFICHER
       */

      function(errorMessage) {

      }

    );


    scannerRunning =
      true;


    document
      .getElementById(
        "openCameraBtn"
      )
      .classList.add(
        "hidden"
      );


    showStatus(
      "📷 Caméra active — place le code dans le cadre.",
      "info"
    );

  }

  catch(error) {

    console.error(
      "CAMERA ERROR:",
      error
    );


    area.classList.add(
      "hidden"
    );


    showStatus(
      "❌ Impossible d'ouvrir la caméra. Autorise l'accès caméra.",
      "error"
    );

  }

}


/*****************************************************
 * CODE SCANNÉ
 *****************************************************/

function handleScan(
  decodedText
) {

  if (!decodedText) {

    return;

  }


  decodedText =
    String(
      decodedText
    ).trim();


  /*
   * Éviter double lecture
   */

  if (
    decodedText ===
    lastScanned
  ) {

    return;

  }


  lastScanned =
    decodedText;


  /*
   * Mettre SN dans champ
   */

  document
    .getElementById(
      "sn"
    )
    .value =
      decodedText;


  showStatus(
    "✅ Code détecté : " +
    decodedText,
    "success"
  );


  /*
   * Stop caméra
   */

  stopScanner();


  /*
   * Enregistrer automatiquement
   */

  setTimeout(
    function() {

      saveSN();

    },
    600
  );

}


/*****************************************************
 * STOP CAMERA
 *****************************************************/

async function stopScanner() {

  if (!scanner) {

    return;

  }


  try {

    if (scannerRunning) {

      await scanner.stop();

    }

  }

  catch(error) {

    console.error(
      "STOP CAMERA:",
      error
    );

  }


  try {

    await scanner.clear();

  }

  catch(error) {

    console.error(
      "CLEAR CAMERA:",
      error
    );

  }


  scanner = null;

  scannerRunning =
    false;


  document
    .getElementById(
      "reader"
    )
    .innerHTML =
      "";


  document
    .getElementById(
      "scannerArea"
    )
    .classList.add(
      "hidden"
    );


  document
    .getElementById(
      "openCameraBtn"
    )
    .classList.remove(
      "hidden"
    );

}


/*****************************************************
 * ENREGISTRER SN
 *
 * JSONP
 * Pas de problème CORS
 *****************************************************/

function saveSN() {

  const input =
    document.getElementById(
      "sn"
    );


  const sn =
    input.value.trim();


  if (!sn) {

    showStatus(
      "⚠️ Scanne ou saisis un SN.",
      "error"
    );

    input.focus();

    return;

  }


  const saveBtn =
    document.getElementById(
      "saveBtn"
    );


  saveBtn.disabled =
    true;


  saveBtn.textContent =
    "⏳ ENREGISTREMENT...";


  showStatus(
    "⏳ Enregistrement dans Google Sheet...",
    "info"
  );


  /*
   * Nom callback unique
   */

  const callbackName =
    "googleSheetCallback_" +
    Date.now();


  /*
   * Fonction appelée par Apps Script
   */

  window[callbackName] =
    function(data) {

      console.log(
        "GOOGLE SHEET:",
        data
      );


      try {

        if (
          data &&
          data.ok &&
          data.data
        ) {

          /*
           * REPÈRE
           */

          const repere =
            data.data.repere ||
            "Aucun";


          document
            .getElementById(
              "position"
            )
            .textContent =
              repere;


          /*
           * Message
           */

          showStatus(

            "✅ SN enregistré avec succès." +
            "\nREPÈRE : " +
            repere,

            "success"

          );


          /*
           * Nettoyer
           */

          input.value =
            "";


          lastScanned =
            "";


        }

        else {

          const message =
            data &&
            data.message
              ? data.message
              : "Erreur Google Sheet.";


          showStatus(
            "❌ " + message,
            "error"
          );

        }

      }

      catch(error) {

        console.error(
          error
        );

        showStatus(
          "❌ Erreur de traitement de la réponse.",
          "error"
        );

      }


      /*
       * Nettoyage
       */

      delete window[
        callbackName
      ];


      const oldScript =
        document.getElementById(
          callbackName
        );


      if (oldScript) {

        oldScript.remove();

      }


      saveBtn.disabled =
        false;


      saveBtn.textContent =
        "✅ ENREGISTRER SN";

    };


  /*
   * Créer <script>
   */

  const script =
    document.createElement(
      "script"
    );


  script.id =
    callbackName;


  script.src =
    API_URL +
    "?action=saveSN" +
    "&sn=" +
    encodeURIComponent(sn) +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  /*
   * Erreur connexion
   */

  script.onerror =
    function() {

      console.error(
        "Impossible de charger Apps Script"
      );


      showStatus(
        "❌ Impossible de contacter Google Sheet.",
        "error"
      );


      delete window[
        callbackName
      ];


      script.remove();


      saveBtn.disabled =
        false;


      saveBtn.textContent =
        "✅ ENREGISTRER SN";

    };


  /*
   * Envoyer à Apps Script
   */

  document.body.appendChild(
    script
  );

}


/*****************************************************
 * TOUCHE ENTER
 *****************************************************/

document
  .getElementById(
    "sn"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();

        saveSN();

      }

    }
  );


/*****************************************************
 * NETTOYAGE PAGE
 *****************************************************/

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      scannerRunning
    ) {

      scanner.stop();

    }

  }
);

</script>


</body>

</html>
