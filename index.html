<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SCAN PANNEAUX</title>

  <!-- Scanner QR / BARCODE -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #eef1f5;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin: 15px 0 25px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 25px;
      margin-bottom: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    label {
      display: block;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    select,
    input {
      width: 100%;
      height: 65px;
      border: 2px solid #d1d5db;
      border-radius: 18px;
      padding: 0 20px;
      font-size: 21px;
      background: white;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #2563eb;
    }

    .current {
      margin-top: 20px;
      background: #f3f4f6;
      border-radius: 20px;
      text-align: center;
      padding: 20px;
    }

    .current-title {
      font-size: 21px;
      color: #6b7280;
      margin-bottom: 8px;
    }

    .current-value {
      font-size: 38px;
      font-weight: bold;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 18px;
      min-height: 68px;
      padding: 14px 20px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 14px;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .blue {
      background: #2563eb;
      color: white;
    }

    .black {
      background: #111827;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
      display: none;
      overflow: hidden;
      border-radius: 20px;
    }

    .status {
      margin-top: 15px;
      padding: 18px;
      border-radius: 18px;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      display: none;
    }

    .status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .loading {
      text-align: center;
      padding: 18px;
      font-size: 19px;
      color: #1d4ed8;
      background: #dbeafe;
      border-radius: 18px;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📋 SCAN PANNEAUX</h1>


  <!-- INTERVENANT -->
  <div class="card">

    <label>👷 INTERVENANT</label>

    <input
      id="intervenant"
      type="text"
      placeholder="Nom de l'intervenant"
    >

  </div>


  <!-- REPERE -->
  <div class="card">

    <label>📍 REPÈRE</label>

    <select id="repere">

      <option value="">
        Chargement des repères...
      </option>

    </select>

    <div class="current">

      <div class="current-title">
        REPÈRE ACTUEL
      </div>

      <div
        id="repereActuel"
        class="current-value"
      >
        Aucun
      </div>

    </div>

  </div>


  <!-- CAMERA -->
  <div class="card">

    <button
      id="btnCamera"
      class="green"
      onclick="ouvrirCamera()"
    >
      📷 OUVRIR LA CAMÉRA
    </button>

    <div id="reader"></div>

    <button
      id="btnStop"
      class="red hidden"
      onclick="fermerCamera()"
    >
      ⛔ FERMER LA CAMÉRA
    </button>

  </div>


  <!-- SN -->
  <div class="card">

    <label>SN</label>

    <input
      id="sn"
      type="text"
      inputmode="text"
      autocomplete="off"
      placeholder="Scanner ou saisir le SN"
    >

    <div
      id="scanInfo"
      style="
        text-align:center;
        margin-top:12px;
        font-size:18px;
      "
    >
      Aucun scan
    </div>

    <button
      id="btnSave"
      class="blue"
      onclick="enregistrer()"
    >
      ✅ ENREGISTRER SN
    </button>

    <button
      id="btnNew"
      class="black"
      onclick="nouveauScan()"
    >
      🔄 NOUVEAU SCAN
    </button>

    <div
      id="message"
      class="status"
    ></div>

  </div>


  <!-- ETAT -->
  <div
    id="loading"
    class="loading"
  >
    Connexion à Google Sheet...
  </div>

</div>


<script>

  let scanner = null;

  let cameraActive = false;

  let reperesLoaded = false;


  /**
   * AU CHARGEMENT
   */
  window.addEventListener('load', function() {

    chargerReperes();

  });


  /**
   * AFFICHER MESSAGE
   */
  function message(text, type) {

    const box = document.getElementById('message');

    box.className = 'status ' + type;

    box.textContent = text;

  }


  /**
   * CHARGER LES REPÈRES
   *
   * IMPORTANT :
   * on utilise google.script.run
   * et on traite succès + erreur.
   */
  function chargerReperes() {

    const select = document.getElementById('repere');

    select.innerHTML =
      '<option value="">⏳ Chargement des repères...</option>';

    document.getElementById('loading').style.display = 'block';

    google.script.run

      .withSuccessHandler(function(reperes) {

        console.log('REPÈRES REÇUS :', reperes);

        select.innerHTML = '';

        if (!reperes || reperes.length === 0) {

          select.innerHTML =
            '<option value="">⚠️ Aucun repère trouvé</option>';

          document.getElementById('loading').textContent =
            '⚠️ Aucun repère trouvé dans la colonne C.';

          return;
        }

        // Option par défaut
        const firstOption = document.createElement('option');

        firstOption.value = '';

        firstOption.textContent =
          '-- Choisir le repère --';

        select.appendChild(firstOption);


        // Ajouter les repères
        reperes.forEach(function(repere) {

          const option =
            document.createElement('option');

          option.value = repere;

          option.textContent = repere;

          select.appendChild(option);

        });


        reperesLoaded = true;

        document.getElementById('loading').textContent =
          '✅ ' + reperes.length +
          ' repère(s) chargé(s) depuis Google Sheet.';

        document.getElementById('loading').style.background =
          '#dcfce7';

        document.getElementById('loading').style.color =
          '#166534';

      })

      .withFailureHandler(function(error) {

        console.error(error);

        select.innerHTML =
          '<option value="">❌ Erreur de chargement</option>';

        document.getElementById('loading').textContent =
          '❌ ' +
          (error && error.message
            ? error.message
            : 'Impossible de contacter Google Sheet.');

        document.getElementById('loading').style.background =
          '#fee2e2';

        document.getElementById('loading').style.color =
          '#991b1b';

        message(
          '❌ Impossible de charger les repères.',
          'error'
        );

      })

      .getReperes();

  }


  /**
   * CHOIX DU REPERE
   */
  document
    .getElementById('repere')
    .addEventListener('change', function() {

      const value = this.value;

      document
        .getElementById('repereActuel')
        .textContent = value || 'Aucun';

      if (value) {

        message(
          '📍 Repère sélectionné : ' + value,
          'info'
        );

      }

    });


  /**
   * OUVRIR CAMERA
   */
  function ouvrirCamera() {

    if (!reperesLoaded) {

      message(
        '⏳ Attendez le chargement des repères.',
        'info'
      );

      return;
    }


    const repere =
      document.getElementById('repere').value;

    if (!repere) {

      message(
        '⚠️ Choisissez d’abord un repère.',
        'error'
      );

      document
        .getElementById('repere')
        .focus();

      return;
    }


    const reader =
      document.getElementById('reader');

    reader.style.display = 'block';

    document
      .getElementById('btnCamera')
      .classList.add('hidden');

    document
      .getElementById('btnStop')
      .classList.remove('hidden');


    scanner = new Html5Qrcode('reader');

    const config = {

      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        const size =
          Math.min(
            viewfinderWidth * 0.8,
            viewfinderHeight * 0.6
          );

        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0

    };


    scanner
      .start(
        {
          facingMode: "environment"
        },
        config,
        onScanSuccess,
        onScanError
      )

      .then(function() {

        cameraActive = true;

        message(
          '📷 Caméra active — placez le QR/code-barres dans le cadre.',
          'info'
        );

      })

      .catch(function(error) {

        console.error(error);

        cameraActive = false;

        reader.style.display = 'none';

        document
          .getElementById('btnCamera')
          .classList.remove('hidden');

        document
          .getElementById('btnStop')
          .classList.add('hidden');

        message(
          '❌ Impossible d’ouvrir la caméra. Vérifiez l’autorisation caméra du navigateur.',
          'error'
        );

      });

  }


  /**
   * SCAN REUSSI
   */
  function onScanSuccess(decodedText, decodedResult) {

    console.log(
      'SCAN : ',
      decodedText,
      decodedResult
    );


    const sn =
      String(decodedText || '').trim();


    if (!sn) {
      return;
    }


    document
      .getElementById('sn')
      .value = sn;


    document
      .getElementById('scanInfo')
      .textContent =
      '✅ Code détecté : ' + sn;


    message(
      '✅ SN détecté avec la caméra.',
      'success'
    );


    // Arrêter automatiquement après détection
    fermerCamera();

  }


  /**
   * ERREURS DE SCAN
   *
   * Ne rien afficher :
   * html5-qrcode appelle cette fonction
   * en continu quand aucun code n'est trouvé.
   */
  function onScanError(errorMessage) {

    // volontairement vide

  }


  /**
   * FERMER CAMERA
   */
  function fermerCamera() {

    if (!scanner) {

      document
        .getElementById('reader')
        .style.display = 'none';

      document
        .getElementById('btnCamera')
        .classList.remove('hidden');

      document
        .getElementById('btnStop')
        .classList.add('hidden');

      return;
    }


    scanner
      .stop()
      .then(function() {

        scanner.clear();

        scanner = null;

        cameraActive = false;

        document
          .getElementById('reader')
          .style.display = 'none';

        document
          .getElementById('btnCamera')
          .classList.remove('hidden');

        document
          .getElementById('btnStop')
          .classList.add('hidden');

      })

      .catch(function(error) {

        console.error(error);

        scanner = null;

        cameraActive = false;

        document
          .getElementById('reader')
          .style.display = 'none';

        document
          .getElementById('btnCamera')
          .classList.remove('hidden');

        document
          .getElementById('btnStop')
          .classList.add('hidden');

      });

  }


  /**
   * ENREGISTRER
   */
  function enregistrer() {

    const intervenant =
      document
        .getElementById('intervenant')
        .value
        .trim();


    const repere =
      document
        .getElementById('repere')
        .value
        .trim();


    const sn =
      document
        .getElementById('sn')
        .value
        .trim();


    if (!intervenant) {

      message(
        '⚠️ Entrez le nom de l’intervenant.',
        'error'
      );

      document
        .getElementById('intervenant')
        .focus();

      return;
    }


    if (!repere) {

      message(
        '⚠️ Choisissez un repère.',
        'error'
      );

      return;
    }


    if (!sn) {

      message(
        '⚠️ Scannez ou saisissez le SN.',
        'error'
      );

      document
        .getElementById('sn')
        .focus();

      return;
    }


    const btn =
      document.getElementById('btnSave');

    btn.disabled = true;

    btn.textContent =
      '⏳ ENREGISTREMENT...';


    message(
      '⏳ Enregistrement dans Google Sheet...',
      'info'
    );


    google.script.run

      .withSuccessHandler(function(result) {

        btn.disabled = false;

        btn.textContent =
          '✅ ENREGISTRER SN';


        if (!result || !result.ok) {

          message(
            '❌ ' +
            (result
              ? result.message
              : 'Erreur inconnue.'),
            'error'
          );

          return;
        }


        message(
          '✅ Enregistré : ' +
          result.repere +
          ' → ' +
          result.sn,
          'success'
        );


        document
          .getElementById('scanInfo')
          .textContent =
          '✅ Dernier scan : ' +
          result.sn;

      })

      .withFailureHandler(function(error) {

        btn.disabled = false;

        btn.textContent =
          '✅ ENREGISTRER SN';


        console.error(error);


        message(
          '❌ Erreur Google Sheet : ' +
          (error && error.message
            ? error.message
            : 'connexion impossible'),
          'error'
        );

      })

      .enregistrerScan({

        intervenant: intervenant,

        repere: repere,

        sn: sn,

        typeScan: 'QR / BARCODE'

      });

  }


  /**
   * NOUVEAU SCAN
   */
  function nouveauScan() {

    document
      .getElementById('sn')
      .value = '';


    document
      .getElementById('scanInfo')
      .textContent =
      'Aucun scan';


    message('', '');


    document
      .getElementById('sn')
      .focus();

  }


</script>

</body>

</html>
