<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>SCAN PANNEAUX</title>

  <!-- Scanner QR / codes-barres -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 14px;
      background: #eef1f5;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    .title {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin: 10px 0 25px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .label {
      display: block;
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      height: 58px;
      border: 2px solid #d1d5db;
      border-radius: 18px;
      padding: 0 18px;
      font-size: 20px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: #2563eb;
    }

    #repere.correct {
      border-color: #16a34a;
      background: #f0fdf4;
    }

    #repere.incorrect {
      border-color: #dc2626;
      background: #fef2f2;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      text-align: center;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .current {
      margin-top: 14px;
      padding: 18px;
      border-radius: 18px;
      background: #f3f4f6;
      text-align: center;
    }

    .current-title {
      font-size: 16px;
      color: #6b7280;
      font-weight: 700;
    }

    .current-value {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 900;
      word-break: break-word;
    }

    button {
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 18px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 12px;
      padding: 12px;
    }

    .btn-camera {
      background: #16a34a;
      color: white;
    }

    .btn-save {
      background: #2563eb;
      color: white;
    }

    .btn-new {
      background: #111827;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      display: none;
      overflow: hidden;
      border-radius: 18px;
    }

    .scanner-title {
      text-align: center;
      font-weight: 800;
      margin-top: 12px;
    }

    .small {
      text-align: center;
      font-size: 14px;
      color: #6b7280;
      margin-top: 8px;
    }

    .loading {
      text-align: center;
      padding: 15px;
      display: none;
      color: #1d4ed8;
      font-weight: 700;
    }

    .result {
      margin-top: 12px;
      padding: 14px;
      border-radius: 14px;
      text-align: center;
      font-weight: 700;
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      .title {
        font-size: 30px;
      }

      .card {
        padding: 18px;
      }

      input {
        font-size: 18px;
      }

      .current-value {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="title">
    📋 SCAN PANNEAUX
  </div>

  <!-- INTERVENANT -->
  <div class="card">

    <label class="label" for="intervenant">
      👷 INTERVENANT
    </label>

    <input
      id="intervenant"
      type="text"
      placeholder="Nom de l'intervenant"
      autocomplete="name"
    >

  </div>


  <!-- REPERE -->
  <div class="card">

    <label class="label" for="repere">
      📍 REPÈRE
    </label>

    <input
      id="repere"
      type="text"
      placeholder="Exemple : CB1-S1-01"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >

    <div id="repereMessage" class="message"></div>

    <div class="current">
      <div class="current-title">
        REPÈRE ACTUEL
      </div>

      <div id="repereActuel" class="current-value">
        Aucun
      </div>
    </div>

  </div>


  <!-- CAMERA -->
  <div class="card">

    <button
      id="cameraButton"
      class="btn-camera"
      onclick="ouvrirCamera()"
    >
      📷 OUVRIR LA CAMÉRA
    </button>

    <div id="scannerTitle" class="scanner-title" style="display:none;">
      📷 Présentez le QR / code-barres devant la caméra
    </div>

    <div id="reader"></div>

    <button
      id="stopCameraButton"
      class="btn-new"
      style="display:none;"
      onclick="fermerCamera()"
    >
      ✖ FERMER LA CAMÉRA
    </button>

    <div class="small">
      Compatible QR Code et plusieurs formats de codes-barres.
    </div>

  </div>


  <!-- SN -->
  <div class="card">

    <label class="label" for="sn">
      SN
    </label>

    <input
      id="sn"
      type="text"
      placeholder="Scanner ou saisir le SN"
      autocomplete="off"
      spellcheck="false"
    >

    <div id="scanResult" class="result"></div>

    <button
      id="saveButton"
      class="btn-save"
      onclick="enregistrerSN()"
    >
      ✅ ENREGISTRER SN
    </button>

    <button
      class="btn-new"
      onclick="nouveauScan()"
    >
      🔄 NOUVEAU SCAN
    </button>

    <div id="loading" class="loading">
      ⏳ Enregistrement dans Google Sheet...
    </div>

    <div id="serverMessage" class="message"></div>

  </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/*
 * TON LIEN GOOGLE APPS SCRIPT
 */
const API_URL =
  "https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec";


/*
 * FORMAT OBLIGATOIRE DU REPERE
 *
 * CB1-S1-01
 * CB2-S4-12
 * CB27-S3-99
 *
 * CB + chiffres
 * -
 * S + chiffres
 * -
 * 2 chiffres
 */
const REPERE_REGEX = /^CB\d+-S\d+-\d{2}$/i;


/* =========================================================
   VARIABLES
   ========================================================= */

let scanner = null;
let cameraActive = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const intervenantInput =
  document.getElementById("intervenant");

const repereInput =
  document.getElementById("repere");

const snInput =
  document.getElementById("sn");

const repereMessage =
  document.getElementById("repereMessage");

const repereActuel =
  document.getElementById("repereActuel");

const cameraButton =
  document.getElementById("cameraButton");

const stopCameraButton =
  document.getElementById("stopCameraButton");

const reader =
  document.getElementById("reader");

const scannerTitle =
  document.getElementById("scannerTitle");

const saveButton =
  document.getElementById("saveButton");

const loading =
  document.getElementById("loading");

const serverMessage =
  document.getElementById("serverMessage");

const scanResult =
  document.getElementById("scanResult");


/* =========================================================
   REPERE
   ========================================================= */

repereInput.addEventListener("input", function () {

  let value = this.value
    .trim()
    .toUpperCase();

  this.value = value;

  verifierRepere();

});


function verifierRepere() {

  const value =
    repereInput.value.trim().toUpperCase();

  repereInput.classList.remove(
    "correct",
    "incorrect"
  );

  repereMessage.className = "message";
  repereMessage.style.display = "none";

  if (value === "") {

    repereActuel.textContent = "Aucun";

    return false;
  }


  if (REPERE_REGEX.test(value)) {

    repereInput.classList.add("correct");

    repereActuel.textContent = value;

    repereMessage.textContent =
      "✅ REPÈRE CORRECT";

    repereMessage.classList.add("success");
    repereMessage.style.display = "block";

    return true;
  }


  repereInput.classList.add("incorrect");

  repereActuel.textContent = "Aucun";

  repereMessage.textContent =
    "❌ REPÈRE INCORRECT — ÉCRIRE SOUS LA FORME : CB1-S1-01";

  repereMessage.classList.add("error");
  repereMessage.style.display = "block";

  return false;
}


/* =========================================================
   CAMERA
   ========================================================= */

async function ouvrirCamera() {

  if (cameraActive) {
    return;
  }

  /*
   * Vérifier d'abord le repère.
   */
  if (!verifierRepere()) {

    afficherMessage(
      repereMessage,
      "❌ Écrivez d'abord un repère correct : CB1-S1-01",
      "error"
    );

    repereInput.focus();

    return;
  }


  reader.style.display = "block";
  scannerTitle.style.display = "block";

  cameraButton.style.display = "none";
  stopCameraButton.style.display = "block";

  scanner = new Html5Qrcode("reader");

  cameraActive = true;


  const config = {

    fps: 10,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const minEdge =
        Math.min(viewfinderWidth, viewfinderHeight);

      return {
        width: Math.floor(minEdge * 0.75),
        height: Math.floor(minEdge * 0.45)
      };

    },

    aspectRatio: 1.0

  };


  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      function(decodedText) {

        traiterCodeScanne(decodedText);

      },

      function(errorMessage) {

        /*
         * Les erreurs de lecture normales sont ignorées.
         */

      }

    );

  } catch (error) {

    console.error(error);

    fermerCamera();

    afficherMessage(
      serverMessage,
      "❌ Impossible d'ouvrir la caméra. Vérifiez l'autorisation caméra du téléphone.",
      "error"
    );

  }

}


/* =========================================================
   CODE SCANNE
   ========================================================= */

function traiterCodeScanne(code) {

  const valeur =
    String(code || "").trim();

  if (!valeur) {
    return;
  }


  /*
   * Le code scanné devient le SN.
   */
  snInput.value = valeur;


  scanResult.textContent =
    "✅ Code détecté : " + valeur;

  scanResult.style.display = "block";
  scanResult.style.background = "#dcfce7";
  scanResult.style.color = "#166534";


  /*
   * Arrêter la caméra après une lecture réussie.
   */
  fermerCamera();


  /*
   * Petite vibration du téléphone.
   */
  if (navigator.vibrate) {
    navigator.vibrate(150);
  }

}


/* =========================================================
   FERMER CAMERA
   ========================================================= */

async function fermerCamera() {

  if (scanner) {

    try {

      if (cameraActive) {
        await scanner.stop();
      }

    } catch (error) {

      console.log("Camera stop:", error);

    }

    try {
      await scanner.clear();
    } catch (error) {
      console.log("Scanner clear:", error);
    }

    scanner = null;
  }


  cameraActive = false;

  reader.style.display = "none";
  scannerTitle.style.display = "none";

  cameraButton.style.display = "block";
  stopCameraButton.style.display = "none";

}


/* =========================================================
   ENREGISTRER SN
   ========================================================= */

async function enregistrerSN() {

  clearServerMessage();


  const intervenant =
    intervenantInput.value.trim();

  const repere =
    repereInput.value.trim().toUpperCase();

  const sn =
    snInput.value.trim();


  /*
   * INTERVENANT
   */
  if (!intervenant) {

    afficherMessage(
      serverMessage,
      "❌ Veuillez saisir le nom de l'intervenant.",
      "error"
    );

    intervenantInput.focus();

    return;
  }


  /*
   * REPERE
   */
  if (!REPERE_REGEX.test(repere)) {

    afficherMessage(
      serverMessage,
      "❌ REPÈRE INCORRECT. Utilisez la forme CB1-S1-01.",
      "error"
    );

    repereInput.focus();

    return;
  }


  /*
   * SN
   */
  if (!sn) {

    afficherMessage(
      serverMessage,
      "❌ Veuillez scanner ou saisir le SN.",
      "error"
    );

    snInput.focus();

    return;
  }


  /*
   * Désactiver le bouton
   */
  saveButton.disabled = true;

  loading.style.display = "block";


  /*
   * Données envoyées à Google Apps Script
   */
  const data = {

    action: "save",

    intervenant: intervenant,

    repere: repere,

    sn: sn,

    typeScan: "QR / BARCODE",

    statut: "OK"

  };


  try {

    const result =
      await envoyerGoogleSheet(data);


    console.log(
      "Réponse Google Apps Script:",
      result
    );


    loading.style.display = "none";

    saveButton.disabled = false;


    afficherMessage(
      serverMessage,
      "✅ SN ENREGISTRÉ DANS GOOGLE SHEET — " + repere,
      "success"
    );


  } catch (error) {

    console.error(error);

    loading.style.display = "none";

    saveButton.disabled = false;


    afficherMessage(
      serverMessage,
      "❌ Impossible de contacter Google Sheet. Vérifiez le lien Apps Script et le déploiement.",
      "error"
    );

  }

}


/* =========================================================
   ENVOI GOOGLE APPS SCRIPT
   ========================================================= */

/*
 * JSONP
 *
 * On utilise JSONP pour éviter les problèmes CORS
 * entre GitHub Pages et Google Apps Script.
 */

function envoyerGoogleSheet(data) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "googleSheetCallback_" +
      Date.now() +
      "_" +
      Math.floor(Math.random() * 100000);


    const script =
      document.createElement("script");


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "Timeout Google Apps Script"
          )
        );

      }, 15000);


    window[callbackName] =
      function(response) {

        cleanup();

        if (
          response &&
          (
            response.success === true ||
            response.status === "OK"
          )
        ) {

          resolve(response);

        } else {

          /*
           * Certains anciens Apps Script peuvent
           * retourner directement les données.
           */
          resolve(response);

        }

      };


    const params =
      new URLSearchParams();


    params.set(
      "action",
      data.action
    );

    params.set(
      "intervenant",
      data.intervenant
    );

    params.set(
      "repere",
      data.repere
    );

    params.set(
      "sn",
      data.sn
    );

    params.set(
      "typeScan",
      data.typeScan
    );

    params.set(
      "statut",
      data.statut
    );

    params.set(
      "callback",
      callbackName
    );


    script.src =
      API_URL +
      "?" +
      params.toString();


    script.async = true;


    script.onerror =
      function() {

        cleanup();

        reject(
          new Error(
            "Erreur de connexion Google Apps Script"
          )
        );

      };


    document.body.appendChild(script);


    function cleanup() {

      clearTimeout(timeout);

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }

    }

  });

}


/* =========================================================
   NOUVEAU SCAN
   ========================================================= */

function nouveauScan() {

  fermerCamera();


  snInput.value = "";

  scanResult.style.display = "none";


  clearServerMessage();


  /*
   * On garde :
   * - intervenant
   * - repère
   *
   * pour permettre plusieurs SN
   * sur le même repère.
   */


  snInput.focus();

}


/* =========================================================
   MESSAGES
   ========================================================= */

function afficherMessage(element, texte, type) {

  element.textContent = texte;

  element.className =
    "message " + type;

  element.style.display = "block";

}


function clearServerMessage() {

  serverMessage.textContent = "";

  serverMessage.className =
    "message";

  serverMessage.style.display =
    "none";

}


/* =========================================================
   INITIALISATION
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    /*
     * Récupérer automatiquement
     * les valeurs saisies précédemment.
     */

    const oldIntervenant =
      localStorage.getItem(
        "scan_intervenant"
      );

    if (oldIntervenant) {
      intervenantInput.value =
        oldIntervenant;
    }


    intervenantInput.addEventListener(
      "input",
      function() {

        localStorage.setItem(
          "scan_intervenant",
          this.value
        );

      }
    );


    /*
     * Validation du repère au démarrage.
     */
    verifierRepere();

  }
);

</script>

</body>
</html>
