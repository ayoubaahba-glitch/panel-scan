<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SCAN PANNEAUX</title>

  <!-- Scanner QR / BARCODE -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      color: #111;
    }

    .container {
      width: 95%;
      max-width: 900px;
      margin: auto;
      padding: 20px 0 50px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      margin: 5px 0 20px;
      font-size: 30px;
    }

    .label {
      font-weight: bold;
      font-size: 20px;
      margin-bottom: 10px;
      display: block;
    }

    input {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      border: 1px solid #bbb;
      border-radius: 12px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-camera {
      background: #16a34a;
      color: white;
    }

    .btn-save {
      background: #2563eb;
      color: white;
    }

    .btn-stop {
      background: #dc2626;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #reader {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 15px;
    }

    #reader video {
      border-radius: 15px;
    }

    .status {
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .position {
      text-align: center;
      padding: 20px;
      background: #f8fafc;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .position-title {
      color: #555;
      font-size: 18px;
    }

    .position-value {
      font-size: 35px;
      font-weight: bold;
      margin-top: 5px;
    }

    .small {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>📋 SCAN PANNEAUX</h1>

    <div class="position">
      <div class="position-title">REPÈRE ACTUEL</div>
      <div id="position" class="position-value">Aucun</div>
    </div>
  </div>


  <!-- CAMERA -->
  <div class="card">

    <button
      id="openCameraBtn"
      class="btn-camera"
      onclick="startScanner()">
      📷 OUVRIR LA CAMÉRA
    </button>

    <div id="scannerArea" class="hidden">

      <div id="reader"></div>

      <button
        id="stopCameraBtn"
        class="btn-stop"
        onclick="stopScanner()">
        ⛔ ARRÊTER LA CAMÉRA
      </button>

      <div class="small">
        Place le QR code ou le code-barres dans le cadre.
      </div>

    </div>

  </div>


  <!-- SN -->
  <div class="card">

    <label class="label">SN</label>

    <input
      id="sn"
      type="text"
      placeholder="Scanner ou saisir le SN..."
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >

    <button
      id="saveBtn"
      class="btn-save"
      onclick="saveSN()">
      ✅ ENREGISTRER SN
    </button>

    <div id="status" class="status"></div>

  </div>

</div>


<script>

  /************************************************
   * CONFIGURATION
   ************************************************/

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec";


  let scanner = null;
  let scannerRunning = false;
  let lastScanned = "";


  /************************************************
   * AFFICHER MESSAGE
   ************************************************/

  function showStatus(message, type) {

    const box = document.getElementById("status");

    box.textContent = message;

    box.className = "status " + type;
  }


  /************************************************
   * OUVRIR SCANNER
   ************************************************/

  async function startScanner() {

    if (scannerRunning) {
      return;
    }

    document
      .getElementById("scannerArea")
      .classList.remove("hidden");

    showStatus(
      "📷 Initialisation de la caméra...",
      "info"
    );

    try {

      scanner = new Html5Qrcode("reader");

      const config = {

        fps: 10,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          const minEdge = Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

          const size = Math.floor(minEdge * 0.70);

          return {
            width: size,
            height: size
          };
        },

        aspectRatio: 1.0,

        formatsToSupport: [

          Html5QrcodeSupportedFormats.QR_CODE,

          Html5QrcodeSupportedFormats.CODE_128,

          Html5QrcodeSupportedFormats.CODE_39,

          Html5QrcodeSupportedFormats.CODE_93,

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8,

          Html5QrcodeSupportedFormats.UPC_A,

          Html5QrcodeSupportedFormats.UPC_E,

          Html5QrcodeSupportedFormats.ITF,

          Html5QrcodeSupportedFormats.CODABAR,

          Html5QrcodeSupportedFormats.DATA_MATRIX,

          Html5QrcodeSupportedFormats.AZTEC,

          Html5QrcodeSupportedFormats.PDF_417

        ]

      };


      /*
       * IMPORTANT :
       * facingMode = environment
       * = caméra arrière du téléphone
       */

      await scanner.start(

        {
          facingMode: "environment"
        },

        config,

        function(decodedText, decodedResult) {

          handleScan(decodedText);

        },

        function(errorMessage) {

          // Les erreurs de lecture image
          // sont normales pendant le scan.
          // On ne les affiche pas.

        }

      );


      scannerRunning = true;

      document
        .getElementById("openCameraBtn")
        .classList.add("hidden");

      showStatus(
        "📷 Caméra active — place le code dans le cadre.",
        "info"
      );

    }

    catch (error) {

      console.error(error);

      showStatus(
        "❌ Impossible d'ouvrir la caméra. Autorise l'accès à la caméra dans le téléphone.",
        "error"
      );

      document
        .getElementById("scannerArea")
        .classList.add("hidden");

    }

  }


  /************************************************
   * CODE SCANNÉ
   ************************************************/

  function handleScan(decodedText) {

    if (!decodedText) {
      return;
    }

    decodedText = String(decodedText).trim();

    /*
     * Empêcher plusieurs lectures
     * du même code immédiatement.
     */

    if (decodedText === lastScanned) {
      return;
    }

    lastScanned = decodedText;


    /*
     * Mettre automatiquement le résultat
     * dans le champ SN
     */

    document.getElementById("sn").value = decodedText;


    showStatus(
      "✅ Code détecté : " + decodedText,
      "success"
    );


    /*
     * Arrêter la caméra après lecture
     */

    stopScanner();


    /*
     * Enregistrer automatiquement
     */

    setTimeout(function() {

      saveSN();

    }, 500);

  }


  /************************************************
   * ARRÊTER SCANNER
   ************************************************/

  async function stopScanner() {

    if (!scanner) {
      return;
    }

    try {

      if (scannerRunning) {

        await scanner.stop();

      }

    }
    catch (error) {

      console.error(error);

    }


    try {

      await scanner.clear();

    }
    catch (error) {

      console.error(error);

    }


    scanner = null;

    scannerRunning = false;


    document
      .getElementById("reader")
      .innerHTML = "";


    document
      .getElementById("scannerArea")
      .classList.add("hidden");


    document
      .getElementById("openCameraBtn")
      .classList.remove("hidden");

  }


  /************************************************
   * ENREGISTRER SN
   ************************************************/

  async function saveSN() {

    const input = document.getElementById("sn");

    const sn = input.value.trim();


    if (!sn) {

      showStatus(
        "⚠️ Scanne ou saisis un SN.",
        "error"
      );

      input.focus();

      return;

    }


    const saveBtn = document.getElementById("saveBtn");

    saveBtn.disabled = true;

    saveBtn.textContent = "⏳ ENREGISTREMENT...";


    showStatus(
      "⏳ Enregistrement dans Google Sheet...",
      "info"
    );


    try {

      /*
       * Appel Google Apps Script
       */

      const url =
        API_URL +
        "?action=saveSN&sn=" +
        encodeURIComponent(sn);


      const response =
        await fetch(url, {
          method: "GET",
          cache: "no-cache"
        });


      if (!response.ok) {

        throw new Error(
          "HTTP " + response.status
        );

      }


      const data =
        await response.json();


      console.log("API:", data);


      if (data.ok) {

        /*
         * Afficher le repère attribué
         */

        document.getElementById("position").textContent =
          data.repere || data.position || "OK";


        showStatus(
          "✅ SN enregistré avec succès.",
          "success"
        );


        input.value = "";

        lastScanned = "";


      }

      else {

        showStatus(
          "❌ " +
          (data.message || "Erreur pendant l'enregistrement."),
          "error"
        );

      }

    }

    catch (error) {

      console.error(error);

      showStatus(
        "❌ Impossible de contacter Google Sheet.",
        "error"
      );

    }


    saveBtn.disabled = false;

    saveBtn.textContent = "✅ ENREGISTRER SN";

  }


  /************************************************
   * ENTRÉE CLAVIER
   ************************************************/

  document
    .getElementById("sn")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        event.preventDefault();

        saveSN();

      }

    });


  /************************************************
   * NETTOYAGE QUAND ON QUITTE LA PAGE
   ************************************************/

  window.addEventListener("beforeunload", function() {

    if (scanner && scannerRunning) {

      scanner.stop();

    }

  });

</script>

</body>
</html>
