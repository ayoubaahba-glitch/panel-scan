<!DOCTYPE html>

<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>SCAN PANNEAUX</title>


<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>


<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 15px 12px 40px;

  background: #eef1f5;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: #111827;
}

.container {

  width: 100%;

  max-width: 650px;

  margin: auto;
}

h1 {

  text-align: center;

  font-size: 34px;

  margin: 10px 0 22px;

  font-weight: 900;
}

.card {

  background: white;

  border-radius: 25px;

  padding: 22px;

  margin-bottom: 18px;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.08);
}

label {

  display: block;

  font-size: 19px;

  font-weight: 900;

  margin-bottom: 10px;
}

input {

  width: 100%;

  height: 60px;

  border:
    2px solid #d1d5db;

  border-radius: 17px;

  padding: 0 17px;

  font-size: 20px;

  outline: none;
}

input:focus {

  border-color:
    #2563eb;
}

input.correct {

  border-color:
    #16a34a;

  background:
    #f0fdf4;
}

input.incorrect {

  border-color:
    #dc2626;

  background:
    #fef2f2;
}

button {

  width: 100%;

  min-height: 62px;

  border: none;

  border-radius: 18px;

  margin-top: 12px;

  font-size: 19px;

  font-weight: 900;
}

button:disabled {

  opacity: .55;
}

.camera {

  background:
    #16a34a;

  color: white;
}

.save {

  background:
    #2563eb;

  color: white;
}

.new {

  background:
    #111827;

  color: white;
}

#reader {

  width: 100%;

  display: none;

  margin-top: 15px;

  overflow: hidden;

  border-radius: 18px;

  background: black;
}

.status {

  margin-top: 10px;

  padding: 13px;

  border-radius: 14px;

  text-align: center;

  font-weight: 900;
}

.ok {

  background:
    #dcfce7;

  color:
    #166534;
}

.error {

  background:
    #fee2e2;

  color:
    #991b1b;
}

.info {

  background:
    #dbeafe;

  color:
    #1e40af;
}

.current {

  margin-top: 14px;

  padding: 15px;

  background:
    #f3f4f6;

  border-radius: 18px;

  text-align: center;
}

.current-title {

  color:
    #6b7280;

  font-size: 15px;
}

.current-value {

  margin-top: 5px;

  font-size: 30px;

  font-weight: 900;
}

.message {

  display: none;

  margin-top: 14px;

  padding: 16px;

  border-radius: 15px;

  text-align: center;

  font-weight: 900;

  line-height: 1.5;
}

.small {

  text-align: center;

  color:
    #6b7280;

  font-size: 13px;

  margin-top: 10px;
}

</style>

</head>


<body>


<div class="container">


<h1>
  📋 SCAN PANNEAUX
</h1>


<!-- INTERVENANT -->

<div class="card">

<label>
  👷 INTERVENANT
</label>

<input
  id="intervenant"
  type="text"
  placeholder="Nom de l'intervenant"
  autocomplete="off">

</div>


<!-- REPERE -->

<div class="card">

<label>
  📍 REPÈRE
</label>

<input
  id="repere"
  type="text"
  placeholder="Exemple : CB1-S1-01"
  maxlength="12"
  autocomplete="off">

<div
  id="repereStatus"
  class="status"
  style="display:none;">
</div>


<div class="current">

<div class="current-title">
  REPÈRE ACTUEL
</div>

<div
  id="currentRepere"
  class="current-value">

  Aucun

</div>

</div>

</div>


<!-- CAMERA -->

<div class="card">

<button
  id="cameraButton"
  class="camera"
  onclick="openCamera()">

  📷 OUVRIR LA CAMÉRA

</button>


<div
  id="reader">
</div>


<div class="small">

QR Code + Code-barres

</div>

</div>


<!-- SN -->

<div class="card">

<label>
  🔢 SN
</label>

<input
  id="sn"
  type="text"
  placeholder="Scanner ou saisir le SN"
  autocomplete="off">


<div
  id="scanResult"
  class="status ok"
  style="display:none;">
</div>


<button
  id="checkButton"
  class="save"
  onclick="checkBeforeSave()">

  🔎 VÉRIFIER LE SN

</button>


<button
  id="saveButton"
  class="save"
  style="display:none;"
  onclick="saveSN()">

  ☑️ ENREGISTRER SN

</button>


<button
  class="new"
  onclick="newScan()">

  🔄 NOUVEAU SCAN

</button>


<div
  id="message"
  class="message">
</div>

</div>


</div>


<script>

/*******************************************************
 * URL APPS SCRIPT
 *******************************************************/

const API_URL =
'https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec';


/*******************************************************
 * VARIABLES
 *******************************************************/

let scanner = null;

let scannerRunning = false;

let lastScanType = 'MANUEL';

let snChecked = false;


/*******************************************************
 * ELEMENTS
 *******************************************************/

const intervenant =
document.getElementById(
  'intervenant'
);

const repere =
document.getElementById(
  'repere'
);

const repereStatus =
document.getElementById(
  'repereStatus'
);

const currentRepere =
document.getElementById(
  'currentRepere'
);

const sn =
document.getElementById(
  'sn'
);

const message =
document.getElementById(
  'message'
);

const scanResult =
document.getElementById(
  'scanResult'
);

const reader =
document.getElementById(
  'reader'
);

const checkButton =
document.getElementById(
  'checkButton'
);

const saveButton =
document.getElementById(
  'saveButton'
);


/*******************************************************
 * REPERE VALIDATION
 *******************************************************/

function isValidRepere(value) {

  return /^CB\d+-S\d+-\d{2}$/i.test(
    String(value || '').trim()
  );
}


/*******************************************************
 * REPERE CHECK
 *******************************************************/

function checkRepere() {

  const value =
    repere.value
      .trim()
      .toUpperCase();

  repere.value =
    value;


  if (!value) {

    repere.classList.remove(
      'correct',
      'incorrect'
    );

    repereStatus.style.display =
      'none';

    currentRepere.textContent =
      'Aucun';

    return false;
  }


  if (isValidRepere(value)) {

    repere.classList.remove(
      'incorrect'
    );

    repere.classList.add(
      'correct'
    );

    repereStatus.className =
      'status ok';

    repereStatus.style.display =
      'block';

    repereStatus.textContent =
      '✅ REPÈRE CORRECT';

    currentRepere.textContent =
      value;

    return true;
  }


  repere.classList.remove(
    'correct'
  );

  repere.classList.add(
    'incorrect'
  );

  repereStatus.className =
    'status error';

  repereStatus.style.display =
    'block';

  repereStatus.textContent =
    '❌ REPÈRE NON CORRECT — ÉCRIRE : CB1-S1-01';

  currentRepere.textContent =
    'Incorrect';

  return false;
}


repere.addEventListener(
  'input',
  function() {

    snChecked = false;

    saveButton.style.display =
      'none';

    checkRepere();
  }
);


/*******************************************************
 * CAMERA
 *******************************************************/

async function openCamera() {

  if (scannerRunning) {

    await stopCamera();

    return;
  }


  reader.style.display =
    'block';


  showMessage(
    '📷 Ouverture de la caméra...',
    'info'
  );


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.min(
            width,
            height
          );

        return {

          width:
            Math.floor(
              size * .80
            ),

          height:
            Math.floor(
              size * .45
            )
        };
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.QR_CODE,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_93,

        Html5QrcodeSupportedFormats.CODABAR,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]
    };


    await scanner.start(

      {
        facingMode:
          'environment'
      },

      config,

      onScanSuccess,

      function() {}

    );


    scannerRunning =
      true;


    document.getElementById(
      'cameraButton'
    ).textContent =
      '⛔ FERMER LA CAMÉRA';


    message.style.display =
      'none';


  } catch (error) {

    console.error(error);

    reader.style.display =
      'none';

    showMessage(
      '❌ Caméra impossible à ouvrir. Vérifiez la permission caméra dans Chrome.',
      'error'
    );
  }
}


/*******************************************************
 * SCAN SUCCESS
 *******************************************************/

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (!decodedText) {
    return;
  }


  sn.value =
    String(
      decodedText
    ).trim();


  try {

    if (
      decodedResult &&
      decodedResult.result &&
      decodedResult.result.format
    ) {

      lastScanType =
        decodedResult
          .result
          .format
          .formatName;

    } else {

      lastScanType =
        'QR / CODE-BARRES';
    }

  } catch (e) {

    lastScanType =
      'QR / CODE-BARRES';
  }


  scanResult.style.display =
    'block';

  scanResult.className =
    'status ok';

  scanResult.textContent =
    '✅ CODE DÉTECTÉ : ' +
    decodedText;


  stopCamera();


  /*
   * Vérification automatique
   */

  setTimeout(
    checkBeforeSave,
    300
  );
}


/*******************************************************
 * STOP CAMERA
 *******************************************************/

async function stopCamera() {

  try {

    if (
      scanner &&
      scannerRunning
    ) {

      await scanner.stop();

      await scanner.clear();
    }

  } catch (e) {

    console.log(e);
  }


  scanner =
    null;

  scannerRunning =
    false;

  reader.style.display =
    'none';


  document.getElementById(
    'cameraButton'
  ).textContent =
    '📷 OUVRIR LA CAMÉRA';
}


/*******************************************************
 * CHECK SN AVANT SAVE
 *
 * JSONP
 *******************************************************/

function checkBeforeSave() {

  const intervenantValue =
    intervenant.value.trim();

  const repereValue =
    repere.value
      .trim()
      .toUpperCase();

  const snValue =
    sn.value.trim();


  if (!intervenantValue) {

    showMessage(
      '❌ Écrire le nom de l’intervenant.',
      'error'
    );

    intervenant.focus();

    return;
  }


  if (!isValidRepere(
    repereValue
  )) {

    showMessage(
      '❌ REPÈRE NON CORRECT. ÉCRIRE : CB1-S1-01',
      'error'
    );

    checkRepere();

    repere.focus();

    return;
  }


  if (!snValue) {

    showMessage(
      '❌ Scanner ou saisir le SN.',
      'error'
    );

    sn.focus();

    return;
  }


  checkButton.disabled =
    true;

  checkButton.textContent =
    '⏳ VÉRIFICATION...';


  saveButton.style.display =
    'none';


  snChecked =
    false;


  /*
   * Nom unique pour JSONP
   */

  const callbackName =
    'checkSN_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      'script'
    );


  const timeout =
    setTimeout(
      function() {

        cleanup();

        checkButton.disabled =
          false;

        checkButton.textContent =
          '🔎 VÉRIFIER LE SN';

        showMessage(
          '❌ Google Sheet ne répond pas. Vérifiez la connexion Internet et le déploiement Apps Script.',
          'error'
        );

      },
      12000
    );


  function cleanup() {

    clearTimeout(
      timeout
    );

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );
    }

    try {
      delete window[
        callbackName
      ];
    } catch (e) {}
  }


  window[callbackName] =
    function(result) {

      cleanup();


      checkButton.disabled =
        false;

      checkButton.textContent =
        '🔎 VÉRIFIER LE SN';


      if (
        result &&
        result.duplicate
      ) {

        snChecked =
          false;


        showMessage(

          '🔴 SN DÉJÀ SCANNÉ<br><br>' +

          'SN : <b>' +
          escapeHtml(
            snValue
          ) +
          '</b><br>' +

          'REPÈRE : <b>' +
          escapeHtml(
            result.existing &&
            result.existing.repere
              ? result.existing.repere
              : '-'
          ) +
          '</b><br>' +

          'INTERVENANT : <b>' +
          escapeHtml(
            result.existing &&
            result.existing.intervenant
              ? result.existing.intervenant
              : '-'
          ) +
          '</b>',

          'error'
        );


        scanResult.style.display =
          'block';

        scanResult.className =
          'status error';

        scanResult.textContent =
          '⛔ SN DÉJÀ SCANNÉ';


        saveButton.style.display =
          'none';


        return;
      }


      if (
        result &&
        result.success &&
        !result.duplicate
      ) {

        snChecked =
          true;


        showMessage(
          '🟢 SN DISPONIBLE — Vous pouvez enregistrer.',
          'success'
        );


        saveButton.style.display =
          'block';


        return;
      }


      showMessage(
        '❌ Erreur pendant la vérification du SN.',
        'error'
      );
    };


  script.onerror =
    function() {

      cleanup();

      checkButton.disabled =
        false;

      checkButton.textContent =
        '🔎 VÉRIFIER LE SN';

      showMessage(
        '❌ Impossible de contacter Google Sheet.',
        'error'
      );
    };


  script.src =
    API_URL +
    '?action=checkSN' +
    '&sn=' +
    encodeURIComponent(
      snValue
    ) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&t=' +
    Date.now();


  document.body.appendChild(
    script
  );
}


/*******************************************************
 * SAVE
 *
 * POST
 *******************************************************/

async function saveSN() {

  const intervenantValue =
    intervenant.value.trim();

  const repereValue =
    repere.value
      .trim()
      .toUpperCase();

  const snValue =
    sn.value.trim();


  if (!snChecked) {

    showMessage(
      '❌ Vérifiez d’abord le SN.',
      'error'
    );

    return;
  }


  if (!intervenantValue) {

    showMessage(
      '❌ Intervenant obligatoire.',
      'error'
    );

    return;
  }


  if (!isValidRepere(
    repereValue
  )) {

    showMessage(
      '❌ REPÈRE incorrect.',
      'error'
    );

    return;
  }


  saveButton.disabled =
    true;

  saveButton.textContent =
    '⏳ ENREGISTREMENT...';


  showMessage(
    '⏳ Enregistrement dans Google Sheet...',
    'info'
  );


  const formData =
    new URLSearchParams();


  formData.append(
    'action',
    'save'
  );

  formData.append(
    'intervenant',
    intervenantValue
  );

  formData.append(
    'repere',
    repereValue
  );

  formData.append(
    'sn',
    snValue
  );

  formData.append(
    'typeScan',
    lastScanType
  );


  try {

    /*
     * POST no-cors.
     *
     * Apps Script reçoit bien la requête.
     *
     * La sécurité serveur refait le contrôle
     * du doublon avec LockService.
     */

    await fetch(

      API_URL,

      {

        method:
          'POST',

        mode:
          'no-cors',

        headers: {

          'Content-Type':
            'application/x-www-form-urlencoded;charset=UTF-8'

        },

        body:
          formData.toString()
      }
    );


    /*
     * On ne peut pas lire la réponse
     * avec no-cors.
     *
     * Le contrôle serveur existe quand même.
     */

    showMessage(
      '✅ SN envoyé pour enregistrement.',
      'success'
    );


    scanResult.style.display =
      'block';

    scanResult.className =
      'status ok';

    scanResult.textContent =
      '✅ ENVOYÉ : ' +
      snValue;


    saveButton.disabled =
      false;

    saveButton.textContent =
      '☑️ ENREGISTRER SN';


    snChecked =
      false;


    saveButton.style.display =
      'none';


  } catch (error) {

    console.error(error);

    saveButton.disabled =
      false;

    saveButton.textContent =
      '☑️ ENREGISTRER SN';


    showMessage(
      '❌ Impossible de contacter Google Sheet.',
      'error'
    );
  }
}


/*******************************************************
 * NOUVEAU SCAN
 *******************************************************/

function newScan() {

  stopCamera();


  sn.value =
    '';

  scanResult.style.display =
    'none';

  message.style.display =
    'none';


  checkButton.disabled =
    false;

  checkButton.textContent =
    '🔎 VÉRIFIER LE SN';


  saveButton.style.display =
    'none';

  saveButton.disabled =
    false;

  saveButton.textContent =
    '☑️ ENREGISTRER SN';


  snChecked =
    false;

  lastScanType =
    'MANUEL';


  sn.focus();
}


/*******************************************************
 * MESSAGE
 *******************************************************/

function showMessage(
  text,
  type
) {

  message.className =
    'message ' + type;

  message.style.display =
    'block';

  message.innerHTML =
    text;
}


/*******************************************************
 * SECURITY DISPLAY
 *******************************************************/

function escapeHtml(value) {

  return String(
    value || ''
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );
}

</script>

</body>

</html>
