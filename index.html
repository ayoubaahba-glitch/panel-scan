<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>SCAN PANNEAUX</title>

<!-- Scanner QR / Code-barres -->
<script src="https://unpkg.com/html5-qrcode"
        type="text/javascript">
</script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 14px 40px;
  background: #eef1f5;
  font-family: Arial, Helvetica, sans-serif;
  color: #111827;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 38px;
  margin: 10px 0 25px;
  font-weight: 800;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.08);
}

label {
  display: block;
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 10px;
}

input {
  width: 100%;
  height: 60px;
  border: 2px solid #d1d5db;
  border-radius: 18px;
  padding: 0 18px;
  font-size: 20px;
  outline: none;
}

input:focus {
  border-color: #2563eb;
}

input.correct {
  border-color: #16a34a;
  background: #f0fdf4;
}

input.incorrect {
  border-color: #dc2626;
  background: #fef2f2;
}

.status {
  margin-top: 10px;
  padding: 12px;
  border-radius: 14px;
  text-align: center;
  font-weight: 800;
  font-size: 17px;
}

.status.ok {
  background: #dcfce7;
  color: #166534;
}

.status.error {
  background: #fee2e2;
  color: #991b1b;
}

.current {
  margin-top: 15px;
  background: #f3f4f6;
  border-radius: 20px;
  padding: 20px;
  text-align: center;
}

.current-title {
  font-size: 20px;
  color: #6b7280;
  margin-bottom: 8px;
}

.current-value {
  font-size: 38px;
  font-weight: 900;
}

button {
  width: 100%;
  min-height: 64px;
  border: none;
  border-radius: 20px;
  margin-top: 12px;
  font-size: 21px;
  font-weight: 900;
  cursor: pointer;
}

.camera-btn {
  background: #16a34a;
  color: white;
}

.save-btn {
  background: #2563eb;
  color: white;
}

.new-btn {
  background: #111827;
  color: white;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#reader {
  width: 100%;
  margin-top: 15px;
  display: none;
  overflow: hidden;
  border-radius: 20px;
}

.scan-info {
  text-align: center;
  margin-top: 10px;
  color: #6b7280;
  font-size: 16px;
}

.message {
  margin-top: 14px;
  padding: 15px;
  border-radius: 16px;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
  display: none;
}

.message.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.message.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.message.info {
  display: block;
  background: #dbeafe;
  color: #1e40af;
}

.small {
  text-align: center;
  color: #6b7280;
  font-size: 14px;
  margin-top: 10px;
}

</style>

</head>

<body>

<div class="container">

  <h1>📋 SCAN PANNEAUX</h1>


  <!-- INTERVENANT -->
  <div class="card">

    <label>👷 INTERVENANT</label>

    <input
      id="intervenant"
      type="text"
      placeholder="Nom de l'intervenant"
      autocomplete="off">

  </div>


  <!-- REPERE -->
  <div class="card">

    <label>📍 REPÈRE</label>

    <input
      id="repere"
      type="text"
      placeholder="Exemple : CB1-S1-01"
      autocomplete="off"
      maxlength="12">

    <div id="repereStatus"
         class="status"
         style="display:none;">
    </div>

    <div class="current">

      <div class="current-title">
        REPÈRE ACTUEL
      </div>

      <div id="currentRepere"
           class="current-value">
        Aucun
      </div>

    </div>

  </div>


  <!-- CAMERA -->
  <div class="card">

    <button
      id="cameraButton"
      class="camera-btn"
      onclick="openCamera()">

      📷 OUVRIR LA CAMÉRA

    </button>

    <div class="scan-info">
      Compatible QR Code et plusieurs formats de codes-barres.
    </div>

    <div id="reader"></div>

  </div>


  <!-- SN -->
  <div class="card">

    <label>SN</label>

    <input
      id="sn"
      type="text"
      placeholder="Scanner ou saisir le SN"
      autocomplete="off">

    <div id="scanResult"
         class="status ok"
         style="display:none;">
    </div>

    <button
      id="saveButton"
      class="save-btn"
      onclick="saveSN()">

      ☑️ ENREGISTRER SN

    </button>

    <button
      class="new-btn"
      onclick="newScan()">

      🔄 NOUVEAU SCAN

    </button>

    <div id="message"
         class="message">
    </div>

  </div>

</div>


<script>

/********************************************************
 * CONFIGURATION
 ********************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec';


/********************************************************
 * ELEMENTS
 ********************************************************/

const intervenantInput =
  document.getElementById('intervenant');

const repereInput =
  document.getElementById('repere');

const repereStatus =
  document.getElementById('repereStatus');

const currentRepere =
  document.getElementById('currentRepere');

const snInput =
  document.getElementById('sn');

const scanResult =
  document.getElementById('scanResult');

const message =
  document.getElementById('message');

const reader =
  document.getElementById('reader');

let html5QrCode = null;

let scannerRunning = false;

let lastScanType = 'MANUEL';


/********************************************************
 * VALIDATION REPERE
 *
 * Format:
 *
 * CB1-S1-01
 * CB1-S1-02
 * CB2-S3-15
 *
 ********************************************************/

function isValidRepere(value) {

  const regex = /^CB\d+-S\d+-\d{2}$/i;

  return regex.test(value.trim());

}


/********************************************************
 * VERIFICATION REPERE
 ********************************************************/

function checkRepere() {

  let value =
    repereInput.value
      .trim()
      .toUpperCase();

  repereInput.value = value;

  if (!value) {

    repereInput.classList.remove('correct');
    repereInput.classList.remove('incorrect');

    repereStatus.style.display = 'none';

    currentRepere.textContent = 'Aucun';

    return false;
  }


  if (isValidRepere(value)) {

    repereInput.classList.remove('incorrect');
    repereInput.classList.add('correct');

    repereStatus.className =
      'status ok';

    repereStatus.style.display =
      'block';

    repereStatus.textContent =
      '✅ REPÈRE CORRECT';

    currentRepere.textContent =
      value;

    return true;

  } else {

    repereInput.classList.remove('correct');
    repereInput.classList.add('incorrect');

    repereStatus.className =
      'status error';

    repereStatus.style.display =
      'block';

    repereStatus.textContent =
      '❌ REPÈRE NON CORRECT — ÉCRIRE : CB1-S1-01';

    currentRepere.textContent =
      'Incorrect';

    return false;
  }

}


/********************************************************
 * REPERE EN DIRECT
 ********************************************************/

repereInput.addEventListener(
  'input',
  checkRepere
);


/********************************************************
 * OUVRIR CAMERA
 ********************************************************/

async function openCamera() {

  if (scannerRunning) {

    stopCamera();

    return;
  }

  reader.style.display = 'block';

  message.className = 'message info';

  message.style.display = 'block';

  message.textContent =
    '📷 Ouverture de la caméra...';

  try {

    html5QrCode =
      new Html5Qrcode('reader');

    const config = {

      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        const minEdge =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

        return {
          width: Math.floor(minEdge * 0.75),
          height: Math.floor(minEdge * 0.45)
        };
      },

      aspectRatio: 1.777778,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.QR_CODE,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.CODE_93,

        Html5QrcodeSupportedFormats.CODABAR,

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    await html5QrCode.start(

      {
        facingMode: 'environment'
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scannerRunning = true;

    document.getElementById(
      'cameraButton'
    ).textContent =
      '⛔ FERMER LA CAMÉRA';

    message.style.display =
      'none';


  } catch (error) {

    console.error(error);

    reader.style.display =
      'none';

    message.className =
      'message error';

    message.style.display =
      'block';

    message.textContent =
      '❌ Impossible d’ouvrir la caméra. Vérifiez l’autorisation caméra et utilisez HTTPS.';

  }

}


/********************************************************
 * SCAN SUCCESS
 ********************************************************/

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (!decodedText) {
    return;
  }

  console.log(
    'SCAN :',
    decodedText
  );


  snInput.value =
    decodedText.trim();


  lastScanType =
    detectScanType(decodedResult);


  scanResult.style.display =
    'block';

  scanResult.className =
    'status ok';

  scanResult.textContent =
    '✅ Code détecté : ' +
    decodedText;


  stopCamera();


  snInput.focus();

}


/********************************************************
 * DETECT TYPE
 ********************************************************/

function detectScanType(result) {

  try {

    if (
      result &&
      result.result &&
      result.result.format &&
      result.result.format.formatName
    ) {

      return result.result.format.formatName;
    }

  } catch (e) {}

  return 'CODE-BARRES / QR';

}


/********************************************************
 * SCAN FAILURE
 ********************************************************/

function onScanFailure(error) {

  // Ne rien afficher.
  // Les erreurs normales de détection arrivent
  // plusieurs fois par seconde.
}


/********************************************************
 * FERMER CAMERA
 ********************************************************/

async function stopCamera() {

  try {

    if (
      html5QrCode &&
      scannerRunning
    ) {

      await html5QrCode.stop();

      await html5QrCode.clear();

    }

  } catch (error) {

    console.log(error);

  }


  scannerRunning = false;

  html5QrCode = null;

  reader.style.display =
    'none';

  document.getElementById(
    'cameraButton'
  ).textContent =
    '📷 OUVRIR LA CAMÉRA';

}


/********************************************************
 * ENREGISTRER SN
 ********************************************************/

function saveSN() {

  const intervenant =
    intervenantInput.value.trim();

  const repere =
    repereInput.value
      .trim()
      .toUpperCase();

  const sn =
    snInput.value.trim();


  /******** INTERVENANT ********/

  if (!intervenant) {

    showMessage(
      '❌ Écrire le nom de l’intervenant.',
      'error'
    );

    intervenantInput.focus();

    return;
  }


  /******** REPERE ********/

  if (!isValidRepere(repere)) {

    showMessage(
      '❌ REPÈRE NON CORRECT. ÉCRIRE COMME : CB1-S1-01',
      'error'
    );

    checkRepere();

    repereInput.focus();

    return;
  }


  /******** SN ********/

  if (!sn) {

    showMessage(
      '❌ Scanner ou saisir le SN.',
      'error'
    );

    snInput.focus();

    return;
  }


  const button =
    document.getElementById(
      'saveButton'
    );

  button.disabled = true;

  button.textContent =
    '⏳ ENREGISTREMENT...';


  showMessage(
    '⏳ Enregistrement dans Google Sheet...',
    'info'
  );


  /********************************************************
   * JSONP
   *
   * Pas de problème CORS avec GitHub Pages.
   ********************************************************/

  const callbackName =
    'scanCallback_' +
    Date.now();


  const params = new URLSearchParams({

    action: 'save',

    intervenant:
      intervenant,

    repere:
      repere,

    sn:
      sn,

    typeScan:
      lastScanType,

    callback:
      callbackName

  });


  const script =
    document.createElement('script');


  let finished = false;


  window[callbackName] =
    function(response) {

      finished = true;


      try {

        if (
          response &&
          response.success
        ) {

          showMessage(
            '✅ SN enregistré dans Google Sheet.',
            'success'
          );

          scanResult.style.display =
            'block';

          scanResult.className =
            'status ok';

          scanResult.textContent =
            '✅ Enregistré : ' +
            sn;

        } else {

          showMessage(
            '❌ ' +
            (
              response &&
              response.message
                ? response.message
                : 'Erreur Google Sheet.'
            ),
            'error'
          );

        }

      } catch (error) {

        showMessage(
          '❌ Erreur de réponse Google Sheet.',
          'error'
        );

      }


      button.disabled =
        false;

      button.textContent =
        '☑️ ENREGISTRER SN';


      cleanup();

    };


  function cleanup() {

    try {

      delete window[
        callbackName
      ];

    } catch (e) {}

    if (script.parentNode) {

      script.parentNode.removeChild(
        script
      );

    }

  }


  script.onerror =
    function() {

      if (finished) {
        return;
      }


      showMessage(
        '❌ Impossible de contacter Google Sheet. Vérifiez le déploiement Apps Script.',
        'error'
      );


      button.disabled =
        false;

      button.textContent =
        '☑️ ENREGISTRER SN';


      cleanup();

    };


  script.src =
    API_URL +
    '?' +
    params.toString();


  document.body.appendChild(
    script
  );


  /******** TIMEOUT ********/

  setTimeout(
    function() {

      if (!finished) {

        showMessage(
          '❌ Temps de réponse dépassé. Vérifiez Apps Script.',
          'error'
        );

        button.disabled =
          false;

        button.textContent =
          '☑️ ENREGISTRER SN';

        cleanup();

      }

    },
    15000
  );

}


/********************************************************
 * MESSAGE
 ********************************************************/

function showMessage(
  text,
  type
) {

  message.className =
    'message ' + type;

  message.style.display =
    'block';

  message.textContent =
    text;

}


/********************************************************
 * NOUVEAU SCAN
 ********************************************************/

function newScan() {

  stopCamera();


  snInput.value =
    '';

  scanResult.style.display =
    'none';


  message.style.display =
    'none';


  lastScanType =
    'MANUEL';


  snInput.focus();

}


/********************************************************
 * TEST API AU CHARGEMENT
 ********************************************************/

function testAPI() {

  const callbackName =
    'testCallback_' +
    Date.now();


  const script =
    document.createElement('script');


  const params =
    new URLSearchParams({

      action: 'test',

      callback:
        callbackName

    });


  window[callbackName] =
    function(response) {

      console.log(
        'API TEST:',
        response
      );

      delete window[
        callbackName
      ];

      if (
        script.parentNode
      ) {

        script.parentNode.removeChild(
          script
        );

      }

    };


  script.src =
    API_URL +
    '?' +
    params.toString();


  script.onerror =
    function() {

      console.error(
        'API inaccessible'
      );

    };


  document.body.appendChild(
    script
  );

}


/********************************************************
 * START
 ********************************************************/

window.addEventListener(
  'load',
  function() {

    testAPI();

  }
);

</script>

</body>
</html>
