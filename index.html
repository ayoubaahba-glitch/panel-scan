<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>SCAN PANNEAUX</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px 10px 40px;
  background: #eef1f5;
  font-family: Arial, Helvetica, sans-serif;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 36px;
  margin: 10px 0 25px;
  font-weight: 900;
}

.card {
  background: white;
  border-radius: 25px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 7px 22px rgba(0,0,0,.08);
}

label {
  display: block;
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 10px;
}

input {
  width: 100%;
  height: 62px;
  border-radius: 17px;
  border: 3px solid #d1d5db;
  padding: 0 16px;
  font-size: 21px;
  outline: none;
  background: white;
}

input:focus {
  border-color: #2563eb;
}

#repere {
  text-transform: uppercase;
}

.repere-ok {
  background: #dcfce7;
  border-color: #16a34a !important;
}

.repere-error {
  background: #fee2e2;
  border-color: #dc2626 !important;
}

.status {
  margin-top: 10px;
  padding: 12px;
  border-radius: 14px;
  text-align: center;
  font-size: 17px;
  font-weight: 800;
}

.status-ok {
  background: #dcfce7;
  color: #166534;
}

.status-error {
  background: #fee2e2;
  color: #991b1b;
}

.status-info {
  background: #dbeafe;
  color: #1e40af;
}

.current {
  margin-top: 15px;
  background: #f3f4f6;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
}

.current-title {
  font-size: 16px;
  color: #6b7280;
  font-weight: 700;
}

.current-value {
  margin-top: 5px;
  font-size: 32px;
  font-weight: 900;
}

button {
  width: 100%;
  min-height: 65px;
  border: none;
  border-radius: 18px;
  margin-top: 12px;
  padding: 10px 15px;
  font-size: 21px;
  font-weight: 900;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
}

.btn-camera {
  background: #16a34a;
}

.btn-save {
  background: #2563eb;
}

.btn-new {
  background: #111827;
}

#cameraBox {
  display: none;
  margin-top: 15px;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 20px;
  background: #000;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  object-fit: cover !important;
}

.camera-info {
  text-align: center;
  margin-top: 8px;
  font-size: 15px;
  color: #6b7280;
}

.zoom-info {
  text-align: center;
  margin-top: 8px;
  font-size: 16px;
  font-weight: 800;
  color: #374151;
}

.message {
  margin-top: 15px;
  border-radius: 17px;
  padding: 17px;
  text-align: center;
  font-size: 19px;
  font-weight: 900;
  display: none;
  white-space: pre-line;
}

.message.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.message.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.message.info {
  display: block;
  background: #dbeafe;
  color: #1e40af;
}

@media (max-width: 600px) {

  h1 {
    font-size: 32px;
  }

  .card {
    padding: 18px;
  }

  label {
    font-size: 20px;
  }

  input {
    font-size: 19px;
  }

  button {
    font-size: 19px;
  }

}

</style>

</head>


<body>

<div class="container">

<h1>📋 SCAN PANNEAUX</h1>


<!-- INTERVENANT -->

<div class="card">

<label for="intervenant">
👷 INTERVENANT
</label>

<input
  id="intervenant"
  type="text"
  placeholder="Nom de l'intervenant"
  autocomplete="name"
>

</div>


<!-- REPERE -->

<div class="card">

<label for="repere">
📍 REPÈRE
</label>

<input
  id="repere"
  type="text"
  placeholder="Exemple : CB1-S1-04"
  maxlength="20"
  autocomplete="off"
>

<div
  id="repereStatus"
  class="status"
>
Écrire le repère sous la forme CBX-SX-XX
</div>

<div class="current">

<div class="current-title">
REPÈRE ACTUEL
</div>

<div
  id="repereCurrent"
  class="current-value"
>
Aucun
</div>

</div>

</div>


<!-- CAMERA -->

<div class="card">

<button
  id="cameraButton"
  class="btn-camera"
  type="button"
>
📷 OUVRIR LA CAMÉRA
</button>

<div class="camera-info">
Caméra arrière + tentative de démarrage à 1×
</div>

<div
  id="zoomInfo"
  class="zoom-info"
>
Zoom : 1×
</div>

<div id="cameraBox">

<div id="reader"></div>

<button
  id="closeCameraButton"
  class="btn-new"
  type="button"
>
❌ FERMER LA CAMÉRA
</button>

</div>

</div>


<!-- SN -->

<div class="card">

<label for="sn">
SN
</label>

<input
  id="sn"
  type="text"
  placeholder="Scanner ou saisir le SN"
  autocomplete="off"
>

<div
  id="scanStatus"
  class="status"
  style="display:none;"
></div>

<button
  id="saveButton"
  class="btn-save"
  type="button"
>
✅ ENREGISTRER SN
</button>

<button
  id="newButton"
  class="btn-new"
  type="button"
>
🔄 NOUVEAU SCAN
</button>

<div
  id="message"
  class="message"
></div>

</div>

</div>


<!-- LIBRAIRIE SCANNER -->

<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/**********************************************************
 * GOOGLE APPS SCRIPT
 **********************************************************/

const API_URL =
'https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec';


/**********************************************************
 * ELEMENTS
 **********************************************************/

const intervenant =
document.getElementById('intervenant');

const repere =
document.getElementById('repere');

const repereStatus =
document.getElementById('repereStatus');

const repereCurrent =
document.getElementById('repereCurrent');

const sn =
document.getElementById('sn');

const saveButton =
document.getElementById('saveButton');

const newButton =
document.getElementById('newButton');

const cameraButton =
document.getElementById('cameraButton');

const closeCameraButton =
document.getElementById('closeCameraButton');

const cameraBox =
document.getElementById('cameraBox');

const message =
document.getElementById('message');

const scanStatus =
document.getElementById('scanStatus');

const zoomInfo =
document.getElementById('zoomInfo');


/**********************************************************
 * VARIABLES
 **********************************************************/

let html5QrCode = null;

let cameraRunning = false;

let cameraTrack = null;

let requestCounter = 0;


/**********************************************************
 * VALIDATION REPERE
 *
 * Format :
 * CB1-S1-04
 * CB2-S3-27
 * etc.
 **********************************************************/

function isValidRepere(value) {

return /^CB\d+-S\d+-\d{2}$/i.test(
value.trim()
);

}


repere.addEventListener(
'input',
function() {

this.value =
this.value.toUpperCase();

const value =
this.value.trim();


if (!value) {

repere.classList.remove(
'repere-ok',
'repere-error'
);

repereStatus.className =
'status';

repereStatus.textContent =
'Écrire le repère sous la forme CBX-SX-XX';

repereCurrent.textContent =
'Aucun';

return;

}


if (isValidRepere(value)) {

repere.classList.remove(
'repere-error'
);

repere.classList.add(
'repere-ok'
);

repereStatus.className =
'status status-ok';

repereStatus.textContent =
'✅ REPÈRE CORRECT';

repereCurrent.textContent =
value;

} else {

repere.classList.remove(
'repere-ok'
);

repere.classList.add(
'repere-error'
);

repereStatus.className =
'status status-error';

repereStatus.textContent =
'❌ REPÈRE PAS CORRECT — ÉCRIRE : CBX-SX-XX';

repereCurrent.textContent =
'Aucun';

}

}
);


/**********************************************************
 * MESSAGE
 **********************************************************/

function showMessage(text, type) {

message.textContent =
text;

message.className =
'message ' + type;

}


/**********************************************************
 * STATUS SCAN
 **********************************************************/

function showScanStatus(text, type) {

scanStatus.style.display =
'block';

scanStatus.textContent =
text;

scanStatus.className =
'status ' + type;

}


/**********************************************************
 * JSONP
 **********************************************************/

function jsonp(params, timeout = 15000) {

return new Promise(
function(resolve, reject) {

const callbackName =
'__scanCallback_' +
Date.now() +
'_' +
(++requestCounter);

const script =
document.createElement('script');

let timer;


function cleanup() {

clearTimeout(timer);

try {

delete window[callbackName];

} catch (e) {

window[callbackName] =
undefined;

}

if (script.parentNode) {

script.parentNode.removeChild(
script
);

}

}


window[callbackName] =
function(data) {

cleanup();

resolve(data);

};


const query =
new URLSearchParams();


Object.keys(params).forEach(
function(key) {

query.append(
key,
params[key]
);

}
);


query.append(
'callback',
callbackName
);

query.append(
'_',
Date.now()
);


script.src =
API_URL +
'?' +
query.toString();

script.async =
true;


script.onerror =
function() {

cleanup();

reject(
new Error(
'Impossible de contacter Google Apps Script.'
)
);

};


document.body.appendChild(
script
);


timer =
setTimeout(
function() {

cleanup();

reject(
new Error(
'Délai dépassé. Google Apps Script ne répond pas.'
)
);

},
timeout
);

}
);

}


/**********************************************************
 * VERIFICATION SN
 **********************************************************/

async function checkSN(snValue) {

try {

showScanStatus(
'🔎 Vérification du SN...',
'status-info'
);


const result =
await jsonp({

action: 'check',

sn: snValue

});


if (!result.success) {

showScanStatus(
'❌ ' +
(
result.message ||
'Erreur de vérification.'
),
'status-error'
);

return false;

}


if (result.exists) {

showScanStatus(
'❌ SN DÉJÀ SCANNÉ — REPÈRE : ' +
(
result.repere ||
'inconnu'
),
'status-error'
);

showMessage(
'❌ SN DÉJÀ SCANNÉ\nRepère : ' +
(
result.repere ||
'inconnu'
),
'error'
);

return false;

}


showScanStatus(
'✅ SN DISPONIBLE',
'status-ok'
);

return true;


} catch (error) {

console.error(error);

showScanStatus(
'❌ Impossible de contacter Google Sheet.',
'status-error'
);

showMessage(
'❌ Impossible de contacter Google Sheet.\nVérifiez Apps Script.',
'error'
);

return false;

}

}


/**********************************************************
 * ENREGISTRER SN
 **********************************************************/

saveButton.addEventListener(
'click',
async function() {

const nom =
intervenant.value.trim();

const repereValue =
repere.value.trim().toUpperCase();

const snValue =
sn.value.trim();


if (!nom) {

showMessage(
'⚠️ Veuillez saisir le nom de l’intervenant.',
'error'
);

intervenant.focus();

return;

}


if (!isValidRepere(repereValue)) {

showMessage(
'❌ REPÈRE PAS CORRECT.\nÉCRIRE : CBX-SX-XX',
'error'
);

repere.focus();

return;

}


if (!snValue) {

showMessage(
'⚠️ Veuillez scanner ou saisir le SN.',
'error'
);

sn.focus();

return;

}


saveButton.disabled =
true;


try {

const available =
await checkSN(
snValue
);


if (!available) {

saveButton.disabled =
false;

return;

}


showMessage(
'⏳ Enregistrement dans Google Sheet...',
'info'
);


const result =
await jsonp({

action: 'save',

intervenant: nom,

repere: repereValue,

sn: snValue,

typeScan: 'CAMERA'

});


if (
result.code ===
'DUPLICATE_SN'
) {

showMessage(
'❌ SN DÉJÀ SCANNÉ\nRepère : ' +
(
result.repere ||
'inconnu'
),
'error'
);

return;

}


if (!result.success) {

showMessage(
'❌ ' +
(
result.message ||
'Erreur pendant l’enregistrement.'
),
'error'
);

return;

}


showMessage(
'✅ SN ENREGISTRÉ AVEC SUCCÈS\n' +
'Repère : ' +
result.repere,
'success'
);


showScanStatus(
'✅ Enregistré dans Google Sheet',
'status-ok'
);


sn.value =
'';


} catch (error) {

console.error(error);

showMessage(
'❌ Impossible de contacter Google Sheet.\n' +
error.message,
'error'
);

} finally {

saveButton.disabled =
false;

}

}
);


/**********************************************************
 * NOUVEAU SCAN
 **********************************************************/

newButton.addEventListener(
'click',
function() {

sn.value =
'';

scanStatus.style.display =
'none';

message.className =
'message';

message.textContent =
'';

sn.focus();

}
);


/**********************************************************
 * OUVRIR CAMERA
 **********************************************************/

cameraButton.addEventListener(
'click',
async function() {

if (cameraRunning) {
return;
}


cameraBox.style.display =
'block';

cameraButton.disabled =
true;


try {

html5QrCode =
new Html5Qrcode(
'reader'
);


const config = {

fps: 10,

qrbox: function(
viewfinderWidth,
viewfinderHeight
) {

/*
 * CADRAGE LARGE
 */

return {

width:
Math.floor(
viewfinderWidth * 0.90
),

height:
Math.floor(
viewfinderHeight * 0.65
)

};

},

formatsToSupport: [

Html5QrcodeSupportedFormats.QR_CODE,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.CODE_93,

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.ITF,

Html5QrcodeSupportedFormats.CODABAR

]

};


/******************************************************
 * PREMIERE TENTATIVE :
 * CAMERA ARRIERE
 ******************************************************/

try {

await html5QrCode.start(

{
facingMode: "environment"
},

config,

onScanSuccess,

onScanFailure

);

}


/******************************************************
 * SI LA PREMIERE TENTATIVE ECHOUE :
 * DETECTER LES CAMERAS
 ******************************************************/

catch (firstError) {

console.log(
'Première caméra refusée :',
firstError
);


const cameras =
await Html5Qrcode.getCameras();


if (
!cameras ||
cameras.length === 0
) {

throw new Error(
'Aucune caméra détectée par Chrome.'
);

}


/*
 * Par défaut prendre la dernière caméra.
 */

let cameraId =
cameras[
cameras.length - 1
].id;


/*
 * Chercher caméra arrière
 */

for (
let i = 0;
i < cameras.length;
i++
) {

const label =
(
cameras[i].label ||
''
).toLowerCase();


if (

label.includes('back') ||

label.includes('rear') ||

label.includes('environment') ||

label.includes('arrière')

) {

cameraId =
cameras[i].id;

break;

}

}


/*
 * Deuxième tentative avec ID caméra
 */

await html5QrCode.start(

cameraId,

config,

onScanSuccess,

onScanFailure

);

}


cameraRunning =
true;


/*
 * Attendre que la vidéo existe
 * puis essayer 1×
 */

setTimeout(
function() {

forceZoom1x();

},
700
);


} catch (error) {

console.error(
'ERREUR CAMERA :',
error
);


cameraBox.style.display =
'none';

cameraButton.disabled =
false;


let msg =
'❌ IMPOSSIBLE D’OUVRIR LA CAMÉRA.';


if (
error &&
error.message
) {

msg +=
'\n\n' +
error.message;

}


msg +=
'\n\nVérifiez l’autorisation caméra de Chrome.';


showMessage(
msg,
'error'
);

}

}
);


/**********************************************************
 * SCAN REUSSI
 **********************************************************/

async function onScanSuccess(
decodedText
) {

if (!decodedText) {
return;
}


sn.value =
decodedText.trim();


showScanStatus(
'✅ CODE DÉTECTÉ : ' +
decodedText,
'status-ok'
);


await stopCamera();

}


/**********************************************************
 * ERREUR NORMALE DE RECHERCHE
 **********************************************************/

function onScanFailure(
errorMessage
) {

/*
 * Ne rien afficher.
 */

}


/**********************************************************
 * FORCER ZOOM 1×
 **********************************************************/

async function forceZoom1x() {

try {

const video =
document.querySelector(
'#reader video'
);


if (!video) {

zoomInfo.textContent =
'Zoom : automatique';

return;

}


const stream =
video.srcObject;


if (!stream) {

zoomInfo.textContent =
'Zoom : automatique';

return;

}


const tracks =
stream.getVideoTracks();


if (!tracks.length) {

zoomInfo.textContent =
'Zoom : automatique';

return;

}


cameraTrack =
tracks[0];


const capabilities =
cameraTrack.getCapabilities();


if (
capabilities &&
capabilities.zoom
) {

let zoom =
1;


if (
capabilities.zoom.min !== undefined &&
zoom < capabilities.zoom.min
) {

zoom =
capabilities.zoom.min;

}


if (
capabilities.zoom.max !== undefined &&
zoom > capabilities.zoom.max
) {

zoom =
capabilities.zoom.max;

}


await cameraTrack.applyConstraints({

advanced: [
{
zoom: zoom
}
]

});


zoomInfo.textContent =
'Zoom : ' +
Number(zoom).toFixed(1) +
'×';

} else {

zoomInfo.textContent =
'Zoom : automatique';

}

} catch (error) {

console.log(
'Zoom 1× non disponible :',
error
);

zoomInfo.textContent =
'Zoom : automatique';

}

}


/**********************************************************
 * FERMER CAMERA
 **********************************************************/

closeCameraButton.addEventListener(
'click',
function() {

stopCamera();

}
);


/**********************************************************
 * STOP CAMERA
 **********************************************************/

async function stopCamera() {

try {

if (
html5QrCode &&
cameraRunning
) {

await html5QrCode.stop();

}

} catch (error) {

console.log(error);

}


try {

if (html5QrCode) {

await html5QrCode.clear();

}

} catch (error) {

console.log(error);

}


try {

if (cameraTrack) {

cameraTrack.stop();

}

} catch (error) {

console.log(error);

}


const video =
document.querySelector(
'#reader video'
);


if (
video &&
video.srcObject
) {

try {

video.srcObject
.getTracks()
.forEach(
function(track) {

track.stop();

}
);

} catch (error) {

console.log(error);

}

}


html5QrCode =
null;

cameraTrack =
null;

cameraRunning =
false;

cameraBox.style.display =
'none';

cameraButton.disabled =
false;

zoomInfo.textContent =
'Zoom : 1×';

}


/**********************************************************
 * TEST GOOGLE APPS SCRIPT
 **********************************************************/

window.addEventListener(
'load',
async function() {

try {

const result =
await jsonp({
action: 'test'
});


console.log(
'TEST GOOGLE SHEET :',
result
);


} catch (error) {

console.error(
'TEST GOOGLE SHEET ERROR :',
error
);

}

});

</script>

</body>

</html>
