<html lang="fr">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 15px 10px 40px;
  background: #eef1f5;
  font-family: Arial, Helvetica, sans-serif;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 36px;
  margin: 10px 0 25px;
  font-weight: 900;
}

.card {
  background: white;
  border-radius: 25px;
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: 0 7px 22px rgba(0,0,0,.08);
}

label {
  display: block;
  font-size: 22px;
  font-weight: 900;
  margin-bottom: 10px;
}

input {
  width: 100%;
  height: 62px;
  border-radius: 17px;
  border: 3px solid #d1d5db;
  padding: 0 16px;
  font-size: 21px;
  outline: none;
  background: white;
}

input:focus {
  border-color: #2563eb;
}

#repere {
  text-transform: uppercase;
}

.repere-ok {
  background: #dcfce7;
  border-color: #16a34a !important;
}

.repere-error {
  background: #fee2e2;
  border-color: #dc2626 !important;
}

.status {
  margin-top: 10px;
  padding: 12px;
  border-radius: 14px;
  text-align: center;
  font-size: 17px;
  font-weight: 800;
}

.status-ok {
  background: #dcfce7;
  color: #166534;
}

.status-error {
  background: #fee2e2;
  color: #991b1b;
}

.status-info {
  background: #dbeafe;
  color: #1e40af;
}

.current {
  margin-top: 15px;
  background: #f3f4f6;
  border-radius: 18px;
  padding: 15px;
  text-align: center;
}

.current-title {
  font-size: 16px;
  color: #6b7280;
  font-weight: 700;
}

.current-value {
  margin-top: 5px;
  font-size: 32px;
  font-weight: 900;
}

button {
  width: 100%;
  min-height: 65px;
  border: none;
  border-radius: 18px;
  margin-top: 12px;
  padding: 10px 15px;
  font-size: 21px;
  font-weight: 900;
  color: white;
  cursor: pointer;
}

button:disabled {
  opacity: .55;
}

.btn-camera {
  background: #16a34a;
}

.btn-save {
  background: #2563eb;
}

.btn-new {
  background: #111827;
}

.btn-camera2 {
  background: #7c3aed;
}

#cameraBox {
  display: none;
  margin-top: 15px;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 20px;
  background: #000;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  object-fit: cover !important;
}

.camera-info {
  text-align: center;
  margin-top: 8px;
  font-size: 15px;
  color: #6b7280;
}

.zoom-info {
  text-align: center;
  margin-top: 8px;
  font-size: 16px;
  font-weight: 800;
  color: #374151;
}

.camera-list {
  display: none;
  margin-top: 15px;
}

.camera-list-title {
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 8px;
}

.camera-item {
  width: 100%;
  background: #f3f4f6;
  color: #111827;
  border: 2px solid #d1d5db;
  border-radius: 14px;
  padding: 12px;
  margin-top: 8px;
  text-align: left;
  font-size: 15px;
  font-weight: 700;
}

.camera-item.active {
  border-color: #16a34a;
  background: #dcfce7;
}

.camera-id {
  display: block;
  margin-top: 5px;
  font-size: 11px;
  color: #6b7280;
  word-break: break-all;
}

.message {
  margin-top: 15px;
  border-radius: 17px;
  padding: 17px;
  text-align: center;
  font-size: 19px;
  font-weight: 900;
  display: none;
  white-space: pre-line;
}

.message.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.message.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.message.info {
  display: block;
  background: #dbeafe;
  color: #1e40af;
}

@media (max-width: 600px) {

  h1 {
    font-size: 32px;
  }

  .card {
    padding: 18px;
  }

  label {
    font-size: 20px;
  }

  input {
    font-size: 19px;
  }

  button {
    font-size: 19px;
  }

}

</style>

</head>


<body>

<div class="container">

<h1>📋 SCAN PANNEAUX</h1>


<!-- INTERVENANT -->

<div class="card">

<label for="intervenant">
👷 INTERVENANT
</label>

<input
  id="intervenant"

>

</div>


<!-- REPERE -->

<div class="card">

<label for="repere">
📍 REPÈRE
</label>

<input
  id="repere"
  type="text"
  placeholder="Exemple : CB1-S1-04"
  maxlength="20"

>

<div
  id="repereStatus"
  class="status"
>
Écrire le repère sous la forme CBX-SX-XX
</div>

<div class="current">

<div class="current-title">
REPÈRE ACTUEL
</div>

<div
  id="repereCurrent"
  class="current-value"
>
Aucun
</div>

</div>

</div>


<!-- CAMERA -->

<div class="card">

<button
  id="cameraButton"
  class="btn-camera"
  type="button"
>
📷 OUVRIR CAMÉRA 1×
</button>

<div class="camera-info">
La caméra arrière principale est sélectionnée automatiquement.
</div>

<div
  id="zoomInfo"
  class="zoom-info"
>
Caméra : recherche...
</div>

<div id="cameraBox">

<div id="reader"></div>

<button
  id="showCamerasButton"
  class="btn-camera2"
  type="button"
>
📱 AFFICHER LES CAMÉRAS
</button>

<div

>

<div class="camera-list-title">
📱 Caméras détectées
</div>

<div id="cameraItems"></div>

</div>

  id="closeCameraButton"
  class="btn-new"
  type="button"
>
❌ FERMER LA CAMÉRA
</button>

</div>

<!-- SN -->

<div class="card">

<label for="sn">
SN
</label>

<input
  id="sn"
  type="text"
  placeholder="Scanner ou saisir le SN"
  autocomplete="off"
>

<div
  id="scanStatus"
  class="status"
  style="display:none;"
></div>

<button
  id="saveButton"
  class="btn-save"
  type="button"
>
✅ ENREGISTRER SN
</button>

<button
  id="newButton"
  class="btn-new"
  type="button"
>
🔄 NOUVEAU SCAN
</button>

<div
  id="message"
  class="message"
></div>

</div>

</div>


<script src="https://unpkg.com/html5-qrcode"></script>


<script>

/**********************************************************
 * GOOGLE APPS SCRIPT
 **********************************************************/

const API_URL =
'https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec';


/**********************************************************
 * ELEMENTS
 **********************************************************/

const intervenant =
document.getElementById('intervenant');

const repere =
document.getElementById('repere');

const repereStatus =
document.getElementById('repereStatus');

const repereCurrent =
document.getElementById('repereCurrent');

const sn =
document.getElementById('sn');

const saveButton =
document.getElementById('saveButton');

const newButton =
document.getElementById('newButton');

const cameraButton =
document.getElementById('cameraButton');

const closeCameraButton =
document.getElementById('closeCameraButton');

const showCamerasButton =
document.getElementById('showCamerasButton');

const cameraBox =
document.getElementById('cameraBox');

const cameraList =
document.getElementById('cameraList');

const cameraItems =
document.getElementById('cameraItems');

const message =
document.getElementById('message');

const scanStatus =
document.getElementById('scanStatus');

const zoomInfo =
document.getElementById('zoomInfo');


/**********************************************************
 * VARIABLES
 **********************************************************/

let html5QrCode = null;

let cameraRunning = false;

let cameraTrack = null;

let requestCounter = 0;

let detectedCameras = [];

let currentCameraId = null;


/**********************************************************
 * REPERE
 **********************************************************/

function isValidRepere(value) {

return /^CB\d+-S\d+-\d{2}$/i.test(
value.trim()
);

}


repere.addEventListener(
'input',
function() {

this.value =
this.value.toUpperCase();

const value =
this.value.trim();


if (!value) {

repere.classList.remove(
'repere-ok',
'repere-error'
);

repereStatus.className =
'status';

repereStatus.textContent =
'Écrire le repère sous la forme CBX-SX-XX';

repereCurrent.textContent =
'Aucun';

return;

}


if (isValidRepere(value)) {

repere.classList.remove(
'repere-error'
);

repere.classList.add(
'repere-ok'
);

repereStatus.className =
'status status-ok';

repereStatus.textContent =
'✅ REPÈRE CORRECT';

repereCurrent.textContent =
value;

} else {

repere.classList.remove(
'repere-ok'
);

repere.classList.add(
'repere-error'
);

repereStatus.className =
'status status-error';

repereStatus.textContent =
'❌ REPÈRE PAS CORRECT — ÉCRIRE : CBX-SX-XX';

repereCurrent.textContent =
'Aucun';

}

}
);


/**********************************************************
 * MESSAGE
 **********************************************************/

function showMessage(text, type) {

message.textContent =
text;

message.className =
'message ' + type;

}


/**********************************************************
 * STATUS
 **********************************************************/

function showScanStatus(text, type) {

scanStatus.style.display =
'block';

scanStatus.textContent =
text;

scanStatus.className =
'status ' + type;

}


/**********************************************************
 * JSONP
 **********************************************************/

function jsonp(params, timeout = 15000) {

return new Promise(
function(resolve, reject) {

const callbackName =
'__scanCallback_' +
Date.now() +
'_' +
(++requestCounter);

const script =
document.createElement('script');

let timer;


function cleanup() {

clearTimeout(timer);

try {

delete window[callbackName];

} catch (e) {

window[callbackName] =
undefined;

}

if (script.parentNode) {

script.parentNode.removeChild(
script
);

}

}


window[callbackName] =
function(data) {

cleanup();

resolve(data);

};


const query =
new URLSearchParams();


Object.keys(params).forEach(
function(key) {

query.append(
key,
params[key]
);

}
);


query.append(
'callback',
callbackName
);

query.append(
'_',
Date.now()
);


script.src =
API_URL +
'?' +
query.toString();

script.async =
true;


script.onerror =
function() {

cleanup();

reject(
new Error(
'Impossible de contacter Google Apps Script.'
)
);

};


document.body.appendChild(
script
);


timer =
setTimeout(
function() {

cleanup();

reject(
new Error(
'Délai dépassé. Google Apps Script ne répond pas.'
)
);

},
timeout
);

}
);

}


/**********************************************************
 * CHECK SN
 **********************************************************/

async function checkSN(snValue) {

try {

showScanStatus(
'🔎 Vérification du SN...',
'status-info'
);


const result =
await jsonp({

action: 'check',

sn: snValue

});


if (!result.success) {

showScanStatus(
'❌ ' +
(
result.message ||
'Erreur de vérification.'
),
'status-error'
);

return false;

}


if (result.exists) {

showScanStatus(
'❌ SN DÉJÀ SCANNÉ — REPÈRE : ' +
(
result.repere ||
'inconnu'
),
'status-error'
);

showMessage(
'❌ SN DÉJÀ SCANNÉ\nRepère : ' +
(
result.repere ||
'inconnu'
),
'error'
);

return false;

}


showScanStatus(
'✅ SN DISPONIBLE',
'status-ok'
);

return true;


} catch (error) {

console.error(error);

showMessage(
'❌ Impossible de contacter Google Sheet.',
'error'
);

return false;

}

}


/**********************************************************
 * ENREGISTRER
 **********************************************************/

saveButton.addEventListener(
'click',
async function() {

const nom =
intervenant.value.trim();

const repereValue =
repere.value.trim().toUpperCase();

const snValue =
sn.value.trim();


if (!nom) {

showMessage(
'⚠️ Veuillez saisir le nom de l’intervenant.',
'error'
);

intervenant.focus();

return;

}


if (!isValidRepere(repereValue)) {

showMessage(
'❌ REPÈRE PAS CORRECT.\nÉCRIRE : CBX-SX-XX',
'error'
);

repere.focus();

return;

}


if (!snValue) {

showMessage(
'⚠️ Veuillez scanner ou saisir le SN.',
'error'
);

sn.focus();

return;

}


saveButton.disabled =
true;


try {

const available =
await checkSN(
snValue
);


if (!available) {

saveButton.disabled =
false;

return;

}


showMessage(
'⏳ Enregistrement dans Google Sheet...',
'info'
);


const result =
await jsonp({

action: 'save',

intervenant: nom,

repere: repereValue,

sn: snValue,

typeScan: 'CAMERA'

});


if (
result.code ===
'DUPLICATE_SN'
) {

showMessage(
'❌ SN DÉJÀ SCANNÉ\nRepère : ' +
(
result.repere ||
'inconnu'
),
'error'
);

return;

}


if (!result.success) {

showMessage(
'❌ ' +
(
result.message ||
'Erreur pendant l’enregistrement.'
),
'error'
);

return;

}


showMessage(
'✅ SN ENREGISTRÉ AVEC SUCCÈS\n' +
'Repère : ' +
result.repere,
'success'
);


showScanStatus(
'✅ Enregistré dans Google Sheet',
'status-ok'
);


sn.value =
'';


} catch (error) {

console.error(error);

showMessage(
'❌ Impossible de contacter Google Sheet.',
'error'
);

} finally {

saveButton.disabled =
false;

}

}
);


/**********************************************************
 * NOUVEAU
 **********************************************************/

newButton.addEventListener(
'click',
function() {

sn.value = '';

scanStatus.style.display =
'none';

message.className =
'message';

message.textContent =
'';

sn.focus();

}
);


/**********************************************************
 * OBTENIR CAMERAS
 **********************************************************/

async function getAllCameras() {

try {

const cameras =
await Html5Qrcode.getCameras();


detectedCameras =
cameras || [];


console.log(
'CAMERAS DETECTEES :',
detectedCameras
);


displayCameras(
detectedCameras
);


return detectedCameras;


} catch (error) {

console.error(
'Erreur récupération caméras :',
error
);

return [];

}

}


/**********************************************************
 * AFFICHER CAMERAS
 **********************************************************/

function displayCameras(cameras) {

cameraItems.innerHTML =
'';


if (
!cameras ||
cameras.length === 0
) {

cameraItems.innerHTML =
'<div class="status status-error">' +
'❌ Aucune caméra détectée.' +
'</div>';

return;

}


cameras.forEach(
function(camera, index) {

const button =
document.createElement('button');


button.type =
'button';

button.className =
'camera-item';


if (
camera.id ===
currentCameraId
) {

button.classList.add(
'active'
);

}


let label =
camera.label ||
(
'Caméra ' +
(index + 1)
);


/*
 * Essayer d'identifier
 * la caméra.
 */

const lower =
label.toLowerCase();

let type =
'';


if (
lower.includes('back') ||
lower.includes('rear') ||
lower.includes('environment') ||
lower.includes('arrière')
) {

type =
' 📷 ARRIÈRE';

}

else if (
lower.includes('front') ||
lower.includes('user') ||
lower.includes('face') ||
lower.includes('avant')
) {

type =
' 🤳 AVANT';

}


button.innerHTML =
'<strong>' +
(index + 1) +
'. ' +
escapeHtml(label) +
type +
'</strong>' +
'<span class="camera-id">' +
escapeHtml(camera.id) +
'</span>';


button.addEventListener(
'click',
function() {

selectCamera(
camera.id
);

}
);


cameraItems.appendChild(
button
);

}
);

}


/**********************************************************
 * SECURISER HTML
 **********************************************************/

function escapeHtml(value) {

return String(value)
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;')
.replace(/'/g, '&#039;');

}


/**********************************************************
 * CHOISIR CAMERA AUTOMATIQUEMENT
 **********************************************************/

function chooseBestCamera(cameras) {

if (
!cameras ||
cameras.length === 0
) {

return null;

}


let best =
null;


/*
 * Priorité 1 :
 * arrière + main
 */

for (
const camera of cameras
) {

const name =
(
camera.label ||
''
).toLowerCase();


if (
(
name.includes('back') ||
name.includes('rear') ||
name.includes('environment') ||
name.includes('arrière')
)
&&
(
name.includes('main') ||
name.includes('wide') ||
name.includes('camera 0') ||
name.includes('camera0')
)
) {

best =
camera;

break;

}

}


/*
 * Priorité 2 :
 * arrière
 */

if (!best) {

for (
const camera of cameras
) {

const name =
(
camera.label ||
''
).toLowerCase();


if (
name.includes('back') ||
name.includes('rear') ||
name.includes('environment') ||
name.includes('arrière')
) {

best =
camera;

break;

}

}

}


/*
 * Priorité 3 :
 * éviter front
 */

if (!best) {

for (
const camera of cameras
) {

const name =
(
camera.label ||
''
).toLowerCase();


if (
!name.includes('front') &&
!name.includes('user') &&
!name.includes('face') &&
!name.includes('avant')
) {

best =
camera;

break;

}

}

}


/*
 * Dernière possibilité
 */

if (!best) {

best =
cameras[
cameras.length - 1
];

}


return best;

}


/**********************************************************
 * OUVRIR CAMERA
 **********************************************************/

cameraButton.addEventListener(
'click',
async function() {

if (cameraRunning) {
return;
}


cameraBox.style.display =
'block';

cameraButton.disabled =
true;

zoomInfo.textContent =
'🔎 Recherche de la caméra 1×...';


try {

html5QrCode =
new Html5Qrcode(
'reader'
);


const config = {

fps: 10,

qrbox: function(
viewfinderWidth,
viewfinderHeight
) {

return {

width:
Math.floor(
viewfinderWidth * 0.90
),

height:
Math.floor(
viewfinderHeight * 0.65
)

};

},

formatsToSupport: [

Html5QrcodeSupportedFormats.QR_CODE,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.CODE_93,

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.ITF,

Html5QrcodeSupportedFormats.CODABAR

]

};


/******************************************************
 * PREMIERE TENTATIVE :
 * DEMANDER CAMERA ARRIERE
 ******************************************************/

try {

await html5QrCode.start(

{
facingMode: {
ideal: 'environment'
}
},

config,

onScanSuccess,

onScanFailure

);


cameraRunning =
true;


zoomInfo.textContent =
'📷 Caméra arrière sélectionnée';


setTimeout(
forceZoom1x,
700
);


/*
 * Maintenant que l'autorisation
 * est donnée, récupérer les caméras.
 */

setTimeout(
getAllCameras,
1000
);


return;

}


/******************************************************
 * SI ECHEC :
 * LISTER LES CAMERAS
 ******************************************************/

catch (firstError) {

console.log(
'Première tentative échouée :',
firstError
);

}


/*
 * Récupérer les caméras
 */

const cameras =
await getAllCameras();


if (
!cameras ||
cameras.length === 0
) {

throw new Error(
'Aucune caméra détectée. Vérifiez l’autorisation caméra de Chrome.'
);

}


/*
 * Choisir la meilleure caméra
 */

const best =
chooseBestCamera(
cameras
);


if (!best) {

throw new Error(
'Impossible de choisir une caméra.'
);

}


console.log(
'CAMERA CHOISIE :',
best
);


zoomInfo.textContent =
'📷 Caméra choisie : ' +
(
best.label ||
best.id
);


/*
 * Démarrer avec son ID
 */

await html5QrCode.start(

best.id,

config,

onScanSuccess,

onScanFailure

);


currentCameraId =
best.id;

cameraRunning =
true;


displayCameras(
detectedCameras
);


setTimeout(
forceZoom1x,
700
);

} catch (error) {

console.error(
'ERREUR CAMERA :',
error
);


cameraBox.style.display =
'none';

cameraButton.disabled =
false;


showMessage(
'❌ IMPOSSIBLE D’OUVRIR LA CAMÉRA.\n\n' +
(
error.message ||
error
),
'error'
);

}

}
);


/**********************************************************
 * AFFICHER / CACHER LISTE CAMERAS
 **********************************************************/

showCamerasButton.addEventListener(
'click',
async function() {

if (
cameraList.style.display ===
'block'
) {

cameraList.style.display =
'none';

return;

}


cameraList.style.display =
'block';


if (
detectedCameras.length === 0
) {

await getAllCameras();

} else {

displayCameras(
detectedCameras
);

}

}
);


/**********************************************************
 * CHANGER CAMERA
 **********************************************************/

async function selectCamera(
cameraId
) {

if (!cameraId) {
return;
}


if (
cameraRunning &&
cameraId ===
currentCameraId
) {

return;

}


try {

showMessage(
'⏳ Changement de caméra...',
'info'
);


if (cameraRunning) {

await stopCamera();

}


cameraBox.style.display =
'block';

cameraButton.disabled =
true;


html5QrCode =
new Html5Qrcode(
'reader'
);


const config = {

fps: 10,

qrbox: function(
viewfinderWidth,
viewfinderHeight
) {

return {

width:
Math.floor(
viewfinderWidth * 0.90
),

height:
Math.floor(
viewfinderHeight * 0.65
)

};

},

formatsToSupport: [

Html5QrcodeSupportedFormats.QR_CODE,

Html5QrcodeSupportedFormats.CODE_128,

Html5QrcodeSupportedFormats.CODE_39,

Html5QrcodeSupportedFormats.CODE_93,

Html5QrcodeSupportedFormats.EAN_13,

Html5QrcodeSupportedFormats.EAN_8,

Html5QrcodeSupportedFormats.UPC_A,

Html5QrcodeSupportedFormats.UPC_E,

Html5QrcodeSupportedFormats.ITF,

Html5QrcodeSupportedFormats.CODABAR

]

};


await html5QrCode.start(

cameraId,

config,

onScanSuccess,

onScanFailure

);


currentCameraId =
cameraId;

cameraRunning =
true;


displayCameras(
detectedCameras
);


zoomInfo.textContent =
'📷 Caméra sélectionnée';


showMessage(
'✅ Caméra changée.',
'success'
);


setTimeout(
forceZoom1x,
700
);


} catch (error) {

console.error(
'Erreur changement caméra :',
error
);


cameraButton.disabled =
false;


showMessage(
'❌ Impossible d’utiliser cette caméra.\n' +
(
error.message ||
''
),
'error'
);

}

}


/**********************************************************
 * SCAN SUCCESS
 **********************************************************/

async function onScanSuccess(
decodedText
) {

if (!decodedText) {
return;
}


sn.value =
decodedText.trim();


showScanStatus(
'✅ CODE DÉTECTÉ : ' +
decodedText,
'status-ok'
);


await stopCamera();

}


/**********************************************************
 * SCAN FAILURE
 **********************************************************/

function onScanFailure(
errorMessage
) {

/*
 * Ne rien afficher.
 */

}


/**********************************************************
 * ZOOM 1×
 **********************************************************/

async function forceZoom1x() {

try {

const video =
document.querySelector(
'#reader video'
);


if (!video) {

zoomInfo.textContent =
'📷 Caméra active';

return;

}


const stream =
video.srcObject;


if (!stream) {

zoomInfo.textContent =
'📷 Caméra active';

return;

}


const tracks =
stream.getVideoTracks();


if (!tracks.length) {

return;

}


cameraTrack =
tracks[0];


const capabilities =
cameraTrack.getCapabilities();


if (
capabilities &&
capabilities.zoom
) {

let zoom =
1;


if (
capabilities.zoom.min !== undefined
) {

zoom =
Math.max(
zoom,
capabilities.zoom.min
);

}


if (
capabilities.zoom.max !== undefined
) {

zoom =
Math.min(
zoom,
capabilities.zoom.max
);

}


await cameraTrack.applyConstraints({

advanced: [
{
zoom: zoom
}
]

});


zoomInfo.textContent =
'📷 Zoom : ' +
Number(zoom).toFixed(1) +
'×';

} else {

zoomInfo.textContent =
'📷 Caméra active — zoom contrôlé par Android';

}

} catch (error) {

console.log(
'Zoom non disponible :',
error
);

zoomInfo.textContent =
'📷 Caméra active';

}

}


/**********************************************************
 * FERMER CAMERA
 **********************************************************/

closeCameraButton.addEventListener(
'click',
function() {

stopCamera();

}
);


/**********************************************************
 * STOP CAMERA
 **********************************************************/

async function stopCamera() {

try {

if (
html5QrCode &&
cameraRunning
) {

await html5QrCode.stop();

}

} catch (error) {

console.log(error);

}


try {

if (html5QrCode) {

await html5QrCode.clear();

}

} catch (error) {

console.log(error);

}


try {

if (cameraTrack) {

cameraTrack.stop();

}

} catch (error) {

console.log(error);

}


const video =
document.querySelector(
'#reader video'
);


if (
video &&
video.srcObject
) {

try {

video.srcObject
.getTracks()
.forEach(
function(track) {

track.stop();

}
);

} catch (error) {

console.log(error);

}

}


html5QrCode =
null;

cameraTrack =
null;

cameraRunning =
false;

cameraBox.style.display =
'none';

cameraButton.disabled =
false;

zoomInfo.textContent =
'Caméra : arrêtée';

}
