<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>SCAN PANNEAUX</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #eef1f5;
  font-family: Arial, sans-serif;
  color: #111827;
}

.container {
  width: 100%;
  max-width: 700px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 42px;
  margin: 15px 0 30px;
}

.card {
  background: white;
  border-radius: 28px;
  padding: 30px;
  margin-bottom: 25px;
  box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

label {
  display: block;
  font-size: 25px;
  font-weight: bold;
  margin-bottom: 12px;
}

input,
select {
  width: 100%;
  padding: 20px;
  border: 2px solid #d1d5db;
  border-radius: 20px;
  font-size: 25px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #2563eb;
}

input.repere-error {
  border-color: #dc2626;
  background: #fff1f2;
}

input.repere-ok {
  border-color: #16a34a;
  background: #f0fdf4;
}

.message {
  margin-top: 12px;
  padding: 15px;
  border-radius: 15px;
  font-size: 20px;
  font-weight: bold;
  display: none;
}

.message.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.message.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.current {
  text-align: center;
  background: #f3f4f6;
  border-radius: 25px;
  padding: 25px;
  margin-top: 20px;
}

.current-title {
  font-size: 22px;
  color: #6b7280;
}

.current-value {
  font-size: 42px;
  font-weight: bold;
  margin-top: 10px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 20px;
  padding: 20px;
  margin-top: 15px;
  font-size: 25px;
  font-weight: bold;
  color: white;
  cursor: pointer;
}

.btn-camera {
  background: #16a34a;
}

.btn-save {
  background: #2563eb;
}

.btn-new {
  background: #111827;
}

button:disabled {
  background: #9ca3af;
}

#cameraBox {
  display: none;
  margin-top: 20px;
}

video {
  width: 100%;
  border-radius: 20px;
  background: black;
}

.scan-info {
  text-align: center;
  font-size: 18px;
  margin-top: 10px;
  color: #6b7280;
}

.loading {
  text-align: center;
  font-size: 20px;
  color: #2563eb;
  display: none;
}

</style>

</head>

<body>

<div class="container">

<h1>📋 SCAN PANNEAUX</h1>

<!-- ========================================= -->
<!-- INTERVENANT -->
<!-- ========================================= -->

<div class="card">

<label>👷 INTERVENANT</label>

<input
  id="intervenant"
  type="text"
  placeholder="Nom de l'intervenant"
  autocomplete="off">

</div>


<!-- ========================================= -->
<!-- REPERE -->
<!-- ========================================= -->

<div class="card">

<label>📍 REPÈRE</label>

<input
  id="repere"
  type="text"
  placeholder="Exemple : CB1-S1-04"
  autocomplete="off"
  autocapitalize="characters"
  spellcheck="false">

<div
  id="repereMessage"
  class="message">
</div>

<div class="current">

<div class="current-title">
REPÈRE ACTUEL
</div>

<div
  id="repereActuel"
  class="current-value">
Aucun
</div>

</div>

</div>


<!-- ========================================= -->
<!-- CAMERA -->
<!-- ========================================= -->

<div class="card">

<button
  id="cameraButton"
  class="btn-camera"
  onclick="ouvrirCamera()">

📷 OUVRIR LA CAMÉRA

</button>

<div id="cameraBox">

<video
  id="video"
  autoplay
  playsinline>
</video>

<div class="scan-info">
Dirigez la caméra vers le QR code / code-barres
</div>

<button
  class="btn-new"
  onclick="fermerCamera()">

✖ FERMER LA CAMÉRA

</button>

</div>

</div>


<!-- ========================================= -->
<!-- SN -->
<!-- ========================================= -->

<div class="card">

<label>SN</label>

<input
  id="sn"
  type="text"
  placeholder="Scanner ou saisir le SN"
  autocomplete="off">

<button
  class="btn-save"
  id="saveButton"
  onclick="enregistrer()">

✅ ENREGISTRER SN

</button>

<button
  class="btn-new"
  onclick="nouveauScan()">

🔄 NOUVEAU SCAN

</button>

<div
  id="resultMessage"
  class="message">
</div>

<div
  id="loading"
  class="loading">

⏳ Enregistrement dans Google Sheet...

</div>

</div>

</div>


<script>

/* =====================================================
   VARIABLES
===================================================== */

let stream = null;
let scanning = false;

const intervenantInput =
  document.getElementById('intervenant');

const repereInput =
  document.getElementById('repere');

const snInput =
  document.getElementById('sn');

const repereMessage =
  document.getElementById('repereMessage');

const resultMessage =
  document.getElementById('resultMessage');

const repereActuel =
  document.getElementById('repereActuel');

const cameraBox =
  document.getElementById('cameraBox');

const video =
  document.getElementById('video');


/* =====================================================
   FORMAT REPERE
===================================================== */

/*
   FORMAT OBLIGATOIRE :

   CB1-S1-01
   CB1-S1-04
   CB2-S10-16
   CB6-S16-27

   CB + chiffre
   -
   S + chiffre
   -
   2 chiffres
*/

function estRepereValide(repere) {

  repere = String(repere || '')
    .trim()
    .toUpperCase();

  const regex = /^CB\d+-S\d+-\d{2}$/;

  return regex.test(repere);
}


/* =====================================================
   CONTROLE REPERE
===================================================== */

function controlerRepere() {

  let repere =
    repereInput.value
      .trim()
      .toUpperCase();

  repereInput.value = repere;

  if (!repere) {

    repereInput.classList.remove('repere-ok');
    repereInput.classList.remove('repere-error');

    repereMessage.className = 'message';
    repereMessage.textContent = '';

    repereActuel.textContent = 'Aucun';

    return false;
  }


  if (!estRepereValide(repere)) {

    repereInput.classList.remove('repere-ok');
    repereInput.classList.add('repere-error');

    repereMessage.className =
      'message error';

    repereMessage.textContent =
      '❌ REPÈRE PAS CORRECT — ÉCRIRE COMME : CB1-S1-04';

    repereActuel.textContent = 'Erreur';

    return false;
  }


  repereInput.classList.remove('repere-error');
  repereInput.classList.add('repere-ok');

  repereMessage.className =
    'message success';

  repereMessage.textContent =
    '✅ REPÈRE CORRECT';

  repereActuel.textContent =
    repere;

  return true;
}


/* =====================================================
   CONTROLE EN TEMPS REEL
===================================================== */

repereInput.addEventListener(
  'input',
  controlerRepere
);

repereInput.addEventListener(
  'blur',
  controlerRepere
);


/* =====================================================
   ENTER SUR REPERE
===================================================== */

repereInput.addEventListener(
  'keydown',
  function(event) {

    if (event.key === 'Enter') {

      event.preventDefault();

      if (controlerRepere()) {
        snInput.focus();
      }
    }

  }
);


/* =====================================================
   OUVRIR CAMERA
===================================================== */

async function ouvrirCamera() {

  try {

    cameraBox.style.display = 'block';

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: 'environment'
          }
        },

        audio: false

      });

    video.srcObject = stream;

    scanning = true;

    demarrerScan();

  } catch (error) {

    afficherResultat(
      '❌ Impossible d’ouvrir la caméra. Vérifiez l’autorisation caméra.',
      true
    );

  }

}


/* =====================================================
   FERMER CAMERA
===================================================== */

function fermerCamera() {

  scanning = false;

  if (stream) {

    stream
      .getTracks()
      .forEach(track => track.stop());

    stream = null;
  }

  video.srcObject = null;

  cameraBox.style.display = 'none';
}


/* =====================================================
   SCAN CODE AVEC BARCODEDETECTOR
===================================================== */

async function demarrerScan() {

  if (!('BarcodeDetector' in window)) {

    afficherResultat(
      '⚠️ Scanner caméra non disponible sur ce navigateur. Vous pouvez saisir le SN manuellement.',
      true
    );

    return;
  }


  let formats = [];

  try {

    formats =
      await BarcodeDetector.getSupportedFormats();

  } catch (e) {

    formats = [
      'qr_code',
      'code_128',
      'code_39',
      'ean_13',
      'ean_8',
      'upc_a',
      'upc_e'
    ];

  }


  const detector =
    new BarcodeDetector({
      formats: formats
    });


  async function scanLoop() {

    if (!scanning) {
      return;
    }

    if (video.readyState >= 2) {

      try {

        const codes =
          await detector.detect(video);

        if (codes.length > 0) {

          const valeur =
            codes[0].rawValue;

          if (valeur) {

            snInput.value =
              valeur.trim();

            fermerCamera();

            afficherResultat(
              '✅ Code détecté : ' +
              valeur,
              false
            );

            snInput.focus();

            return;
          }
        }

      } catch (error) {

        console.log(error);

      }

    }


    requestAnimationFrame(scanLoop);
  }


  scanLoop();

}


/* =====================================================
   ENREGISTRER
===================================================== */

function enregistrer() {

  resultMessage.className = 'message';
  resultMessage.textContent = '';

  const intervenant =
    intervenantInput.value.trim();

  const repere =
    repereInput.value
      .trim()
      .toUpperCase();

  const sn =
    snInput.value.trim();


  /* -----------------------------------------------
     INTERVENANT
  ------------------------------------------------ */

  if (!intervenant) {

    afficherResultat(
      '❌ Veuillez saisir l’intervenant.',
      true
    );

    intervenantInput.focus();

    return;
  }


  /* -----------------------------------------------
     REPERE
  ------------------------------------------------ */

  if (!estRepereValide(repere)) {

    controlerRepere();

    afficherResultat(
      '❌ REPÈRE PAS CORRECT — ÉCRIRE COMME : CB1-S1-04',
      true
    );

    repereInput.focus();

    return;
  }


  /* -----------------------------------------------
     SN
  ------------------------------------------------ */

  if (!sn) {

    afficherResultat(
      '❌ Veuillez scanner ou saisir le SN.',
      true
    );

    snInput.focus();

    return;
  }


  /* -----------------------------------------------
     DESACTIVER BOUTON
  ------------------------------------------------ */

  document.getElementById(
    'saveButton'
  ).disabled = true;

  document.getElementById(
    'loading'
  ).style.display = 'block';


  /* -----------------------------------------------
     ENVOI GOOGLE APPS SCRIPT
  ------------------------------------------------ */

  google.script.run

    .withSuccessHandler(function(response) {

      document.getElementById(
        'saveButton'
      ).disabled = false;

      document.getElementById(
        'loading'
      ).style.display = 'none';


      if (!response || !response.success) {

        afficherResultat(
          '❌ ' +
          (
            response && response.message
              ? response.message
              : 'Erreur Google Sheet.'
          ),
          true
        );

        return;
      }


      afficherResultat(
        '✅ ' +
        response.message +
        ' — ' +
        response.repere +
        ' — SN : ' +
        response.sn,
        false
      );

    })

    .withFailureHandler(function(error) {

      document.getElementById(
        'saveButton'
      ).disabled = false;

      document.getElementById(
        'loading'
      ).style.display = 'none';


      afficherResultat(
        '❌ Impossible de contacter Google Sheet : ' +
        error.message,
        true
      );

    })

    .enregistrerScan({

      intervenant:
        intervenant,

      repere:
        repere,

      sn:
        sn,

      typeScan:
        'QR / BARCODE'

    });

}


/* =====================================================
   NOUVEAU SCAN
===================================================== */

function nouveauScan() {

  snInput.value = '';

  resultMessage.className =
    'message';

  resultMessage.textContent = '';

  fermerCamera();

  snInput.focus();

}


/* =====================================================
   MESSAGE RESULTAT
===================================================== */

function afficherResultat(
  message,
  erreur
) {

  resultMessage.textContent =
    message;

  if (erreur) {

    resultMessage.className =
      'message error';

  } else {

    resultMessage.className =
      'message success';

  }

}

</script>

</body>

</html>
