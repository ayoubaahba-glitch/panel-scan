<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no">

  <title>SCAN PANNEAUX</title>


  <!-- QR / BARCODE SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f1f3f6;

      color: #111;
    }


    .container {

      width: 100%;
      max-width: 720px;

      margin: auto;

      padding: 18px;
    }


    h1 {

      text-align: center;

      font-size: 34px;

      margin:
        10px 0 25px 0;

      font-weight: 800;
    }


    .card {

      background: white;

      border-radius: 25px;

      padding: 25px;

      margin-bottom: 18px;

      box-shadow:
        0 5px 18px
        rgba(0,0,0,0.10);
    }


    .label {

      display: block;

      font-size: 20px;

      font-weight: 700;

      margin-bottom: 10px;
    }


    select,
    input {

      width: 100%;

      height: 62px;

      border-radius: 15px;

      border:
        1px solid #c7c7c7;

      padding: 0 18px;

      font-size: 20px;

      background: white;

      outline: none;
    }


    select:focus,
    input:focus {

      border:
        2px solid #2563eb;
    }


    .repere-card {

      text-align: center;

      background:
        #f7f8fa;
    }


    .repere-title {

      font-size: 19px;

      color: #666;

      margin-bottom: 5px;
    }


    .repere-value {

      font-size: 38px;

      font-weight: 800;

      color: #111;

      min-height: 48px;
    }


    button {

      width: 100%;

      height: 68px;

      border: none;

      border-radius: 15px;

      font-size: 22px;

      font-weight: 800;

      cursor: pointer;

      margin-top: 15px;
    }


    .camera-btn {

      background:
        #16a34a;

      color: white;
    }


    .camera-btn:active {

      transform: scale(0.98);
    }


    .save-btn {

      background:
        #2563eb;

      color: white;
    }


    .save-btn:disabled {

      background: #9ca3af;

      cursor: not-allowed;
    }


    .stop-btn {

      background:
        #dc2626;

      color: white;

      display: none;
    }


    #reader {

      width: 100%;

      margin-top: 20px;

      border-radius: 15px;

      overflow: hidden;

      display: none;
    }


    .status {

      margin-top: 15px;

      padding: 16px;

      border-radius: 15px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;

      display: none;
    }


    .status.success {

      display: block;

      background:
        #dcfce7;

      color:
        #166534;
    }


    .status.error {

      display: block;

      background:
        #fee2e2;

      color:
        #991b1b;
    }


    .status.info {

      display: block;

      background:
        #dbeafe;

      color:
        #1e40af;
    }


    .scan-ok {

      border:
        3px solid #16a34a !important;

      background:
        #f0fdf4 !important;
    }


    .small {

      text-align: center;

      color: #777;

      font-size: 14px;

      margin-top: 10px;
    }


    .history {

      margin-top: 10px;
    }


    .history-item {

      background: #f8fafc;

      border-radius: 12px;

      padding: 12px;

      margin-bottom: 8px;

      font-size: 14px;
    }


    .history-repere {

      font-weight: 800;

      color: #2563eb;
    }


    .history-sn {

      font-weight: 700;

      font-size: 17px;
    }


    .loader {

      display: none;

      text-align: center;

      padding: 10px;
    }


    @media(max-width: 500px) {

      .container {
        padding: 12px;
      }

      h1 {
        font-size: 31px;
      }

      .card {
        padding: 20px;
        border-radius: 22px;
      }

      .repere-value {
        font-size: 34px;
      }

      button {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    📋 SCAN PANNEAUX
  </h1>


  <!-- INTERVENANT -->
  <div class="card">

    <label class="label">
      👷 INTERVENANT
    </label>

    <select id="intervenant">

      <option value="">
        -- Choisir l'intervenant --
      </option>

      <option value="Intervenant 1">
        Intervenant 1
      </option>

      <option value="Intervenant 2">
        Intervenant 2
      </option>

      <option value="Intervenant 3">
        Intervenant 3
      </option>

      <option value="Intervenant 4">
        Intervenant 4
      </option>

      <option value="Intervenant 5">
        Intervenant 5
      </option>

    </select>

  </div>


  <!-- REPERE -->
  <div class="card">

    <label class="label">
      📍 REPÈRE
    </label>

    <select id="repere"
            onchange="changerRepere()">

      <option value="">
        -- Choisir le repère --
      </option>

    </select>


    <div class="repere-card"
         style="margin-top:20px;
                padding:20px;
                border-radius:18px;">

      <div class="repere-title">
        REPÈRE ACTUEL
      </div>

      <div id="repereActuel"
           class="repere-value">

        Aucun

      </div>

    </div>

  </div>


  <!-- CAMERA -->
  <div class="card">

    <button
      id="cameraBtn"
      class="camera-btn"
      onclick="ouvrirCamera()">

      📷 OUVRIR LA CAMÉRA

    </button>


    <div id="reader"></div>


    <button
      id="stopBtn"
      class="stop-btn"
      onclick="fermerCamera()">

      ✖ FERMER LA CAMÉRA

    </button>


    <div class="small">

      Placez le QR code ou le code-barres
      devant la caméra.

    </div>

  </div>


  <!-- SN -->
  <div class="card">

    <label class="label">
      SN
    </label>

    <input
      id="sn"
      type="text"
      inputmode="text"
      autocomplete="off"
      placeholder="Scanner ou saisir le SN...">


    <button
      id="saveBtn"
      class="save-btn"
      onclick="enregistrer()">

      ✅ ENREGISTRER SN

    </button>


    <div
      id="loader"
      class="loader">

      ⏳ Enregistrement...

    </div>


    <div
      id="status"
      class="status">
    </div>

  </div>


  <!-- HISTORIQUE -->
  <div class="card">

    <div class="label">
      📋 DERNIERS SCANS
    </div>

    <div
      id="history"
      class="history">

      Chargement...

    </div>

  </div>


</div>



<script>


/****************************************************
 * VARIABLES
 ****************************************************/

let scanner = null;

let cameraActive = false;

let dernierScan = '';



/****************************************************
 * DEMARRAGE
 ****************************************************/

document.addEventListener(
  'DOMContentLoaded',
  function() {

    chargerReperes();

    chargerHistorique();

  }
);



/****************************************************
 * CHARGER LES 27 REPÈRES
 ****************************************************/

function chargerReperes() {

  google.script.run

    .withSuccessHandler(function(reperes) {

      const select =
        document.getElementById('repere');

      select.innerHTML =
        '<option value="">-- Choisir le repère --</option>';

      reperes.forEach(function(repere) {

        const option =
          document.createElement('option');

        option.value = repere;

        option.textContent = repere;

        select.appendChild(option);

      });

    })

    .withFailureHandler(function(error) {

      afficherStatus(
        'Erreur chargement repères : ' +
        error.message,
        'error'
      );

    })

    .getReperes();

}



/****************************************************
 * CHANGER REPERE
 ****************************************************/

function changerRepere() {

  const select =
    document.getElementById('repere');

  const valeur =
    select.value;

  document.getElementById(
    'repereActuel'
  ).textContent =
    valeur || 'Aucun';

}



/****************************************************
 * OUVRIR CAMERA
 ****************************************************/

async function ouvrirCamera() {

  const intervenant =
    document.getElementById(
      'intervenant'
    ).value;

  const repere =
    document.getElementById(
      'repere'
    ).value;


  if (!intervenant) {

    afficherStatus(
      '⚠️ Choisissez d’abord l’intervenant.',
      'error'
    );

    return;
  }


  if (!repere) {

    afficherStatus(
      '⚠️ Choisissez d’abord le REPÈRE.',
      'error'
    );

    return;
  }


  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    afficherStatus(
      '❌ Le module caméra n’est pas chargé.',
      'error'
    );

    return;
  }


  const reader =
    document.getElementById(
      'reader'
    );

  reader.style.display =
    'block';


  document.getElementById(
    'cameraBtn'
  ).style.display =
    'none';


  document.getElementById(
    'stopBtn'
  ).style.display =
    'block';


  afficherStatus(
    '📷 Démarrage de la caméra...',
    'info'
  );


  scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const size =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        ) * 0.70;

      return {
        width: size,
        height: size
      };

    },

    aspectRatio: 1.0,

    rememberLastUsedCamera: true

  };


  try {

    await scanner.start(

      {
        facingMode: 'environment'
      },

      config,

      function(decodedText) {

        scanReussi(decodedText);

      },

      function(errorMessage) {

        // Ne rien afficher.
        // Ces erreurs sont normales
        // pendant la recherche du code.

      }

    );


    cameraActive = true;


    afficherStatus(
      '📷 Caméra active — présentez le code devant la caméra.',
      'info'
    );


  } catch (error) {

    console.error(error);


    document.getElementById(
      'reader'
    ).style.display =
      'none';


    document.getElementById(
      'cameraBtn'
    ).style.display =
      'block';


    document.getElementById(
      'stopBtn'
    ).style.display =
      'none';


    afficherStatus(

      '❌ Impossible d’ouvrir la caméra. ' +
      'Vérifiez l’autorisation caméra du téléphone.',

      'error'

    );

  }

}



/****************************************************
 * SCAN REUSSI
 ****************************************************/

function scanReussi(decodedText) {

  if (!decodedText) {
    return;
  }


  // Eviter les scans répétés
  if (
    dernierScan ===
    decodedText
  ) {

    return;

  }


  dernierScan =
    decodedText;


  const snInput =
    document.getElementById(
      'sn'
    );


  snInput.value =
    decodedText;


  snInput.classList.add(
    'scan-ok'
  );


  afficherStatus(

    '✅ Code scanné : ' +
    decodedText,

    'success'

  );


  // Fermer automatiquement
  // la caméra après le scan

  fermerCamera();


  // Petit délai avant
  // l'enregistrement

  setTimeout(
    function() {

      snInput.focus();

    },
    300
  );

}



/****************************************************
 * FERMER CAMERA
 ****************************************************/

async function fermerCamera() {

  if (
    scanner &&
    cameraActive
  ) {

    try {

      await scanner.stop();

    } catch (error) {

      console.log(
        'Caméra déjà arrêtée.'
      );

    }

    try {

      await scanner.clear();

    } catch (error) {

      console.log(
        'Clear caméra.'
      );

    }

  }


  cameraActive = false;

  scanner = null;


  document.getElementById(
    'reader'
  ).style.display =
    'none';


  document.getElementById(
    'cameraBtn'
  ).style.display =
    'block';


  document.getElementById(
    'stopBtn'
  ).style.display =
    'none';

}



/****************************************************
 * ENREGISTRER
 ****************************************************/

function enregistrer() {

  const intervenant =
    document.getElementById(
      'intervenant'
    ).value;

  const repere =
    document.getElementById(
      'repere'
    ).value;

  const sn =
    document.getElementById(
      'sn'
    ).value.trim();


  if (!intervenant) {

    afficherStatus(
      '⚠️ Choisissez l’intervenant.',
      'error'
    );

    return;
  }


  if (!repere) {

    afficherStatus(
      '⚠️ Choisissez le REPÈRE.',
      'error'
    );

    return;
  }


  if (!sn) {

    afficherStatus(
      '⚠️ Scannez ou saisissez le SN.',
      'error'
    );

    return;
  }


  const saveBtn =
    document.getElementById(
      'saveBtn'
    );


  saveBtn.disabled =
    true;


  document.getElementById(
    'loader'
  ).style.display =
    'block';


  afficherStatus(
    '⏳ Enregistrement dans Google Sheet...',
    'info'
  );


  const data = {

    intervenant:
      intervenant,

    repere:
      repere,

    sn:
      sn,

    typeScan:
      dernierScan === sn
        ? 'QR / BARCODE'
        : 'SAISIE MANUELLE'

  };


  google.script.run

    .withSuccessHandler(
      function(result) {

        saveBtn.disabled =
          false;

        document.getElementById(
          'loader'
        ).style.display =
          'none';


        afficherStatus(

          '✅ ENREGISTRÉ ! ' +
          'Repère : ' +
          result.repere +
          ' | SN : ' +
          result.sn,

          'success'

        );


        // Vider SN
        document.getElementById(
          'sn'
        ).value = '';


        document.getElementById(
          'sn'
        ).classList.remove(
          'scan-ok'
        );


        dernierScan =
          '';


        chargerHistorique();

      })

    .withFailureHandler(
      function(error) {

        saveBtn.disabled =
          false;

        document.getElementById(
          'loader'
        ).style.display =
          'none';


        afficherStatus(

          '❌ Impossible de contacter Google Sheet : ' +
          error.message,

          'error'

        );

      })

    .enregistrerSN(data);

}



/****************************************************
 * HISTORIQUE
 ****************************************************/

function chargerHistorique() {

  google.script.run

    .withSuccessHandler(
      function(data) {

        const history =
          document.getElementById(
            'history'
          );


        if (
          !data ||
          data.length === 0
        ) {

          history.innerHTML =
            '<div class="small">' +
            'Aucun scan pour le moment.' +
            '</div>';

          return;
        }


        history.innerHTML =
          '';


        data.forEach(
          function(item) {

            const div =
              document.createElement(
                'div'
              );


            div.className =
              'history-item';


            let dateText =
              '';


            try {

              dateText =
                new Date(
                  item.date
                ).toLocaleString(
                  'fr-FR'
                );

            } catch(e) {

              dateText =
                item.date;

            }


            div.innerHTML =

              '<div>' +
              '🕒 ' +
              dateText +
              '</div>' +

              '<div class="history-repere">' +
              '📍 ' +
              escapeHtml(
                item.repere
              ) +
              '</div>' +

              '<div>' +
              '👷 ' +
              escapeHtml(
                item.intervenant
              ) +
              '</div>' +

              '<div class="history-sn">' +
              'SN : ' +
              escapeHtml(
                item.sn
              ) +
              '</div>';


            history.appendChild(
              div
            );

          }
        );

      })

    .withFailureHandler(
      function(error) {

        document.getElementById(
          'history'
        ).innerHTML =
          'Erreur historique.';

      })

    .getDerniersScans();

}



/****************************************************
 * MESSAGE
 ****************************************************/

function afficherStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      'status'
    );


  status.textContent =
    message;


  status.className =
    'status ' + type;

}



/****************************************************
 * SECURITE HTML
 ****************************************************/

function escapeHtml(text) {

  const div =
    document.createElement(
      'div'
    );

  div.textContent =
    text == null
      ? ''
      : String(text);

  return div.innerHTML;

}


</script>


</body>

</html>
