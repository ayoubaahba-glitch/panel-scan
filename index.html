<script src="https://unpkg.com/html5-qrcode"></script>

<style>

}

  padding: 20px 12px 40px;
  background: #eef1f5;
  font-family:

  max-width: 650px;

}

h1 {
  text-align: center;
  font-size: 42px;
  margin: 15px 0 25px;
  font-weight: 900;

  background: white;

  display: block;

  width: 100%;

}

.btn-save {
  background: #2563eb;

.btn-new {

  opacity: .55;

}

  margin-top: 15px;

}

.success {

}

.error {
  background: #fee2e2;

}

.info {

  color: #1e40af;
}

.current {
  margin-top: 15px;
  padding: 20px;
  background: #f3f4f6;
  border-radius: 20px;
  text-align: center;
}

.current small {
  display: block;
  font-size: 18px;
  color: #6b7280;
  font-weight: 700;

.current strong {

#cameraZone {
  display: none;

}

#reader {
  width: 100%;

}

#cameraName {
  margin-top: 12px;

  text-align: center;
  background: #f3f4f6;
  border-radius: 12px;
  font-weight: 800;
}

.camera-list {
  margin-top: 12px;
}

.camera-list select {
  font-size: 16px;
  min-height: 50px;
}

.detected {
  margin-top: 12px;
  padding: 12px;
  background: #ecfdf5;
  color: #166534;
  border-radius: 12px;
  font-weight: 700;
}

.scan-result {
  margin-top: 12px;
  padding: 15px;
  border-radius: 15px;
  background: #dcfce7;
  color: #166534;
  text-align: center;
  font-weight: 900;
  font-size: 20px;

  display: none !important;
}

@media(max-width:500px) {

  body {
    padding: 10px 8px 30px;
  }

  h1 {
    font-size: 32px;
  }

  .card {
    padding: 18px;
    border-radius: 20px;
  }

  label {
    font-size: 18px;
  }

  input,
  select {
    min-height: 54px;
    font-size: 18px;
  }

  button {
    min-height: 58px;
    font-size: 18px;
  }

  .current strong {
    font-size: 28px;
  }
}

<body>

<div class="container">

<h1>
  📋 SCAN PANNEAUX
</h1>


<!-- INTERVENANT -->
<div class="card">

<label>
  👷 INTERVENANT
</label>

<input
  id="intervenant"
  type="text"
  placeholder="Nom de l'intervenant"
  autocomplete="name"
>

</div>


<!-- REPERE -->
<div class="card">

<label>
  📍 REPÈRE
</label>

<input
  id="repere"
  type="text"
  placeholder="Exemple : CB1-S1-01"
  autocomplete="off"
  autocapitalize="characters"
>

<div
  id="repereMessage"
  class="message info"
>
  Écrire le repère sous la forme :
  CB1-S1-01
</div>

<div class="current">

<small>
  REPÈRE ACTUEL
</small>

<strong id="currentRepere">
  Aucun
</strong>

</div>

</div>


<!-- CAMERA -->
<div class="card">

<button
  id="openCameraBtn"
  class="btn-camera"
  type="button"
>
  📷 OUVRIR CAMÉRA 1×
</button>

<div
  id="cameraZone"
>

<div id="reader"></div>

<div id="cameraName">
  📷 Caméra non sélectionnée
</div>

<div class="camera-list">

<select id="cameraSelect">

<option>
  Caméra automatique
</option>

</select>

</div>

<div
  id="cameraDetected"
  class="detected"
>
  Caméras : recherche...
</div>

</div>

<div
  id="cameraMessage"
  class="message hidden"
></div>

</div>


<!-- SN -->
<div class="card">

<label>
  SN
</label>

<input
  id="sn"
  type="text"
  placeholder="Scanner ou saisir le SN"
  autocomplete="off"
>

<div
  id="scanResult"
  class="scan-result hidden"
></div>

<button
  id="saveBtn"
  class="btn-save"
  type="button"
>
  ✅ ENREGISTRER SN
</button>

<button
  id="newBtn"
  class="btn-new"
  type="button"
>
  🔄 NOUVEAU SCAN
</button>

<div
  id="resultMessage"
  class="message hidden"
></div>

</div>

</div>


<script>

/****************************************************
 * CONFIGURATION
 ****************************************************/

const API_URL =
  'COLLE_ICI_TON_URL_APPS_SCRIPT';


/****************************************************
 * VARIABLES
 ****************************************************/

let scanner = null;

let scannerRunning = false;

let cameraBusy = false;

let cameras = [];

let selectedCameraId = null;

let lastDecodedText = '';

let lastDecodedTime = 0;


/****************************************************
 * ELEMENTS
 ****************************************************/

const intervenant =
  document.getElementById('intervenant');

const repere =
  document.getElementById('repere');

const currentRepere =
  document.getElementById('currentRepere');

const repereMessage =
  document.getElementById('repereMessage');

const sn =
  document.getElementById('sn');

const saveBtn =
  document.getElementById('saveBtn');

const newBtn =
  document.getElementById('newBtn');

const openCameraBtn =
  document.getElementById('openCameraBtn');

const cameraZone =
  document.getElementById('cameraZone');

const cameraName =
  document.getElementById('cameraName');

const cameraSelect =
  document.getElementById('cameraSelect');

const cameraDetected =
  document.getElementById('cameraDetected');

const cameraMessage =
  document.getElementById('cameraMessage');

const resultMessage =
  document.getElementById('resultMessage');

const scanResult =
  document.getElementById('scanResult');


/****************************************************
 * REPERE
 ****************************************************/

function validateRepere(value) {

  value =
    String(value || '')
      .trim()
      .toUpperCase();

  return /^CB\d+-S\d+-\d{2}$/.test(value);
}


function updateRepere() {

  const value =
    repere.value
      .trim()
      .toUpperCase();

  repere.value = value;

  if (!value) {

    currentRepere.textContent =
      'Aucun';

    repereMessage.className =
      'message info';

    repereMessage.textContent =
      'Écrire le repère sous la forme : CB1-S1-01';

    return false;
  }

  if (validateRepere(value)) {

    currentRepere.textContent =
      value;

    repereMessage.className =
      'message success';

    repereMessage.textContent =
      '✅ REPÈRE CORRECT';

    return true;

  } else {

    currentRepere.textContent =
      'Aucun';

    repereMessage.className =
      'message error';

    repereMessage.textContent =
      '❌ REPÈRE PAS CORRECT — ÉCRIRE COMME : CB1-S1-01';

    return false;
  }
}


repere.addEventListener(
  'input',
  updateRepere
);


/****************************************************
 * MESSAGE
 ****************************************************/

function showMessage(
  element,
  text,
  type
) {

  element.textContent =
    text;

  element.className =
    'message ' + type;

  element.classList.remove(
    'hidden'
  );
}


function hideMessage(element) {

  element.classList.add(
    'hidden'
  );
}


/****************************************************
 * API JSONP
 *
 * Utilisé pour éviter les problèmes CORS
 * sur téléphone Android / GitHub Pages.
 ****************************************************/

function apiGet(params) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'googleApiCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );

      const script =
        document.createElement('script');

      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'Timeout Google Apps Script'
              )
            );

          },
          15000
        );


      function cleanup() {

        clearTimeout(timeout);

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        try {
          delete window[callbackName];
        } catch(e) {
          window[callbackName] =
            undefined;
        }
      }


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);
        };


      params.callback =
        callbackName;


      const query =
        Object.keys(params)
          .map(function(key) {

            return (
              encodeURIComponent(key) +
              '=' +
              encodeURIComponent(
                params[key]
              )
            );

          })
          .join('&');


      script.src =
        API_URL +
        '?'+
        query;


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Connexion Google Apps Script impossible'
            )
          );
        };


      document.body.appendChild(
        script
      );

    }
  );
}


/****************************************************
 * TEST API
 ****************************************************/

async function testAPI() {

  try {

    const result =
      await apiGet({
        action: 'ping'
      });

    console.log(
      'API:',
      result
    );

    if (!result.success) {
      throw new Error(
        result.message
      );
    }

  } catch(error) {

    console.error(
      'API inaccessible :',
      error
    );
  }
}


/****************************************************
 * CHOISIR CAMERA ARRIERE
 ****************************************************/

function chooseBackCamera(list) {

  if (!list || list.length === 0) {
    return null;
  }

  // Priorité aux noms indiquant caméra arrière
  const back =
    list.find(function(camera) {

      return /back|rear|environment|arrière|trasera/i
        .test(camera.label);

    });

  if (back) {
    return back;
  }

  // Sur beaucoup de téléphones Android,
  // la dernière caméra est la caméra arrière.
  if (list.length > 1) {
    return list[list.length - 1];
  }

  return list[0];
}


/****************************************************
 * AFFICHER CAMERAS
 ****************************************************/

function displayCameras(list) {

  cameraSelect.innerHTML = '';

  list.forEach(
    function(camera, index) {

      const option =
        document.createElement('option');

      option.value =
        camera.id;

      option.textContent =
        camera.label ||
        ('Caméra ' + (index + 1));

      cameraSelect.appendChild(
        option
      );

    }
  );

  cameraDetected.textContent =
    '📷 ' +
    list.length +
    ' caméra(s) détectée(s)';
}


/****************************************************
 * DEMANDER PERMISSION + DETECTER CAMERAS
 ****************************************************/

async function detectCameras() {

  // Première demande d'autorisation
  let temporaryStream = null;

  try {

    temporaryStream =
      await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: {
            ideal: 'environment'
          }
        },
        audio: false
      });

  } catch(error) {

    console.error(
      'Permission caméra :',
      error
    );

    throw new Error(
      'Autorisation caméra refusée ou caméra indisponible.'
    );

  } finally {

    if (temporaryStream) {

      temporaryStream
        .getTracks()
        .forEach(function(track) {

          track.stop();

        });

    }
  }


  const devices =
    await navigator.mediaDevices
      .enumerateDevices();


  cameras =
    devices.filter(
      function(device) {

        return device.kind ===
          'videoinput';

      }
    );


  if (cameras.length === 0) {

    throw new Error(
      'Aucune caméra détectée.'
    );
  }


  displayCameras(
    cameras
  );


  const backCamera =
    chooseBackCamera(
      cameras
    );


  if (backCamera) {

    selectedCameraId =
      backCamera.id;

    cameraSelect.value =
      selectedCameraId;

    cameraName.textContent =
      '📷 Caméra choisie : ' +
      (
        backCamera.label ||
        'Caméra arrière'
      );
  }
}


/****************************************************
 * OUVRIR SCANNER
 ****************************************************/

async function openScanner() {

  // Protection Android contre double transition
  if (cameraBusy) {
    return;
  }

  cameraBusy = true;

  hideMessage(
    cameraMessage
  );

  try {

    // Toujours arrêter avant de redémarrer
    await stopScanner();

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        'La caméra n’est pas disponible dans ce navigateur.'
      );
    }


    cameraZone.style.display =
      'block';


    await detectCameras();


    if (!selectedCameraId) {

      throw new Error(
        'Impossible de sélectionner une caméra.'
      );
    }


    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * On utilise l'ID de la caméra.
     *
     * Cela évite de demander à Android
     * de choisir une caméra au hasard.
     */

    await scanner.start(

      selectedCameraId,

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          /*
           * CADRAGE DU SCAN
           *
           * 0.75 = 75% largeur
           * 0.50 = 50% hauteur
           *
           * Pour modifier :
           *
           * PLUS GRAND :
           * 0.85 / 0.65
           *
           * PLUS PETIT :
           * 0.60 / 0.40
           */

          const size =
            Math.min(
              viewfinderWidth * 0.75,
              viewfinderHeight * 0.50
            );

          return {
            width:
              Math.floor(size),

            height:
              Math.floor(size)
          };
        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      onScanSuccess,

      function(errorMessage) {

        // Pas besoin d'afficher
        // les erreurs normales de scan.
      }

    );


    scannerRunning =
      true;


    openCameraBtn.textContent =
      '⛔ FERMER LA CAMÉRA';


  } catch(error) {

    console.error(
      'CAMERA ERROR:',
      error
    );

    showMessage(
      cameraMessage,
      '❌ IMPOSSIBLE D’OUVRIR LA CAMÉRA.\n' +
      error.message,
      'error'
    );


    cameraZone.style.display =
      'none';


  } finally {

    // IMPORTANT
    cameraBusy = false;
  }
}


/****************************************************
 * FERMER SCANNER
 ****************************************************/

async function stopScanner() {

  try {

    if (scanner) {

      if (scannerRunning) {

        try {

          await scanner.stop();

        } catch(error) {

          console.log(
            'Scanner déjà arrêté.'
          );
        }
      }


      try {

        await scanner.clear();

      } catch(error) {

        console.log(
          'Clear scanner :',
          error
        );
      }


      scanner =
        null;

      scannerRunning =
        false;
    }

  } catch(error) {

    console.error(
      'STOP CAMERA:',
      error
    );
  }


  openCameraBtn.textContent =
    '📷 OUVRIR CAMÉRA 1×';
}


/****************************************************
 * BOUTON CAMERA
 ****************************************************/

openCameraBtn.addEventListener(
  'click',
  async function() {

    if (cameraBusy) {
      return;
    }

    if (scannerRunning) {

      cameraBusy = true;

      try {

        await stopScanner();

        cameraZone.style.display =
          'none';

      } finally {

        cameraBusy = false;
      }

      return;
    }

    await openScanner();
  }
);


/****************************************************
 * CHANGER CAMERA
 ****************************************************/

cameraSelect.addEventListener(
  'change',
  async function() {

    if (!cameraSelect.value) {
      return;
    }

    selectedCameraId =
      cameraSelect.value;

    const camera =
      cameras.find(
        function(item) {

          return item.id ===
            selectedCameraId;

        }
      );

    if (camera) {

      cameraName.textContent =
        '📷 Caméra choisie : ' +
        (
          camera.label ||
          'Caméra'
        );
    }


    // Redémarrer proprement
    if (scannerRunning) {

      if (cameraBusy) {
        return;
      }

      cameraBusy = true;

      try {

        await stopScanner();

        scanner =
          new Html5Qrcode(
            'reader'
          );


        await scanner.start(

          selectedCameraId,

          {
            fps: 10,

            qrbox: function(
              viewfinderWidth,
              viewfinderHeight
            ) {

              const size =
                Math.min(
                  viewfinderWidth * 0.75,
                  viewfinderHeight * 0.50
                );

              return {
                width:
                  Math.floor(size),

                height:
                  Math.floor(size)
              };
            },

            aspectRatio: 1.0,

            disableFlip: false

          },

          onScanSuccess,

          function() {}

        );

        scannerRunning =
          true;

      } catch(error) {

        showMessage(
          cameraMessage,
          '❌ Impossible de changer de caméra.',
          'error'
        );

      } finally {

        cameraBusy = false;
      }
    }
  }
);


/****************************************************
 * SCAN REUSSI
 ****************************************************/

function onScanSuccess(
  decodedText,
  decodedResult
) {

  const now =
    Date.now();


  // Éviter plusieurs lectures
  // du même code en quelques secondes
  if (
    decodedText === lastDecodedText &&
    now - lastDecodedTime < 3000
  ) {
    return;
  }


  lastDecodedText =
    decodedText;

  lastDecodedTime =
    now;


  const value =
    String(decodedText || '')
      .trim();


  if (!value) {
    return;
  }


  sn.value =
    value;


  scanResult.textContent =
    '✅ Code détecté : ' +
    value;


  scanResult.classList.remove(
    'hidden'
  );


  // Fermer automatiquement la caméra
  closeCameraAfterScan();
}


/****************************************************
 * FERMER APRES SCAN
 ****************************************************/

async function closeCameraAfterScan() {

  if (cameraBusy) {
    return;
  }

  cameraBusy = true;

  try {

    await stopScanner();

    cameraZone.style.display =
      'none';

  } finally {

    cameraBusy = false;
  }
}


/****************************************************
 * VERIFIER SN
 ****************************************************/

async function checkSN() {

  const value =
    sn.value.trim();

  if (!value) {

    showMessage(
      resultMessage,
      '❌ Veuillez scanner ou saisir le SN.',
      'error'
    );

    return false;
  }


  try {

    const result =
      await apiGet({
        action: 'checkSN',
        sn: value
      });


    if (!result.success) {

      showMessage(
        resultMessage,
        '❌ ' +
        result.message,
        'error'
      );

      return false;
    }


    if (result.exists) {

      showMessage(
        resultMessage,
        '🚫 SN DÉJÀ SCANNÉ',
        'error'
      );

      return false;
    }


    return true;


  } catch(error) {

    console.error(
      error
    );

    showMessage(
      resultMessage,
      '❌ Impossible de contacter Google Sheet.',
      'error'
    );

    return false;
  }
}


/****************************************************
 * ENREGISTRER
 ****************************************************/

saveBtn.addEventListener(
  'click',
  async function() {

    hideMessage(
      resultMessage
    );


    // Intervenant
    const nom =
      intervenant.value.trim();

    if (!nom) {

      showMessage(
        resultMessage,
        '❌ Veuillez saisir l’intervenant.',
        'error'
      );

      intervenant.focus();

      return;
    }


    // Repère
    const repereOK =
      updateRepere();

    if (!repereOK) {

      showMessage(
        resultMessage,
        '❌ REPÈRE PAS CORRECT. ÉCRIRE COMME : CB1-S1-01',
        'error'
      );

      repere.focus();

      return;
    }


    // SN
    const snValue =
      sn.value.trim();

    if (!snValue) {

      showMessage(
        resultMessage,
        '❌ Veuillez scanner ou saisir le SN.',
        'error'
      );

      sn.focus();

      return;
    }


    saveBtn.disabled =
      true;

    saveBtn.textContent =
      '⏳ VÉRIFICATION...';


    try {

      // Vérifier doublon AVANT sauvegarde
      const available =
        await checkSN();


      if (!available) {
        return;
      }


      saveBtn.textContent =
        '⏳ ENREGISTREMENT...';


      const result =
        await apiGet({

          action: 'save',

          intervenant:
            nom,

          repere:
            repere.value.trim()
              .toUpperCase(),

          sn:
            snValue,

          typeScan:
            'CAMERA'

        });


      if (!result.success) {

        if (result.duplicate) {

          showMessage(
            resultMessage,
            '🚫 SN DÉJÀ SCANNÉ',
            'error'
          );

        } else {

          showMessage(
            resultMessage,
            '❌ ' +
            result.message,
            'error'
          );
        }

        return;
      }


      showMessage(
        resultMessage,
        '✅ SN ENREGISTRÉ — ' +
        result.repere +
        ' — ' +
        result.sn,
        'success'
      );


    } catch(error) {

      console.error(
        'SAVE ERROR:',
        error
      );


      showMessage(
        resultMessage,
        '❌ Impossible de contacter Google Sheet.',
        'error'
      );


    } finally {

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        '✅ ENREGISTRER SN';
    }

  }
);


/****************************************************
 * NOUVEAU SCAN
 ****************************************************/

newBtn.addEventListener(
  'click',
  async function() {

    if (cameraBusy) {
      return;
    }

    cameraBusy = true;

    try {

      await stopScanner();

      cameraZone.style.display =
        'none';


      sn.value =
        '';

      scanResult.textContent =
        '';

      scanResult.classList.add(
        'hidden'
      );


      hideMessage(
        resultMessage
      );


      lastDecodedText =
        '';

      lastDecodedTime =
        0;


      sn.focus();


    } finally {

      cameraBusy = false;
    }
  }
);


/****************************************************
 * EMPÊCHER L'ENVOI AVEC ENTER
 ****************************************************/

document.addEventListener(
  'keydown',
  function(event) {

    if (
      event.key === 'Enter' &&
      document.activeElement === sn
    ) {

      event.preventDefault();
    }
  }
);


/****************************************************
 * INITIALISATION
 ****************************************************/

window.addEventListener(
  'load',
  function() {

    updateRepere();

    testAPI();

  }
);


/****************************************************
 * NETTOYAGE QUAND ON QUITTE LA PAGE
 ****************************************************/

window.addEventListener(
  'beforeunload',
  function() {

    if (scanner) {

      try {
        scanner.stop();
      } catch(e) {}

    }
  }
);

</script>

</body>
</html>
