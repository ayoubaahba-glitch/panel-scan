<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>SCAN PANNEAUX</title>

  <!-- Scanner caméra -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin: 10px 0 18px;
    }

    .card {
      background: #fff;
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 2px 9px rgba(0,0,0,.12);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #bbb;
      border-radius: 9px;
      background: #fff;
    }

    button {
      width: 100%;
      border: 0;
      padding: 15px;
      margin-top: 10px;
      border-radius: 9px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .camera-btn {
      background: #16a34a;
      color: #fff;
    }

    .stop-btn {
      background: #dc2626;
      color: #fff;
    }

    .save-btn {
      background: #2563eb;
      color: #fff;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
      overflow: hidden;
      border-radius: 10px;
    }

    .repere-title {
      text-align: center;
      font-size: 14px;
      color: #666;
    }

    .repere-value {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-top: 5px;
    }

    .remaining {
      text-align: center;
      font-size: 18px;
      margin-top: 8px;
      font-weight: bold;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 15px;
    }

    .info {
      background: #e0f2fe;
      color: #075985;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .warning {
      background: #fef3c7;
      color: #92400e;
    }

    .result {
      line-height: 1.8;
      font-size: 17px;
    }

    .small {
      text-align: center;
      color: #666;
      font-size: 13px;
      margin-top: 7px;
    }
  </style>
</head>


<body>

<div class="container">

  <h1>📋 SCAN PANNEAUX</h1>


  <!-- REPERE -->

  <div class="card">

    <label for="repere">
      👷 REPERE / INSPECTEUR
    </label>

    <select id="repere">
      <option value="">
        -- Sélectionner le REPERE --
      </option>
    </select>

    <div class="small">
      Sélectionnez le REPERE de la chaîne à inspecter.
    </div>

  </div>


  <!-- REPERE ACTUEL -->

  <div class="card">

    <div class="repere-title">
      REPERE ACTUEL
    </div>

    <div
      id="currentRepere"
      class="repere-value"
    >
      Aucun
    </div>

    <div
      id="remaining"
      class="remaining"
    >
      Panneaux restants : -
    </div>

  </div>


  <!-- CAMERA -->

  <div class="card">

    <button
      id="startCamera"
      class="camera-btn"
      type="button"
      onclick="startCamera()"
    >
      📷 OUVRIR LA CAMÉRA
    </button>

    <button
      id="stopCamera"
      class="stop-btn"
      type="button"
      onclick="stopCamera()"
      style="display:none;"
    >
      ❌ FERMER LA CAMÉRA
    </button>

    <div id="reader"></div>

  </div>


  <!-- SAISIE MANUELLE -->

  <div class="card">

    <label for="sn">
      SN
    </label>

    <input
      id="sn"
      type="text"
      placeholder="Scanner ou saisir le SN..."
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
    >

    <button
      id="saveButton"
      class="save-btn"
      type="button"
      onclick="saveSN()"
    >
      ✅ ENREGISTRER SN
    </button>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status info"
  >
    ⏳ Chargement des REPERE...
  </div>


  <!-- RESULTAT -->

  <div
    id="result"
    class="card result"
    style="display:none;"
  ></div>

</div>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP
   ========================================================= */

const API_URL =
  'https://script.google.com/macros/s/AKfycbwhfATP060XPj9KMcgOvTnnKnP96RJWV_VkznC0733WFvWcQ_oX7XOgBIQct4osb2o1/exec';


/* =========================================================
   VARIABLES
   ========================================================= */

let html5QrCode = null;

let cameraRunning = false;

let processing = false;

let lastScanned = '';


/* =========================================================
   DEMARRAGE
   ========================================================= */

window.addEventListener('load', function() {

  loadReperes();

});


/* =========================================================
   CHARGER LES REPERE
   ========================================================= */

function loadReperes() {

  showStatus(
    '⏳ Chargement des REPERE...',
    'info'
  );

  const callback =
    'getReperes_' + Date.now();


  window[callback] = function(data) {

    try {

      if (!data || !data.ok) {

        showStatus(
          '❌ Impossible de charger les REPERE.',
          'error'
        );

        return;
      }


      const select =
        document.getElementById('repere');


      select.innerHTML =
        '<option value="">-- Sélectionner le REPERE --</option>';


      if (
        !Array.isArray(data.reperes) ||
        data.reperes.length === 0
      ) {

        showStatus(
          '⚠️ Aucun REPERE trouvé dans la colonne C.',
          'warning'
        );

        return;
      }


      data.reperes.forEach(function(repere) {

        const option =
          document.createElement('option');

        option.value = repere;

        option.textContent = repere;

        select.appendChild(option);

      });


      showStatus(
        '✅ REPERE chargés. Sélectionnez votre REPERE.',
        'success'
      );


    } catch (error) {

      showStatus(
        '❌ Erreur : ' + error.message,
        'error'
      );

    }


    cleanupJsonp(callback);

  };


  const script =
    document.createElement('script');


  script.id = callback;


  script.src =
    API_URL +
    '?action=getReperes' +
    '&callback=' +
    encodeURIComponent(callback) +
    '&t=' +
    Date.now();


  script.onerror = function() {

    showStatus(
      '❌ Impossible de contacter Google Sheet.',
      'error'
    );

    cleanupJsonp(callback);

  };


  document.body.appendChild(script);

}


/* =========================================================
   CHANGEMENT DE REPERE
   ========================================================= */

document
  .getElementById('repere')
  .addEventListener('change', function() {

    const repere = this.value;


    document
      .getElementById('currentRepere')
      .textContent =
      repere || 'Aucun';


    document
      .getElementById('remaining')
      .textContent =
      'Panneaux restants : -';


    document
      .getElementById('result')
      .style.display = 'none';


    if (!repere) {

      showStatus(
        '⚠️ Sélectionnez un REPERE.',
        'warning'
      );

      return;
    }


    showStatus(
      '✅ REPERE sélectionné : ' + repere,
      'success'
    );

  });


/* =========================================================
   OUVRIR CAMERA
   ========================================================= */

async function startCamera() {

  const repere =
    document
      .getElementById('repere')
      .value;


  if (!repere) {

    showStatus(
      '⚠️ Sélectionnez d’abord un REPERE.',
      'warning'
    );

    return;
  }


  if (cameraRunning) {
    return;
  }


  try {

    html5QrCode =
      new Html5Qrcode('reader');


    await html5QrCode.start(

      {
        facingMode: {
          ideal: 'environment'
        }
      },

      {
        fps: 10,

        qrbox: {
          width: 280,
          height: 160
        },

        aspectRatio: 1.777778
      },

      function(decodedText) {

        onScan(decodedText);

      },

      function(errorMessage) {

        // Erreurs normales pendant la recherche du code.
      }

    );


    cameraRunning = true;


    document
      .getElementById('startCamera')
      .style.display = 'none';


    document
      .getElementById('stopCamera')
      .style.display = 'block';


    showStatus(
      '📷 Caméra active — Scannez le SN.',
      'success'
    );


  } catch (error) {

    console.error(error);


    showStatus(
      '❌ Impossible d’ouvrir la caméra. ' +
      'Vérifiez l’autorisation caméra du navigateur.',
      'error'
    );

  }

}


/* =========================================================
   FERMER CAMERA
   ========================================================= */

async function stopCamera() {

  if (
    !html5QrCode ||
    !cameraRunning
  ) {
    return;
  }


  try {

    await html5QrCode.stop();

    html5QrCode.clear();

  } catch (error) {

    console.log(error);

  }


  cameraRunning = false;

  document
    .getElementById('startCamera')
    .style.display = 'block';

  document
    .getElementById('stopCamera')
    .style.display = 'none';

}


/* =========================================================
   CODE DETECTE PAR CAMERA
   ========================================================= */

function onScan(decodedText) {

  const sn =
    String(decodedText || '').trim();


  if (!sn) {
    return;
  }


  /*
   * Empêche la caméra de lire
   * le même code plusieurs fois.
   */

  if (processing) {
    return;
  }


  if (sn === lastScanned) {
    return;
  }


  lastScanned = sn;


  document
    .getElementById('sn')
    .value = sn;


  /*
   * Enregistrement automatique
   */

  saveSN();

}


/* =========================================================
   ENREGISTRER SN
   ========================================================= */

function saveSN() {

  if (processing) {
    return;
  }


  const repere =
    document
      .getElementById('repere')
      .value;


  const sn =
    document
      .getElementById('sn')
      .value
      .trim();


  if (!repere) {

    showStatus(
      '⚠️ Sélectionnez un REPERE.',
      'warning'
    );

    return;
  }


  if (!sn) {

    showStatus(
      '⚠️ SN vide.',
      'warning'
    );

    return;
  }


  processing = true;


  document
    .getElementById('saveButton')
    .disabled = true;


  showStatus(
    '⏳ Enregistrement de ' + sn + '...',
    'info'
  );


  const callback =
    'saveSN_' + Date.now();


  window[callback] = function(data) {

    try {

      if (!data) {

        showStatus(
          '❌ Réponse vide de Google Sheet.',
          'error'
        );

        return;
      }


      /* ================================================
         SCAN OK
         ================================================ */

      if (data.ok) {

        showStatus(
          '✅ ' + data.message,
          'success'
        );


        const result =
          document.getElementById('result');


        result.style.display = 'block';


        result.innerHTML =

          '<b>SN :</b> ' +
          escapeHtml(data.sn) +

          '<br><b>CB :</b> ' +
          escapeHtml(data.cb) +

          '<br><b>STRING :</b> ' +
          escapeHtml(data.string) +

          '<br><b>REPERE :</b> ' +
          escapeHtml(data.repere) +

          '<br><b>POSITION :</b> ' +
          escapeHtml(data.position);


        if (
          data.remaining !== undefined
        ) {

          document
            .getElementById('remaining')
            .textContent =
            '📦 Panneaux restants : ' +
            data.remaining;

        }


        /*
         * Vider le champ SN
         */

        document
          .getElementById('sn')
          .value = '';


        /*
         * Autoriser le prochain scan
         */

        lastScanned = '';

      }


      /* ================================================
         SN DUPLIQUE
         ================================================ */

      else if (data.duplicate) {

        showStatus(
          '🚫 ' + data.message,
          'error'
        );


        /*
         * Le SN reste affiché
         * pour que l'inspecteur voie lequel
         * est déjà utilisé.
         */

        lastScanned = '';

      }


      /* ================================================
         REPERE COMPLET
         ================================================ */

      else if (data.full) {

        showStatus(
          '⚠️ ' + data.message,
          'warning'
        );

        lastScanned = '';

      }


      /* ================================================
         AUTRE ERREUR
         ================================================ */

      else {

        showStatus(
          '❌ ' + (
            data.message ||
            'Erreur inconnue.'
          ),
          'error'
        );

        lastScanned = '';

      }


    } catch (error) {

      console.error(error);

      showStatus(
        '❌ Erreur : ' + error.message,
        'error'
      );

      lastScanned = '';

    }


    processing = false;


    document
      .getElementById('saveButton')
      .disabled = false;


    cleanupJsonp(callback);

  };


  const script =
    document.createElement('script');


  script.id = callback;


  script.src =
    API_URL +

    '?action=save' +

    '&sn=' +
    encodeURIComponent(sn) +

    '&repere=' +
    encodeURIComponent(repere) +

    '&callback=' +
    encodeURIComponent(callback) +

    '&t=' +
    Date.now();


  script.onerror = function() {

    processing = false;


    document
      .getElementById('saveButton')
      .disabled = false;


    lastScanned = '';


    showStatus(
      '❌ Impossible de contacter Google Sheet.',
      'error'
    );


    cleanupJsonp(callback);

  };


  document.body.appendChild(script);

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showStatus(message, type) {

  const status =
    document.getElementById('status');


  status.textContent = message;


  status.className =
    'status ' + type;

}


/* =========================================================
   NETTOYAGE JSONP
   ========================================================= */

function cleanupJsonp(callback) {

  try {

    delete window[callback];

  } catch (e) {}


  const script =
    document.getElementById(callback);


  if (script) {
    script.remove();
  }

}


/* =========================================================
   SECURITE AFFICHAGE
   ========================================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return '';
  }


  return String(value)

    .replace(/&/g, '&amp;')

    .replace(/</g, '&lt;')

    .replace(/>/g, '&gt;')

    .replace(/"/g, '&quot;')

    .replace(/'/g, '&#039;');

}

</script>

</body>
</html>
